<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lawn Mower Game 3D — Yard 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9d8ff;
    font-family: Fredoka, "Trebuchet MS", sans-serif; touch-action: none; user-select: none; }
  #view { display: block; width: 100%; height: 100%; }

  /* ---- top bar ---- */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: 50px; padding: 0 14px;
    display: flex; align-items: center; gap: 20px; color: #e8f5e0; font-size: 16px;
    background: rgba(22, 33, 15, 0.88); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .bar { position: relative; width: 130px; height: 20px; border-radius: 10px; background: #0b1308; overflow: hidden; }
  #cutFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #8fd16a; border-radius: 10px; }
  #cutTxt { position: absolute; inset: 0; text-align: center; line-height: 20px; font-size: 13px; font-weight: 600;
    text-shadow: 0 0 3px #0c140a, 0 0 3px #0c140a; }
  .fuel { display: flex; align-items: center; gap: 6px; }
  .fbar { width: 70px; height: 10px; border-radius: 5px; background: #0b1308; overflow: hidden; }
  #fuelFill { height: 100%; width: 100%; background: #8fd16a; border-radius: 5px; }
  #fuelFill.low { animation: blink 0.5s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #timer { font-weight: 600; color: #ffe9a3; min-width: 80px; }
  #medalNext { display: flex; align-items: center; gap: 6px; font-size: 15px; min-width: 64px; }
  #style { font-weight: 600; color: #fff3a0; min-width: 64px; }
  #combo { font-weight: 600; color: #ffab7a; font-size: 15px; min-width: 30px; }
  .spacer { flex: 1; }
  button { font: inherit; font-weight: 600; color: #fff; background: #479b33; border: 0; border-radius: 999px;
    padding: 6px 15px; box-shadow: 0 3px 0 #234f19; cursor: pointer; }
  button:hover { background: #5bb23f; }
  button.quiet { background: #2c3f25; box-shadow: 0 3px 0 #10180c; font-size: 14px; }
  button.quiet:hover { background: #3a5231; }

  /* ---- medals ---- */
  .medal { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--face);
    border: 2px solid var(--rim); box-shadow: inset 3px 3px 0 rgba(255,255,255,.35), inset -3px -3px 0 rgba(0,0,0,.12); vertical-align: middle; }
  .medal.big { width: 34px; height: 34px; border-width: 3px; }
  .gold   { --face: #ffd84a; --rim: #b8860b; color: #ffd84a; }
  .silver { --face: #e3e9ef; --rim: #8f9aa5; color: #e3e9ef; }
  .bronze { --face: #e39a5b; --rim: #8a5428; color: #e39a5b; }
  .none   { --face: #3a4a33; --rim: #101a0c; color: #8a9c80; }

  /* ---- minimap ---- */
  #miniWrap { position: fixed; right: 14px; bottom: 14px; width: 22vw; min-width: 200px; max-width: 400px;
    border-radius: 12px; overflow: hidden; border: 3px solid rgba(22,33,15,.9); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #mini { display: block; width: 100%; height: auto; }
  #help { position: fixed; left: 14px; bottom: 12px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000, 0 0 6px #000; opacity: 0.9; }
  .card button.big { font-size: 20px; padding: 12px 26px; margin-top: 4px; }
  .tiltnote { font-size: 13px; color: #c9dcbf; }
  /* ---- touch controls ---- */
  #touchUI { position: fixed; inset: 0; pointer-events: none; }
  #steerPad { position: fixed; left: 12px; bottom: 12px; width: 38vw; height: 34vh; max-width: 340px; pointer-events: auto;
    border-radius: 22px; background: rgba(255,255,255,0.10); border: 2px dashed rgba(255,255,255,0.35); touch-action: none; }
  #steerPad .hint { position: absolute; left: 0; right: 0; top: 8px; text-align: center; color: rgba(255,255,255,.75); font-size: 12px; }
  #knob { position: absolute; left: 50%; top: 55%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: rgba(255,255,255,0.85); box-shadow: 0 3px 10px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #2c3f25; }
  .pedal { position: fixed; pointer-events: auto; touch-action: none; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 600; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); user-select: none; }
  .pedal.on { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); filter: brightness(1.15); }
  #gasBtn { right: 18px; bottom: 18px; width: 110px; height: 110px; background: #479b33; font-size: 22px; }
  #revBtn { right: 140px; bottom: 22px; width: 72px; height: 72px; background: #a8513a; font-size: 14px; }
  body.touch #miniWrap { top: 48px; bottom: auto; left: 8px; right: auto; }
  #ctrlBtn .lbl { margin-left: 4px; }
  .modes { display: flex; flex-direction: column; gap: 7px; align-items: stretch; margin-top: 6px; }
  .modes button { font-size: 15px; padding: 8px 16px; }
  .modes button.rec { box-shadow: 0 3px 0 #234f19, 0 0 0 2px #ffe9a3; }
  #tiltDbg { position: fixed; left: 8px; bottom: 8px; color: #fff; font-size: 11px; background: rgba(0,0,0,.45);
    padding: 3px 8px; border-radius: 6px; pointer-events: none; }

  /* ---- phones held sideways: smaller bar, minimap and cards ---- */
  @media (max-height: 520px) {
    #hud { height: 40px; gap: 10px; padding: 0 8px; font-size: 13px; }
    .bar { width: 84px; height: 16px; }
    #cutTxt { line-height: 16px; font-size: 11px; }
    .fbar { width: 44px; }
    #timer { min-width: 58px; }
    #medalNext { font-size: 12px; min-width: 46px; }
    #style, #combo { min-width: 0; font-size: 13px; }
    button { padding: 5px 10px; font-size: 13px; }
    #camBtn .lbl { display: none; }
    #help { display: none; }
    #miniWrap { width: 24vw; min-width: 120px; right: 8px; bottom: 8px; border-width: 2px; }
    .card { min-width: 0; max-width: 70vw; padding: 8px 16px 10px; top: calc(50% + 20px);
            max-height: calc(100vh - 56px); overflow-y: auto; box-sizing: border-box; }
    .card h1 { font-size: 17px; }
    .card p { margin: 4px 0; font-size: 12px; line-height: 1.35; }
    .card .medals { margin: 2px 0; font-size: 14px; gap: 16px; }
    .card .medal.big { width: 24px; height: 24px; }
    .card .btns { margin-top: 6px; }
    .card button.big { font-size: 16px; padding: 8px 20px; }
    .card .tiltnote { font-size: 11px; margin-bottom: 0; }
    .card .sub { display: none; }
    .card .modes { gap: 5px; margin-top: 4px; }
    .card .modes button { font-size: 13px; padding: 6px 12px; }
    #gasBtn { width: 92px; height: 92px; font-size: 19px; }
    #revBtn { right: 120px; width: 62px; height: 62px; font-size: 12px; }
    .pop { font-size: 15px !important; }
  }

  /* ---- intro & results cards ---- */
  .card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 360px; max-width: 90vw;
    padding: 18px 28px 20px; text-align: center; color: #e8f5e0; border-radius: 18px;
    background: rgba(27, 42, 22, 0.95); border: 2px solid #8fd16a; box-shadow: 0 8px 30px rgba(0,0,0,.45);
    animation: popin 0.22s ease-out; }
  @keyframes popin { from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; } }
  .card h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .card p { margin: 10px 0; line-height: 1.55; font-size: 15px; }
  .card .medals { display: flex; justify-content: center; gap: 30px; margin: 10px 0 6px; font-size: 18px; font-weight: 600; }
  .card .medals span.m { display: flex; align-items: center; gap: 8px; }
  .card .head { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
  .card .small { font-size: 13px; color: #ffe9a3; }
  .card .btns { display: flex; justify-content: center; gap: 20px; margin-top: 14px; }
  .hidden { display: none !important; }

  /* ---- pause ---- */
  body.paused #touchUI, body.paused #pullBtn { display: none !important; }
  #pauseCard .btns { flex-wrap: wrap; gap: 12px; }
  #pauseCard .small { margin-top: 10px; }

  /* ---- phone held upright: ask to turn it sideways ---- */
  #rotateMsg { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotateMsg { display: flex; position: fixed; inset: 0; z-index: 50; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; text-align: center; color: #e8f5e0; font-size: 20px;
      background: rgba(22, 33, 15, 0.97); }
    #rotateMsg .phone { font-size: 64px; animation: turnme 1.6s ease-in-out infinite; }
    #rotateMsg small { font-size: 14px; color: #ffe9a3; }
  }
  @keyframes turnme { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  body.inhub #hud, body.inhub #miniWrap, body.inhub #touchUI, body.inhub #help, body.inhub #tiltDbg { display: none !important; }

  /* ---- floating text ---- */
  #pops { position: fixed; inset: 0; pointer-events: none; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 600; font-size: 19px; white-space: nowrap;
    text-shadow: 0 0 4px #0c140a, 0 0 4px #0c140a, 0 2px 2px #0c140a; animation: rise 1.1s ease-out forwards; }
  @keyframes rise { to { transform: translate(-50%, -190%); opacity: 0; } }

  /* ---- stripe meter, ghost race, pulses and flashes ---- */
  #stripe { position: relative; width: 70px; height: 14px; border-radius: 7px; background: #0b1308; overflow: hidden; }
  #stripeFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e8f5e0; border-radius: 7px; transition: background 0.15s; }
  #stripeFill.ready { background: #ffd84a; box-shadow: 0 0 8px #ffd84a; }
  #stripeFill.bad { background: #c0634a; }
  #stripe span { position: absolute; inset: 0; text-align: center; line-height: 14px; font-size: 10px; font-weight: 600;
    color: #fff; text-shadow: 0 0 3px #0c140a, 0 0 3px #0c140a; letter-spacing: 0.5px; }
  #ghostDelta { font-size: 14px; font-weight: 600; min-width: 70px; }
  #ghostDelta.ahead { color: #9be37a; } #ghostDelta.behind { color: #ff8a6b; }
  #timer.hurry { color: #ffab4a; animation: blink 0.5s steps(1) infinite; }
  .pulse { animation: pulse 0.35s ease-out; }
  @keyframes pulse { 40% { transform: scale(1.6); } }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s; }
  #flash.red { box-shadow: inset 0 0 90px 10px rgba(255, 70, 50, 0.65); }
  #flash.gold { box-shadow: inset 0 0 90px 10px rgba(255, 216, 74, 0.55); }
  #flash.on { opacity: 1; transition: none; }
  #pullBtn { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); font-size: 26px; padding: 18px 34px;
    background: #c2512f; box-shadow: 0 6px 0 #6e2614; }
  #pullBtn small { display: block; font-size: 13px; font-weight: 400; opacity: 0.9; }
  #pullBtn.yank { transform: translate(-50%, -42%); box-shadow: 0 2px 0 #6e2614; }

  /* ---- the clipboard (business hub) ---- */
  #hub { min-width: 0; width: min(760px, 94vw); max-height: 88vh; overflow-y: auto; box-sizing: border-box; text-align: left; }
  #hub h1 { text-align: center; }
  #hub .top { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; margin: 6px 0 4px; font-size: 15px; }
  #hub .top b { color: #ffe9a3; }
  #hub h2 { font-size: 15px; margin: 12px 0 6px; color: #8fd16a; text-transform: uppercase; letter-spacing: 1px; }
  #hub .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin: 5px 0; border-radius: 10px;
    background: rgba(255,255,255,0.06); }
  #hub .row .info { flex: 1; min-width: 0; }
  #hub .row .name { font-weight: 600; }
  #hub .row .sub2 { font-size: 13px; color: #c9dcbf; }
  #hub .row button { font-size: 14px; padding: 6px 12px; white-space: nowrap; }
  #hub .row { flex-wrap: wrap; } #hub .row .info { min-width: 200px; }
  #hub .row.locked { opacity: 0.55; }
  #hub .row img.pic { width: 96px; height: 60px; object-fit: contain; flex: none; border-radius: 8px;
    background: radial-gradient(ellipse at 50% 70%, rgba(255,255,255,0.16), rgba(255,255,255,0.02) 70%); }
  #hub button:disabled { background: #3c4637; box-shadow: 0 3px 0 #1b2117; color: #9aa592; cursor: default; }
  #hub .warn { color: #ffab7a; } #hub .good { color: #9be37a; }
  #hub .note { margin: 8px 0; padding: 8px 12px; border-radius: 10px; background: rgba(255, 233, 163, 0.12);
    border-left: 4px solid #ffe9a3; font-size: 14px; line-height: 1.45; }
  #hub .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #hub .meter { display: inline-block; width: 60px; height: 9px; border-radius: 5px; background: #0b1308; vertical-align: middle; overflow: hidden; }
  #hub .meter i { display: block; height: 100%; background: #8fd16a; }
  @media (max-height: 520px) {
    #stripe { width: 44px; } #stripe span { display: none; }
    #ghostDelta { font-size: 12px; min-width: 0; }
    #hub { max-height: calc(100vh - 16px); top: 50%; padding: 8px 14px; }
    #hub h2 { margin: 8px 0 4px; font-size: 13px; }
    #hub .row { padding: 4px 8px; margin: 3px 0; }
    #hub .row .sub2 { font-size: 11px; }
    #hub .row img.pic { width: 72px; height: 45px; }
    #hub .top { font-size: 13px; }
    #pullBtn { font-size: 20px; padding: 12px 24px; }
  }
</style>
<!-- Three.js is the 3D engine. This tells the browser where to download it from. -->
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div class="bar"><div id="cutFill"></div><div id="cutTxt">0% cut</div></div>
  <div class="fuel">⛽<div class="fbar"><div id="fuelFill"></div></div></div>
  <div id="timer">⏱ 0.0s</div>
  <div id="medalNext"><span id="medalIcon" class="medal gold"></span><span id="medalTxt"></span></div>
  <div id="style">★ 0</div>
  <div id="combo"></div>
  <div id="stripe" title="Clean stripe building up"><div id="stripeFill"></div><span>STRIPE</span></div>
  <div id="ghostDelta"></div>
  <div class="spacer"></div>
  <button id="ctrlBtn" class="quiet hidden">🎮<span class="lbl"></span></button>
  <button id="levelBtn" class="quiet hidden">⟲ Level</button>
  <button id="toolBtn" class="hidden" title="Swap mower / trimmer (T)">🌿 Trimmer</button>
  <button id="pauseBtn" class="quiet" title="Pause (P)">⏸</button>
  <button id="hubBtn" class="quiet" title="Clipboard (Esc)">📋</button>
  <button id="camBtn" class="quiet">🎥</button>
  <button id="finishBtn">Finish ✓</button>
</div>

<div id="miniWrap"><canvas id="mini" width="640" height="448"></canvas></div>
<div id="tiltDbg" class="hidden"></div>
<div id="touchUI" class="hidden">
  <div id="steerPad"><div class="hint">drag left / right to steer</div><div id="knob">⇆</div></div>
  <div id="revBtn" class="pedal">REV</div>
  <div id="gasBtn" class="pedal">GO</div>
</div>
<div id="help">Arrows / WASD drive · P pause · C camera · G ghost · M sound · Q graphics · R restart · Esc clipboard</div>
<div id="intro" class="card"></div>
<div id="results" class="card hidden"></div>
<div id="pauseCard" class="card hidden"></div>
<div id="rotateMsg"><div class="phone">📱</div>Turn your phone sideways to mow<small>The game pauses until you do</small></div>
<div id="hub" class="card hidden"></div>
<div id="flash"></div>
<button id="pullBtn" class="hidden">PULL THE CORD<small>tap fast · or press SPACE</small></button>
<div id="pops"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
//  SETTINGS — the same yard and rules as the 2D version
//  (1 unit in the 3D world = 1 pixel of the old overhead map)
// =====================================================================
const CELL = 8;                       // size of one "grass cell" (used for scoring)
// The yard size changes with each customer (set in loadYard). The lawn pictures are drawn
// as one 640 × 448 "tile" that repeats seamlessly across bigger yards.
let YARD_W = 640, YARD_H = 448;
let COLS = YARD_W / CELL, ROWS = YARD_H / CELL;
const TILE_W = 640, TILE_H = 448;
const yardSizeU = { value: new THREE.Vector2(YARD_W, YARD_H) };     // the yard size, for the graphics card
const tileRepU = { value: new THREE.Vector2(1, 1) };                // how many lawn tiles fit across the yard

const MOWER = {
  speed: 120,         // forward speed (units per second)
  reverseSpeed: 60,
  turnSpeed: 3.0,     // radians per second
  deckRadius: 16,     // half the cutting width
  bodyRadius: 14      // size used for bumping into things
};

const MEDALS = { gold: 1.55, silver: 1.9, bronze: 2.4 };   // medal time = perfect time × this
const FUEL_TANK = 2.5;
const IDLE_BURN = 0.3;
const STRIPE_MIN = 100;
const STRIPE_FRESH = 0.65;
const MAX_COMBO = 5;
const OVERLAP_LIMIT = 60;
const TIP_RATE = 200;

// ---- Camera ----  (try changing these!)
//  dist = how far behind, height = how high up, side = how far to the right (over the shoulder),
//  ahead = how far in front of the mower the camera looks, lag = how quickly it swings round (bigger = faster)
const CAMERA = {
  fov: 55,
  turning: { dist: 205, height: 215, side: 34, ahead: 150, lag: 2.6 },
  fixed:   { dist: 215, height: 245, side: 0,  ahead: 95,  lag: 4 }
};

// grass texture sharpness (pixels per unit). Phones get smaller pictures: they have less graphics memory,
// and a lawn picture that doesn't fit shows up black.
const TEX = window.matchMedia('(pointer: coarse)').matches ? 1.5 : 3;

// ---- Tilt controls (phones) ----
//  Hold the phone sideways like a tray. Tilt it away from you to drive forward,
//  towards you to back up, and turn it like a steering wheel to steer.
const TILT = {
  forward: 12,       // degrees of forward tilt for full speed
  steer: 20,         // degrees of steering-wheel turn for the sharpest turn
  dead: 3,           // degrees you can wobble without anything happening
  settle: 0.5,       // seconds to wait for the phone to settle before setting "level"
  invertSteer: false,   // set to true if left and right feel backwards
  invertDrive: false    // set to true if forward and back feel backwards
};

// ---- Phone steering helpers (all phone control styles) ----
const STEERING = {
  smooth: 0.12,      // seconds of smoothing: bigger = calmer, smaller = quicker
  curve: 1.6,        // bigger = gentler near the middle (finer control), still full turn at the edge
  // Magnetic straight lines: the mower is pulled toward straight up/down/left/right on the lawn
  // (parallel or perpendicular to the yard), so long clean stripes are easy on a phone.
  assist: true,      // turn the magnet on or off
  assistAngle: 15,   // it grabs you when you're within this many degrees of straight
  assistPull: 7,     // how strongly it pulls (bigger = snaps into line faster)
  assistHold: 0.35,  // steering harder than this (0–1) breaks free of the magnet, for real turns
  assistLine: true,  // show a faint guide line on the lawn when you're locked onto a straight line
  autoSpeed: 0.85    // auto-drive speed (1 = full speed)
};

// ---- The customers' yards ----
//  Every lot on the street is the same size (640 × 448). The driveway must run to the
//  bottom edge (that's where the street is). house.look = colors, door/garage/window spots.
//  pay = what they pay for a full mow. stars = reputation (★) you need before they ask you.
const YARDS = [
  { id: 'peterson', name: 'Mrs. Peterson', pay: 25, stars: 0, pet: { kind: 'cat', name: 'Whiskers' },
    story: 'Mrs. Peterson next door needs her lawn mowed every few days. Dad gave you his old push mower. Time to start a business!',
    house:    { x: 30,  y: 20,  w: 220, h: 150 },
    look:     { wall: 0xf3e6c9, roof: '#c4603a', garage: 100, door: 185, chimney: [158, 34],
                windows: [[30, 's'], [40, 'n'], [110, 'n'], [180, 'n'], [45, 'e'], [105, 'e'], [45, 'w'], [105, 'w']] },
    driveway: { x: 95,  y: 170, w: 70,  h: 278 },
    beds:     [ { x: 460, y: 24, w: 150, h: 46 } ],
    trees:    [ { x: 420, y: 150, r: 26 }, { x: 545, y: 330, r: 22 }, { x: 300, y: 365, r: 18 } ],
    start:    { x: 130, y: 415, angle: -Math.PI / 2 } },
  { id: 'alvarez', name: 'Mr. Alvarez', pay: 30, stars: 1, pet: { kind: 'dog', name: 'Bruno' },
    story: 'Mr. Alvarez saw your stripes from across the street. "Can you do mine too? Watch out for my roses."',
    house:    { x: 380, y: 20,  w: 230, h: 140 },
    look:     { wall: 0xdfe9d4, roof: '#4f6b8a', garage: 125, door: 200, chimney: [60, 30],

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const inRect = (x, y, r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
function circleHitsRect(x, y, rad, r) {
  const nx = clamp(x, r.x, r.x + r.w), ny = clamp(y, r.y, r.y + r.h);
  return (x - nx) ** 2 + (y - ny) ** 2 < rad * rad;
}
function obstacleHit(x, y, rad) {
  const rectHit = (r) => rad === 0 ? inRect(x, y, r) : circleHitsRect(x, y, rad, r);
  if (rectHit(YARD.house)) return true;
  for (const b of YARD.beds) if (rectHit(b)) return true;
  for (const p of YARD.props || []) if (rectHit(p)) return true;
  for (const t of YARD.trees) if (Math.hypot(x - t.x, y - t.y) < t.r + rad) return true;
  return false;
}
function collides(x, y) {
  const R = MOWER.bodyRadius;

//  cut mask for each tuft, so when you mow over it, it shrinks to stubble.
// ---------------------------------------------------------------------
const timeU = { value: 0 };
const grassLen = { value: 1 };   // 1 = normal; bigger when the customer waited too long and the grass is long
let grassMesh = null, tuftCount = 0;
function buildGrass(cells) {
  if (grassMesh) { scene.remove(grassMesh); grassMesh.geometry.dispose(); grassMesh.material.dispose(); grassMesh.dispose(); }
  const rnd = seeded(77);
  // one tuft = 4 thin, curved, pointed blades
  const pos = [], col = [], idx = [];
  const baseC = new THREE.Color(0x22461a), tipC = new THREE.Color(0x86ad55), c = new THREE.Color();   // dark roots, sunlit tips
  for (let b = 0; b < 4; b++) {
    const a = rnd() * Math.PI * 2, ox = (rnd() - 0.5) * 2.4, oz = (rnd() - 0.5) * 2.4;
    const h = 5 + rnd() * 3, w = 0.8 + rnd() * 0.5, lean = 0.3 + rnd() * 0.5;
    const px = -Math.sin(a), pz = Math.cos(a), start = pos.length / 3;
    for (let k = 0; k <= 3; k++) {
      const t = k / 3, y = h * t, bend = lean * t * t * h * 0.5, hw = w * (1 - t * 0.92) * 0.5;
      const x = ox + Math.cos(a) * bend, z = oz + Math.sin(a) * bend;
      pos.push(x - px * hw, y, z - pz * hw, x + px * hw, y, z + pz * hw);
      c.copy(baseC).lerp(tipC, t);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
    }
    for (let k = 0; k < 3; k++) {
      const i = start + k * 2;
      idx.push(i, i + 1, i + 2, i + 1, i + 3, i + 2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => i % 3 === 1 ? 1 : 0), 3));
  geo.setIndex(idx);

  const gm = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, side: THREE.DoubleSide, envMapIntensity: ENV });
  gm.onBeforeCompile = (sh) => {
    sh.uniforms.grassMask = maskU;
    sh.uniforms.yardSize = yardSizeU;
    sh.uniforms.time = timeU;
    sh.uniforms.grassLen = grassLen;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D grassMask; uniform vec2 yardSize; uniform float time; uniform float grassLen; varying float vCut; varying float vLight;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 tuftW = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vec4 mk = texture2D(grassMask, vec2(tuftW.x / yardSize.x, 1.0 - tuftW.z / yardSize.y));
        vCut = smoothstep(0.35, 0.75, mk.r);
        vLight = mk.g;
        float hgt = position.y / 8.0;
        transformed.y *= mix(grassLen, 0.13, vCut);                  // mowed: short stubble
        float sway = sin(time * 1.7 + tuftW.x * 0.045 + tuftW.z * 0.06) + 0.5 * sin(time * 3.1 + tuftW.z * 0.11);
        transformed.x += sway * 0.6 * hgt * hgt * (1.0 - vCut);       // a gentle breeze
      `);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vCut; varying float vLight;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 stripe = mix(vec3(0.06, 0.2, 0.04), vec3(0.24, 0.4, 0.15), smoothstep(0.35, 0.65, vLight));
        diffuseColor.rgb = mix(diffuseColor.rgb, stripe, vCut * 0.7);`)
      .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
        normal = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);   // light blades like the ground`);
  };

  // place 3 tufts in every grass cell, shuffled so we can show fewer on slow computers
  const spots = [];
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    if (cells[row * COLS + col] !== 1) continue;
    for (let k = 0; k < 3; k++) spots.push([col * CELL + rnd() * CELL, row * CELL + rnd() * CELL]);
  }
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  tuftCount = spots.length;
  addClouds(gm);   // the cloud shadows dim the grass blades too
  grassMesh = new THREE.InstancedMesh(geo, gm, tuftCount);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const tint = new THREE.Color();
  spots.forEach(([x, z], i) => {
    q.setFromAxisAngle(up, rnd() * Math.PI * 2);
    const s = 0.8 + rnd() * 0.45;
    m4.compose(v.set(x, 0, z), q, sc.set(s, s * (0.85 + rnd() * 0.3), s));
    grassMesh.setMatrixAt(i, m4);
    const k = 0.8 + rnd() * 0.4;   // some tufts a little lighter or darker
    grassMesh.setColorAt(i, tint.setRGB(k * (0.92 + rnd() * 0.16), k, k * (0.9 + rnd() * 0.2), THREE.LinearSRGBColorSpace));
  });
  grassMesh.frustumCulled = false;
  grassMesh.receiveShadow = true;
  scene.add(grassMesh);
}

const fadeables = [];   // things that turn see-through when they block your view

// A house with a hip roof. r = footprint rectangle (x, y = top-left on the map).
function buildHouse(r, o) {
  const g = new THREE.Group(), mats = [];
  const wallH = o.wallH || 100;
  const siding = stripeTex(8, 64, '#ffffff', [['rgba(0,0,0,0.13)', 1, 3]], false, () => 0.9, [1, wallH / 9]);
  const wall = mat(o.wall, { map: siding }); mats.push(wall);
  addMesh(new THREE.BoxGeometry(r.w, wallH, r.h), wall, r.x + r.w / 2, wallH / 2, r.y + r.h / 2, g);
  const trim = mat(0xb8a88a); mats.push(trim);
  addMesh(new THREE.BoxGeometry(r.w + 4, 8, r.h + 4), trim, r.x + r.w / 2, 4, r.y + r.h / 2, g);

  // windows: [x or z position along the wall, which wall]
  // real-looking glass: dark, and it reflects the sky
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x2c3f52, roughness: 0.06, metalness: 0.6, clearcoat: 1, envMapIntensity: ENV * 2.4 });
  const frame = mat(0xffffff), shutter = mat(o.shutter || new THREE.Color(o.roof).multiplyScalar(0.55).getHex());
  mats.push(glass, frame, shutter);
  const win = (px, pz, alongX, out) => {
    const fw = alongX ? [36, 30, 2] : [2, 30, 36], gw = alongX ? [30, 24, 2.6] : [2.6, 24, 30], y = wallH * 0.58;
    addMesh(new RoundedBoxGeometry(...fw, 2, 0.9), frame, px, y, pz, g);
    addMesh(new THREE.BoxGeometry(...gw), glass, px, y, pz, g);
    // window bars (a cross), a sill, and a shutter on each side
    addMesh(new THREE.BoxGeometry(alongX ? 1.4 : 3.2, 24, alongX ? 3.2 : 1.4), frame, px, y, pz, g);
    addMesh(new THREE.BoxGeometry(alongX ? 30 : 3.2, 1.4, alongX ? 3.2 : 30), frame, px, y, pz, g);
    addMesh(new RoundedBoxGeometry(alongX ? 40 : 5, 2.4, alongX ? 5 : 40, 1, 0.8), frame, px + (alongX ? 0 : out * 1.5), y - 15.5, pz + (alongX ? out * 1.5 : 0), g);
    for (const sd of [-1, 1]) {
      const o2 = sd * 23;
      addMesh(new RoundedBoxGeometry(alongX ? 9 : 1.6, 30, alongX ? 1.6 : 9, 1, 0.6), shutter, px + (alongX ? o2 : 0), y, pz + (alongX ? 0 : o2), g);
    }
  };
  for (const w of o.windows || []) {
    if (w[1] === 'n') win(r.x + w[0], r.y - 0.5, true, -1);
    if (w[1] === 's') win(r.x + w[0], r.y + r.h + 0.5, true, 1);
    if (w[1] === 'w') win(r.x - 0.5, r.y + w[0], false, -1);
    if (w[1] === 'e') win(r.x + r.w + 0.5, r.y + w[0], false, 1);
  }
  // white corner boards, so the walls don't look like plain boxes
  for (const [cx, cz] of [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]])
    addMesh(new RoundedBoxGeometry(5, wallH, 5, 1, 1), frame, cx, wallH / 2, cz, g);
  if (o.garage) {
    const gd = mat(0xf7f7f2), groove = mat(0xd6d6cf); mats.push(gd, groove);
    const gx = r.x + o.garage, gz = r.y + r.h + 1;
    addMesh(new THREE.BoxGeometry(64, 70, 2), gd, gx, 35, gz, g);
    for (const y of [18, 35, 52]) addMesh(new THREE.BoxGeometry(62, 1.5, 2.4), groove, gx, y, gz, g);
  }
  if (o.door) {
    const dm = mat(0x2f5d8a), knob = mat(0xe8c25a); mats.push(dm, knob);
    addMesh(new THREE.BoxGeometry(24, 52, 2), dm, r.x + o.door, 26, r.y + r.h + 1, g);
    addMesh(new THREE.SphereGeometry(1.6, 8, 6), knob, r.x + o.door + 7, 26, r.y + r.h + 2.5, g);
    addMesh(new RoundedBoxGeometry(30, 56, 2, 1, 0.8), frame, r.x + o.door, 27, r.y + r.h + 0.4, g);                       // door frame
    addMesh(new RoundedBoxGeometry(38, 5, 14, 2, 1.5), mat(0xbdb7ab, { roughness: 0.9 }), r.x + o.door, 2.5, r.y + r.h + 7, g);   // front step
  }

  // roof
  const ov = 10, x0 = r.x - ov, x1 = r.x + r.w + ov, z0 = r.y - ov, z1 = r.y + r.h + ov;
  const cz = (z0 + z1) / 2, i = (z1 - z0) / 2, y = wallH, Y = wallH + (o.roofH || 64);
  const A = [x0, y, z0], B = [x1, y, z0], C = [x1, y, z1], D = [x0, y, z1], R1 = [x0 + i, Y, cz], R2 = [x1 - i, Y, cz];
  const tris = [[A, B, R2], [A, R2, R1], [D, R1, R2], [D, R2, C], [A, R1, D], [B, C, R2]];
  const pos = [], uv = [];
  tris.forEach((t, k) => {
    const ends = k >= 4;   // the two triangle ends of the roof
    for (const p of t) { pos.push(...p); uv.push(ends ? p[2] / 50 : p[0] / 50, ends ? p[0] / 7 : p[2] / 7); }
  });

  rg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  rg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  rg.computeVertexNormals();
  const sc = canvas2d(64, 64), sctx = sc.getContext('2d');   // shingles
  sctx.fillStyle = o.roof; sctx.fillRect(0, 0, 64, 64);
  sctx.fillStyle = 'rgba(0,0,0,0.28)'; sctx.fillRect(0, 54, 64, 10);
  sctx.fillStyle = 'rgba(255,255,255,0.10)'; sctx.fillRect(0, 0, 64, 6);
  const roofMat = new THREE.MeshStandardMaterial({ map: texFrom(sc, [1, 1]), side: THREE.DoubleSide, roughness: 0.8, envMapIntensity: ENV });
  roofMat.map.wrapS = roofMat.map.wrapT = THREE.RepeatWrapping;
  mats.push(roofMat);
  addMesh(rg, roofMat, 0, 0, 0, g);
  // white boards along the edge of the roof
  const fascia = mat(0xf4f1ea); mats.push(fascia);
  addMesh(new RoundedBoxGeometry(x1 - x0 + 2, 5, 3, 2, 1), fascia, (x0 + x1) / 2, y - 1.5, z0, g);
  addMesh(new RoundedBoxGeometry(x1 - x0 + 2, 5, 3, 2, 1), fascia, (x0 + x1) / 2, y - 1.5, z1, g);
  addMesh(new RoundedBoxGeometry(3, 5, z1 - z0 + 2, 2, 1), fascia, x0, y - 1.5, (z0 + z1) / 2, g);
  addMesh(new RoundedBoxGeometry(3, 5, z1 - z0 + 2, 2, 1), fascia, x1, y - 1.5, (z0 + z1) / 2, g);
  if (o.chimney) {
    const brick = mat(0x8c5546), dark = mat(0x2a2422); mats.push(brick, dark);
    addMesh(new THREE.BoxGeometry(18, 46, 18), brick, r.x + o.chimney[0], wallH + 40, r.y + o.chimney[1], g);
    addMesh(new THREE.BoxGeometry(12, 2, 12), dark, r.x + o.chimney[0], wallH + 63.5, r.y + o.chimney[1], g);
  }
  (o.parent || scene).add(g);
  return { group: g, mats, box: new THREE.Box3().setFromObject(g) };
}

// Everything that belongs to the customer's yard goes in this group, so we can
// throw it all away and build the next customer's yard (see loadYard further down).
const yardGroup = new THREE.Group();
scene.add(yardGroup);

// Trees: a ring of mulch, a trunk with branches and a soft, lumpy leafy crown
const barkTex = stripeTex(64, 128, '#7a5636', [['#5e4128', 18, 2], ['#8c6643', 10, 1.5]], true, seeded(4), [2, 3]);
function leafBlob(s, seed, base) {
  let geo = new THREE.IcosahedronGeometry(s, 3);
  geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
  geo = mergeVertices(geo);                       // join the corners so the shape shades smoothly
  const p = geo.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color(), v = new THREE.Vector3();
  const dark = new THREE.Color(base).multiplyScalar(0.45), light = new THREE.Color(base).lerp(new THREE.Color(0xd8f07a), 0.3);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const big = noise3(v.x * 0.06 + seed, v.y * 0.06 + 3, v.z * 0.06);
    const small = noise3(v.x * 0.2 + seed, v.y * 0.2, v.z * 0.2);
    v.multiplyScalar(1 + (big - 0.5) * 0.4 + (small - 0.5) * 0.14);
    p.setXYZ(i, v.x, v.y, v.z);
    const up = v.y / s * 0.5 + 0.5, speck = noise3(v.x * 0.45 + seed, v.y * 0.45, v.z * 0.45);
    c.copy(dark).lerp(light, clamp(up * 0.85 + (speck - 0.5) * 0.7, 0, 1));
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  return geo;
}
function buildTree(x, z, r, rnd, mulch, fade, parent = scene) {
  const g = new THREE.Group();
  if (mulch) {
    const m = addMesh(new THREE.CylinderGeometry(r, r + 1.5, 2.4, 40), mat(0x4e341d, { roughness: 1 }), x, 1.2, z, g);
    m.castShadow = false;
  }
  const trunkH = 26 + r * 1.1;
  const bark = mat(0xffffff, { map: barkTex, roughness: 0.95 });
  addMesh(new THREE.CylinderGeometry(3 + r * 0.07, 5.5 + r * 0.1, trunkH + r * 0.5, 16), bark, x, (trunkH + r * 0.5) / 2, z, g);
  for (let k = 0; k < 3; k++) {
    const a = rnd() * Math.PI * 2;
    barC([x, trunkH * 0.75, z], [x + Math.cos(a) * r * 0.6, trunkH + r * 0.35, z + Math.sin(a) * r * 0.6], 1.8 + r * 0.03, bark, g);
  }
  const leaf = mat(0xffffff, { vertexColors: true, roughness: 0.9 });
  const base = rnd.pick([0x3f8a2e, 0x4a9334, 0x377d28, 0x45902f]);
  const n = mulch ? 7 : 5;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + rnd() * 0.5, d = k === 0 ? 0 : r * 0.68;
    const s = r * (k === 0 ? 1.1 : 0.72 + rnd() * 0.2);
    addMesh(leafBlob(s, rnd() * 100, base), leaf,
      x + Math.cos(a) * d, trunkH + r * 0.3 + (k === 0 ? r * 0.35 : rnd() * r * 0.4), z + Math.sin(a) * d, g);
  }
  parent.add(g);
  if (fade) fadeables.push({ group: g, mats: [leaf], box: new THREE.Box3().setFromObject(g) });
  treeSpots.push({ x, z, r, top: trunkH + r * 1.6, inYard: !!mulch });   // birds can perch up here
}
const treeSpots = [];
// The neighborhood around the yard (street, sidewalk, neighbors' houses, trees) is rebuilt
// for each yard, because yards come in different sizes.
const hoodGroup = new THREE.Group();
scene.add(hoodGroup);
function buildHood() {
  const W = YARD_W, H = YARD_H, P = hoodGroup;
  // trees outside the fence: spread along the sides and the back, wherever the yard ends
  const rnd = seeded(5);
  const spots = [[-70, 60, 30], [-90, H * 0.67, 34], [-60, H - 28, 24], [W + 80, 40, 32], [W + 60, H * 0.56, 26], [W + 100, H - 48, 36],
                 [W * 0.23, -80, 30], [W * 0.66, -90, 36], [W * 0.94, -70, 26], [-160, -120, 40], [W + 220, -60, 38],
                 [60, H + 252, 34], [W * 0.6, H + 272, 30], [W, H + 242, 40]];
  for (let x = W * 0.4; x < W * 0.9 && W > 700; x += 260) spots.push([x, -85 - rnd() * 20, 30 + rnd() * 8]);
  // a second, further ring of big trees: the rest of the neighborhood
  for (let k = 0; k < 18; k++) {
    const a = k / 18 * Math.PI * 2 + rnd() * 0.2, d = 1.05 + rnd() * 0.35;
    const x = W / 2 + Math.cos(a) * (W / 2 + 420) * d, z = H / 2 + Math.sin(a) * (H / 2 + 380) * d;
    if (z > H && z < H + 170) continue;   // not on the street
    spots.push([x, z, 34 + rnd() * 18]);
  }
  for (const [x, z, r] of spots) buildTree(x, z, r, rnd, false, false, P);
  const flat = (w, d, color, x, y, z) => {
    const p = new THREE.PlaneGeometry(w, d); p.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(p, mat(color)); m.position.set(x, y, z); m.receiveShadow = true; P.add(m); return m;
  };
  flat(6000, 34, 0xcdc9bf, W / 2, 0.3, H + 21);        // sidewalk
  addMesh(new THREE.BoxGeometry(6000, 4, 4), mat(0xb5b1a7), W / 2, 1.5, H + 40, P, false);   // curb
  flat(6000, 110, 0x4a4d52, W / 2, 0.2, H + 97);       // street
  for (let x = -2600; x < 3200 + W; x += 60) flat(30, 3, 0xf2d05c, x, 0.35, H + 97);   // center line
  buildHouse({ x: -330, y: 40, w: 230, h: 160 }, { parent: P, wall: 0xd9e7f2, roof: '#5f6f86', windows: [[60, 's'], [170, 's'], [60, 'e'], [120, 'e']] });
  buildHouse({ x: W + 150, y: 60, w: 210, h: 150 }, { parent: P, wall: 0xf6d9c2, roof: '#7a5240', windows: [[50, 's'], [150, 's'], [50, 'w'], [110, 'w']] });
  // the sun's shadows have to cover the whole yard
  const k = Math.max(W / 640, H / 448);
  sun.position.set(W / 2 - 380 * k, 720 * k, H / 2 + 460 * k);
  sun.target.position.set(W / 2, 0, H / 2);
  Object.assign(sun.shadow.camera, { left: -560 * k, right: 560 * k, top: 560 * k, bottom: -560 * k, near: 100, far: 2200 * k });
  sun.shadow.camera.updateProjectionMatrix();
  scene.fog.near = 900 * k; scene.fog.far = 2600 * k;
}

// Flower beds: stone edging, mulch, little plants with flowers
function buildBeds() {
  const rnd = seeded(9);
  const petals = [0xff6b9a, 0xffd23f, 0xffffff, 0xb57cff, 0xff8a4c].map(c => mat(c));
  const leaf = mat(0x2f7024), leaf2 = mat(0x3f8a2e), centre = mat(0xffe27a), P = yardGroup;
  for (const b of YARD.beds) {
    addMesh(new RoundedBoxGeometry(b.w + 8, 8, b.h + 8, 3, 3), mat(0xa29d92, { roughness: 0.95 }), b.x + b.w / 2, 4, b.y + b.h / 2, P);
    const mc = canvas2d(128, 64), mx = mc.getContext('2d');
    mx.fillStyle = '#5a3c22'; mx.fillRect(0, 0, 128, 64);
    for (let i = 0; i < 900; i++) { mx.fillStyle = rnd.pick(['#6d4a2b', '#48301a', '#7a5532']); mx.fillRect(rnd() * 128, rnd() * 64, 1.5, 1.5); }
    const mulchTop = new THREE.PlaneGeometry(b.w, b.h); mulchTop.rotateX(-Math.PI / 2);
    addMesh(mulchTop, mat(0xffffff, { map: texFrom(mc), roughness: 1 }), b.x + b.w / 2, 8.3, b.y + b.h / 2, P).castShadow = false;
    const plants = Math.max(4, Math.round(b.w * b.h / 430));   // bigger beds get more plants
    for (let i = 0; i < plants; i++) {
      const px = b.x + 9 + rnd() * (b.w - 18), pz = b.y + 9 + rnd() * (b.h - 18);
      addMesh(new THREE.SphereGeometry(6, 20, 14), rnd() < 0.5 ? leaf : leaf2, px, 11, pz, P);
      const pm = rnd.pick(petals);
      for (let k = 0; k < 5; k++) {
        const a = k / 5 * Math.PI * 2;
        addMesh(new THREE.SphereGeometry(2, 12, 8), pm, px + Math.cos(a) * 2.6, 17, pz + Math.sin(a) * 2.6, P);
      }
      addMesh(new THREE.SphereGeometry(1.4, 12, 8), centre, px, 17.8, pz, P);
    }
  }
}

// Driveway (concrete with joints), running out to the street
function buildDriveway() {
  const d = YARD.driveway, len = d.h + 40, S = 4;
  const c = canvas2d(d.w * S, len * S), ctx = c.getContext('2d'), rnd = seeded(3);
  ctx.scale(S, S);
  ctx.fillStyle = '#bab7ad'; ctx.fillRect(0, 0, d.w, len);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = rnd.pick(['#a8a59b', '#c8c5bb', '#9d9a91', '#d2cfc6']);
    ctx.fillRect(rnd() * d.w, rnd() * len, 0.7, 0.7);
  }
  ctx.strokeStyle = '#8f8c83'; ctx.lineWidth = 0.8;
  for (let y = 70; y < len; y += 70) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(d.w, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(110,107,101,0.25)'; ctx.beginPath(); ctx.ellipse(d.w / 2 + 4, 46, 13, 8, 0, 0, Math.PI * 2); ctx.fill();
  const geo = new THREE.PlaneGeometry(d.w, len); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: texFrom(c) }));
  m.position.set(d.x + d.w / 2, 0.6, d.y + len / 2);

// Wooden fence with a gap for the driveway
function buildFence() {
  const P = yardGroup;
  const grainV = stripeTex(32, 128, '#ffffff', [['rgba(90,60,30,0.25)', 10, 1], ['rgba(255,255,255,0.2)', 6, 1]], true, seeded(12), [1, 1]);
  const grainH = stripeTex(128, 32, '#ffffff', [['rgba(90,60,30,0.25)', 10, 1], ['rgba(255,255,255,0.2)', 6, 1]], false, seeded(13), [1, 1]);
  const wood = mat(0xa68558, { map: grainV }), railX = mat(0xdcc9a0, { map: grainH }), railZ = mat(0xdcc9a0, { map: grainV });
  const d = YARD.driveway;
  const F = 3, R = YARD_W - 3, B = YARD_H - 3, H = 46;
  const postGeo = new RoundedBoxGeometry(6, H, 6, 2, 1.2);
  const post = (x, z) => addMesh(postGeo, wood, x, H / 2, z, P);
  const rails = (x0, z0, x1, z1) => {
    const len = Math.hypot(x1 - x0, z1 - z0), alongX = z0 === z1;
    for (const y of [17, 38]) {
      addMesh(new RoundedBoxGeometry(alongX ? len : 3, 5, alongX ? 3 : len, 2, 1), alongX ? railX : railZ, (x0 + x1) / 2, y, (z0 + z1) / 2, P);
    }
  };
  rails(F, F, R, F); rails(F, F, F, B); rails(R, F, R, B); rails(F, B, d.x, B); rails(d.x + d.w, B, R, B);
  for (let x = F; x <= R; x += 32) { post(x, F); if (x < d.x || x > d.x + d.w) post(x, B); }
  for (let z = F + 32; z < B; z += 32) { post(F, z); post(R, z); }
  post(R, F); post(F, B); post(R, B); post(d.x, B); post(d.x + d.w, B);
}

// Extra things in some yards: a garden shed, a church steeple, park benches, soccer goals

      addMesh(new RoundedBoxGeometry(L, 6, 2, 1, 0.8), wood, 0, 24, -6, g);                                                // backrest
      for (const x of [-L / 2 + 4, L / 2 - 4]) addMesh(new THREE.BoxGeometry(2.5, 24, 12), iron, x, 12, -1, g);             // legs

      const g = new THREE.Group(), H = 48, W = p.h, D = p.w, net = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
      for (const z of [-W / 2, W / 2]) { barC([0, 0, z], [0, H, z], 1.8, white, g); barC([D, 0, z], [D, H * 0.7, z], 1.2, white, g); barC([0, H, z], [D, H * 0.7, z], 1.2, white, g); }
      barC([0, H, -W / 2], [0, H, W / 2], 1.8, white, g);

// parent: where to put it (the game scene, or the little scene that takes the clipboard pictures)
function buildMower(ghost, type = 'walk', parent = scene, look = null) {
  const g = new THREE.Group();

  const M = ghost ? () => ghostMat : (c, e) => mat(c, e);

    color: c, roughness: 0.42, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.18, envMapIntensity: ENV * 1.1, ...e });
  // two parts: the machine (mg — it vibrates, and walk-behinds get wider with a bigger deck) and the worker (wg)
  const mg = new THREE.Group(), wg = new THREE.Group();
  g.add(mg, wg);
  let part = mg;

  add(new THREE.SphereGeometry(6.8, 36, 12, 0, Math.PI * 2, 0, Math.PI / 2), PAINT(0x2b2e33), 2, 18.9, 0).scale.y = 0.42;   // starter cover

  add(new THREE.CapsuleGeometry(0.8, 2.6, 4, 8), black, -24, 32.5, 13.6).rotation.z = Math.PI / 2;
    pose = { legs: 'walk', hip: [-47, 34], hands: [-34.5, 44, 9], lean: -0.12 };
  } else if (type === 'tractor') {

    var red = PAINT(0x2f7d32), darkRed = PAINT(0x1f5a22, { roughness: 0.5 });

    for (const z of [-9, 9]) add(new THREE.SphereGeometry(2.2, 12, 8), yellow, 55, 31, z);   // headlights
    add(new RoundedBoxGeometry(40, 9, 56, 3, 3.5), red, -30, 25, 0);                         // rear body and fenders
    add(new RoundedBoxGeometry(16, 4, 22, 2, 1.8), black, -24, 32, 0);                       // seat
    add(new RoundedBoxGeometry(4, 15, 22, 2, 1.8), black, -32.5, 40, 0).rotation.z = 0.18;   // seat back
    barC([12, 34, 0], [3, 46, 0], 1.4, black, mg, sh);                                       // steering column
    const sw = add(new THREE.TorusGeometry(6, 1.1, 10, 28), black, 2.5, 47, 0);              // steering wheel
    sw.rotation.y = Math.PI / 2; sw.rotation.x = 0; sw.rotation.z = 0.5;
    add(new THREE.CylinderGeometry(1.8, 1.8, 2, 12), yellow, 14, 38, 8);                     // gas cap
    pose = { legs: 'sit', hip: [-21, 38], knee: [-5, 40], foot: [3, 21], hands: [3.5, 46, 5], lean: 0.02 };
  } else if (type === 'standon') {

  } else if (type === 'trimmer') {

    var red = PAINT(0xf07a1a), darkRed = PAINT(0xa84f0c, { roughness: 0.5 });

    const spin = add(new THREE.CylinderGeometry(10, 10, 0.3, 24), ghost ? M() : new THREE.MeshBasicMaterial({ color: 0xe8ffd0, transparent: true, opacity: 0.35, depthWrite: false }), 0, 3, 0);

  // ---- the worker: a proper character, with a face, bending knees and real proportions ----
  part = wg;
  const skin = M(0xf2c294, { roughness: 0.62 }), shirt = M(look ? look.shirt : 0xff7a3d, { roughness: 0.92 }), jeans = M(0x3a5590, { roughness: 0.95 });

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  // a smooth tapered limb from a (radius r1) to b (radius r2), with round joints
  const limb = (a, b, r1, r2, m, parent = wg) => {
    const A = V(...a), B = V(...b), d = B.clone().sub(A), len = d.length();

    addMesh(new THREE.SphereGeometry(1, 18, 12), sole, x + 1.6, y - 1.2, z, parent, sh).scale.set(4.4, 1.1, 2.3);

      limb([pose.knee[0], pose.knee[1], z], [pose.foot[0], pose.foot[1] + 3, z], 3.1, 2.5, jeans);   // shin

  // T-shirt: a smooth shape (waist, chest, shoulders) spun around, then flattened front-to-back
  const prof = [[0, 0], [6.1, 0], [6.4, 3], [6.9, 9], [7.3, 15], [7.0, 19], [5.6, 22], [3.0, 23.6], [0.1, 24]].map(([r, y]) => new THREE.Vector2(r, y));
  const torso = add(new THREE.LatheGeometry(prof, 28), shirt, hx + 1, hy + 2, 0);

  add(new THREE.TorusGeometry(6.2, 0.75, 8, 28), M(0x2a2a30, { roughness: 0.6 }), hx + 1, hy + 2.6, 0).rotation.x = Math.PI / 2;   // belt
  add(new THREE.TorusGeometry(2.9, 0.6, 8, 20), shirt, hx + 1.6, hy + 25.6, 0).rotation.x = Math.PI / 2;                         // collar

// Throw away the old customer's yard and build a new one
function loadYard(id) {
  YARD = YARDS.find(y => y.id === id) || YARDS[0];
  document.title = `Lawn Mower Game 3D — ${YARD.name}`;
  // 0. the yard's size: everything that depends on it gets resized
  YARD_W = YARD.w || 640; YARD_H = YARD.h || 448;
  COLS = YARD_W / CELL; ROWS = YARD_H / CELL;
  cellsTemplate = new Uint8Array(COLS * ROWS);
  G.cells = new Uint8Array(COLS * ROWS);
  makeMask(); sizeGround(); sizeMini();
  // 1. clear out the old house, trees, beds, driveway, fence and neighborhood
  for (const grp of [yardGroup, hoodGroup]) {
    grp.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      const ms = o.material ? [].concat(o.material) : [];
      for (const m of ms) { if (m.map && m.map !== barkTex) m.map.dispose(); m.dispose(); }
    });
    grp.clear();
  }
  fadeables.length = 0;
  treeSpots.length = 0;
  // 2. build the new ones
  fadeables.push(buildHouse(YARD.house, { ...YARD.look, parent: yardGroup }));
  const rnd = seeded(5 + YARDS.indexOf(YARD));
  for (const t of YARD.trees) buildTree(t.x, t.y, t.r, rnd, true, true, yardGroup);
  buildBeds(); buildDriveway(); buildFence(); buildProps(); buildHood(); drawMiniStatic();
  spawnBirds();
  // 3. work out which cells are grass, and the medal times
  cellsTemplate.fill(0); grassTotal = 0;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cx = col * CELL + CELL / 2, cy = row * CELL + CELL / 2;
      if (obstacleHit(cx, cy, 0) || inRect(cx, cy, YARD.driveway)) continue;
      cellsTemplate[row * COLS + col] = 1;
      grassTotal++;
    }
  }
  // medal times are set for the mower this yard is meant for — a bigger mower makes them easier
  const ref = mowerById(YARD.ref || 'walk30');
  perfectT = grassTotal * CELL * CELL / (2 * ref.deck * 0.8) / ref.speed;
  for (const k of ['gold', 'silver', 'bronze']) medalT[k] = Math.round(perfectT * MEDALS[k] * (YARD.medalEase || 1));
  buildGrass(cellsTemplate);
  grassMesh.count = Math.floor(tuftCount * QUALITY[qLevel].grass);   // (QUALITY is set up further down)
}

let RUN = { paid: false, tall: false, payFactor: 1 };

// Some grass can't be reached by a big mower (a sliver between a tree and the fence, say).
// Find every spot the mower's middle can stand on, and only count grass its deck can reach from one.
// Grass the mower can't reach becomes an "edge" (3) for the trimmer; anything even the trimmer can't reach is dropped.
function reachable(spec, step) {
  const save = MOWER.bodyRadius; MOWER.bodyRadius = spec.bodyRadius;
  const R = spec.deckRadius, rc = Math.ceil(R / CELL) + 1, ok = new Uint8Array(G.cells.length);
  for (let y = 0; y <= YARD_H; y += step) for (let x = 0; x <= YARD_W; x += step) {
    if (collides(x, y)) continue;
    const c0 = Math.floor(x / CELL), r0 = Math.floor(y / CELL);
    for (let r = Math.max(0, r0 - rc); r <= Math.min(ROWS - 1, r0 + rc); r++)
      for (let c = Math.max(0, c0 - rc); c <= Math.min(COLS - 1, c0 + rc); c++) {
        const cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
        if ((cx - x) ** 2 + (cy - y) ** 2 <= R * R) ok[r * COLS + c] = 1;
      }
  }
  MOWER.bodyRadius = save;
  return ok;
}
function dropUnreachable() {
  const byMower = reachable(MOWER, 6), byTrimmer = reachable(TRIMMER, 4);
  let n = 0, e = 0;
  for (let i = 0; i < G.cells.length; i++) {
    if (G.cells[i] !== 1) continue;
    if (byMower[i]) n++;
    else if (byTrimmer[i]) { G.cells[i] = 3; e++; }
    else G.cells[i] = 0;
  }
  grassTotal = n; G.trimTotal = e;
}

// the nearest spot to the yard's start (moving into the yard) where the current mower isn't touching anything
function safeStart() {
  const s0 = YARD.start, dx = Math.cos(s0.angle), dy = Math.sin(s0.angle);
  for (let d = 0; d < 400; d += 2) {
    const x = s0.x + dx * d, y = s0.y + dy * d;
    if (!collides(x, y)) return { x, y };
  }
  return { x: s0.x, y: s0.y };
}

    const k = mw.deck / 20;
    model.userData.mower.scale.set(k, 1, k);
    model.userData.worker.position.x = -34 * (k - 1);
  }
}
