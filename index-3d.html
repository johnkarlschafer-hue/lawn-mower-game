// =====================================================================
//  TILT TO DRIVE (phones)
//  The phone tells us which way is "up" as it tilts. We turn that into
//  directions on the screen, compare with how you held it when you
//  started (the "level" position), and turn the difference into
//  driving and steering.
// =====================================================================
const tilt = { on: false, level: null, latest: null, source: 'none', oriOK: false, oriNull: 0, g: null, events: 0 };
const toRad = Math.PI / 180;
// turn the phone's "up" direction (in the phone's own directions) into screen directions
function upToScreen(ux, uy, uz) {
  const len = Math.hypot(ux, uy, uz) || 1;
  ux /= len; uy /= len; uz /= len;
  const ang = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * toRad;
  const sx = ux * Math.cos(ang) - uy * Math.sin(ang);
  const sy = ux * Math.sin(ang) + uy * Math.cos(ang);
  return { pitch: Math.atan2(sy, uz) / toRad, roll: Math.asin(clamp(sx, -1, 1)) / toRad };
}
// Source 1: the phone's orientation sensor (smooth)
function onOrientation(e) {
  tilt.events++;
  if (e.beta == null || e.gamma == null) { tilt.oriNull++; return; }
  tilt.oriOK = true;
  const b = e.beta * toRad, g = e.gamma * toRad;
  gotReading(upToScreen(-Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g)), 'orientation');
}
// Source 2 (backup): the raw motion sensor, which feels gravity
function onMotion(e) {
  tilt.events++;
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || tilt.oriOK) return;
  const k = 0.2;   // smooth out the jitter
  tilt.g = tilt.g ? { x: tilt.g.x + (a.x - tilt.g.x) * k, y: tilt.g.y + (a.y - tilt.g.y) * k, z: tilt.g.z + (a.z - tilt.g.z) * k }
                  : { x: a.x, y: a.y, z: a.z };
  gotReading(upToScreen(tilt.g.x, tilt.g.y, tilt.g.z), 'motion');
}
function gotReading(u, source) {
  tilt.latest = u;
  tilt.source = source;
  if (!tilt.level && !tilt.settling) levelSoon();
}
// wait a moment for the phone to stop moving, then call that position "level"
function levelSoon(msg) {
  tilt.level = null;
  tilt.settling = true;
  clearTimeout(tilt.settleTimer);
  tilt.settleTimer = setTimeout(() => {
    tilt.settling = false;
    setLevel();
    if (msg) pop(G.mower.x, G.mower.y, msg, '#e8f5e0');
  }, TILT.settle * 1000);
}
// lock the screen sideways (needs full screen on Android); try again on every tap of Level
function lockSideways() {
  try {
    const go = () => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {});
    if (document.fullscreenElement) go();
    else {
      const fs = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      if (fs && fs.then) fs.then(go).catch(() => {});
    }
  } catch (e) {}
}
// if the screen turns anyway, start again from a fresh "level"
const onTurned = () => { if (tilt.on) levelSoon('Screen turned — level reset'); };
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onTurned);
else window.addEventListener('orientationchange', onTurned);
function setLevel() {
  ctrl.cruising = false;
  if (!tilt.latest) return;
  tilt.level = { ...tilt.latest };
}
function readTilt() {
  const u = tilt.latest, L = tilt.level;
  if (!u || !L || tilt.settling) return { drive: 0, turn: 0 };
  const dz = (v) => Math.sign(v) * Math.max(0, Math.abs(v) - TILT.dead);
  let fwd = dz(L.pitch - u.pitch) / (TILT.forward - TILT.dead);
  let steer = dz(-(u.roll - L.roll)) / (TILT.steer - TILT.dead);
  if (TILT.invertDrive) fwd = -fwd;
  if (TILT.invertSteer) steer = -steer;
  return { drive: clamp(fwd, -1, 1), turn: clamp(steer, -1, 1) };
}
async function startTilt() {
  if (!window.isSecureContext) { tiltProblem('Tilt only works when the game is opened from an https:// web address.'); return; }
  // Some browsers ask for permission first. Both requests must go out at the same
  // moment, right after the tap — a second, later request gets rejected.
  const asks = [window.DeviceOrientationEvent, window.DeviceMotionEvent]
    .filter(Ev => Ev && typeof Ev.requestPermission === 'function')
    .map(Ev => { try { return Ev.requestPermission(); } catch (e) { return Promise.reject(e); } });
  // Don't give up if an answer is "no" or an error: just listen anyway — the readout shows what arrives.
  Promise.allSettled(asks).then(results => {
    tilt.permission = results.length === 0 ? 'not needed'
      : results.some(r => r.status === 'fulfilled' && r.value === 'granted') ? 'granted' : 'refused';
  });
  // start listening straight away…
  tilt.on = true; tilt.level = null; tilt.latest = null;
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  $('levelBtn').classList.remove('hidden');
  $('tiltDbg').classList.remove('hidden');
  hideIntro();
  // …then go full screen and sideways, without waiting for an answer
  lockSideways();
  // wait for the first reading, then show the "tilt to start" card
  let waited = 0;
  const check = setInterval(() => {
    waited += 250;
    if (tilt.latest) { clearInterval(check); hideIntro(); }
    else if (waited === 2000) {
      const n = document.querySelector('#intro .tiltnote');
      if (n) n.textContent = tilt.events === 0
        ? 'No tilt readings yet. Your browser may be blocking motion sensors — see the note below the game.'
        : 'The phone sends tilt readings, but they are empty — the browser is probably blocking motion sensors.';
    }
  }, 250);
}
function updateTiltDbg() {
  if (!tilt.on) return;
  const u = tilt.latest, L = tilt.level;
  $('tiltDbg').textContent = u && !L
    ? `tilt (${tilt.source}): hold steady…`
    : !u
    ? `tilt: waiting… (${tilt.events} events, ${tilt.oriNull} empty, permission: ${tilt.permission || 'asking'})`
    : `tilt (${tilt.source}): forward ${(L.pitch - u.pitch).toFixed(0)}° · steer ${(-(u.roll - L.roll)).toFixed(0)}°`;
}
function tiltProblem(msg) {
  tilt.on = false;
  const n = document.querySelector('#intro .tiltnote');
  if (n) n.textContent = msg + ' You can still drive by holding your finger on the lawn.';
}
clickBtn('levelBtn', () => { lockSideways(); levelSoon('Level set'); });
const isPhone = window.matchMedia('(pointer: coarse)').matches;

// =====================================================================
//  PHONE CONTROL STYLES
//   auto  = the mower drives itself; tilt to steer, nudge back to stop
//   tilt  = tilt forward for speed, turn like a wheel to steer
//   touch = on-screen steering pad and GO / REV pedals
// =====================================================================
const CTRL_NAMES = { auto: 'Auto-drive + tilt', tilt: 'Tilt to drive', touch: 'Touch' };
const ctrl = { mode: 'none', cruising: false, sm: { turn: 0, drive: 0 } };
const touch = { id: null, x0: 0, steer: 0, gas: false, rev: false };
const curve = (v) => Math.sign(v) * Math.pow(Math.abs(v), STEERING.curve);

function phoneInput(dt) {
  let raw = null;
  if (ctrl.mode === 'touch') {
    raw = { turn: curve(touch.steer), drive: touch.gas ? 1 : touch.rev ? -1 : 0 };
  } else if ((ctrl.mode === 'tilt' || ctrl.mode === 'auto') && tilt.on) {
    const t = readTilt();
    if (!t) return { turn: 0, drive: 0 };
    if (ctrl.mode === 'tilt') raw = { turn: curve(t.turn), drive: t.drive };
    else {
      // auto-drive: a nudge forward starts cruising, a nudge back stops, tilting further back reverses
      if (t.drive > 0.35) ctrl.cruising = true;
      if (t.drive < -0.35) ctrl.cruising = false;
      raw = { turn: curve(t.turn), drive: t.drive < -0.75 ? -1 : ctrl.cruising ? STEERING.autoSpeed : 0 };
    }
  }
  if (!raw) return null;
  // smooth it out so a shaky hand doesn't make the mower jerk
  const k = 1 - Math.exp(-dt / STEERING.smooth);
  ctrl.sm.turn += (raw.turn - ctrl.sm.turn) * k;
  ctrl.sm.drive += (raw.drive - ctrl.sm.drive) * k;
  const tidy = (v) => Math.abs(v) < 0.02 ? 0 : v;
  return { turn: tidy(ctrl.sm.turn), drive: tidy(ctrl.sm.drive) };
}

function setMode(mode) {
  ctrl.mode = mode;
  ctrl.cruising = false;
  ctrl.sm = { turn: 0, drive: 0 };
  try { localStorage.setItem('lmg3d_ctrl', mode); } catch (e) {}
  const isTouch = mode === 'touch';
  document.body.classList.toggle('touch', isTouch);
  $('touchUI').classList.toggle('hidden', !isTouch);
  $('levelBtn').classList.toggle('hidden', isTouch);
  $('tiltDbg').classList.toggle('hidden', isTouch);
  $('ctrlBtn').classList.remove('hidden');
  $('ctrlBtn').querySelector('.lbl').textContent = CTRL_NAMES[mode];
  hideIntro();
  if (isTouch) lockSideways();
  else if (!tilt.on) startTilt();
  const hint = { auto: 'Nudge forward to go · back to stop', tilt: 'Tilt away from you to go!', touch: 'Hold GO · drag the pad to steer' }[mode];
  setTimeout(() => pop(G.mower.x, G.mower.y, hint, '#fff3a0', 20), 400);
}
clickBtn('ctrlBtn', () => setMode(ctrl.mode === 'auto' ? 'tilt' : ctrl.mode === 'tilt' ? 'touch' : 'auto'));

// touch pad: drag sideways from wherever your thumb lands
{
  const pad = document.getElementById('steerPad'), knob = document.getElementById('knob');
  const RANGE = 70;   // pixels of drag for the sharpest turn
  const moveKnob = (dx) => { knob.style.transform = `translateX(${dx}px)`; };
  pad.addEventListener('pointerdown', (e) => {
    touch.id = e.pointerId; touch.x0 = e.clientX; touch.steer = 0;
    pad.setPointerCapture(e.pointerId); moveKnob(0);
  });
  pad.addEventListener('pointermove', (e) => {
    if (e.pointerId !== touch.id) return;
    const dx = clamp(e.clientX - touch.x0, -RANGE, RANGE);
    touch.steer = dx / RANGE;
    moveKnob(dx);
  });
  const release = (e) => { if (e.pointerId !== touch.id) return; touch.id = null; touch.steer = 0; moveKnob(0); };
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);
  for (const [id, key] of [['gasBtn', 'gas'], ['revBtn', 'rev']]) {
    const b = document.getElementById(id);
    const on = (v) => (e) => { touch[key] = v; b.classList.toggle('on', v); if (v) b.setPointerCapture(e.pointerId); };
    b.addEventListener('pointerdown', on(true));
    b.addEventListener('pointerup', on(false));
    b.addEventListener('pointercancel', on(false));
  }
}

// =====================================================================
//  GRAPHICS QUALITY — press Q to change. If the game runs slowly, it
//  steps down by itself (sharpness first, then fewer grass blades).
// =====================================================================
const QUALITY = [
  { name: 'High',   pr: Math.min(window.devicePixelRatio || 1, 2), grass: 1 },
  { name: 'Medium', pr: 1,    grass: 0.6 },
  { name: 'Low',    pr: 0.75, grass: 0.3 }
];
let qLevel = 0, qAuto = true;
try { const q = localStorage.getItem('lmg3d_quality'); if (q !== null) { qLevel = +q; qAuto = false; } } catch (e) {}
function applyQuality() {
  const q = QUALITY[qLevel];
  renderer.setPixelRatio(q.pr);
  resize();
  if (grassMesh) grassMesh.count = Math.floor(tuftCount * q.grass);
}
applyQuality();
const fpsMeter = { t: 0, frames: 0 };
function checkSpeed(dt) {
  if (!qAuto || qLevel >= QUALITY.length - 1) return;
  fpsMeter.t += dt; fpsMeter.frames++;
  if (fpsMeter.t < 3) return;
  const fps = fpsMeter.frames / fpsMeter.t;
  fpsMeter.t = 0; fpsMeter.frames = 0;
  if (fps < 40) {
    qLevel++;
    applyQuality();
    pop(G.mower.x, G.mower.y, `Graphics: ${QUALITY[qLevel].name} (Q to change)`, '#e8f5e0');
  }
}
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyQ' || e.repeat) return;
  qLevel = (qLevel + 1) % QUALITY.length;
  qAuto = false;
  try { localStorage.setItem('lmg3d_quality', qLevel); } catch (err) {}
  applyQuality();
  pop(G.mower.x, G.mower.y, `Graphics: ${QUALITY[qLevel].name}`, '#e8f5e0');
});

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  timeU.value = now / 1000;
  checkSpeed((now - (frame.prev || now)) / 1000); frame.prev = now;
  update(dt);
  updateClips(dt);
  updateRings(dt);
  updateRain(dt);
  updateCamera(dt, false);
  updateFading(dt);
  updateTiltDbg();
  drawMini();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function update(dt) {
  if (G.finished || G.inHub) return;
  const m = G.mower;

  let turn = 0, drive = 0;
  if (down('ArrowLeft', 'KeyA')) turn -= 1;
  if (down('ArrowRight', 'KeyD')) turn += 1;
  if (down('ArrowUp', 'KeyW')) drive = 1;
  else if (down('ArrowDown', 'KeyS')) drive = -1;

  const ph = phoneInput(dt);
  if (ph) { turn = ph.turn; drive = ph.drive; }
  else if (pointer.active && ctrl.mode === 'none') {
    const ndc = new THREE.Vector2(pointer.x / window.innerWidth * 2 - 1, -(pointer.y / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, hit)) {
      const dx = hit.x - m.x, dy = hit.z - m.y;
      if (Math.hypot(dx, dy) > 12) {
        const diff = wrapAngle(Math.atan2(dy, dx) - m.rot);
        turn = clamp(diff / (MOWER.turnSpeed * dt), -1, 1);
        if (Math.abs(diff) < 1.0) drive = 1;
      }
    }
  }

  if ((turn !== 0 || drive !== 0) && !G.started) { G.started = true; hideIntro(); SFX.startUp(); }
  if (G.started) {
    G.elapsed += dt;
    if (G.stallAt && G.elapsed >= G.stallAt) stall();
    if (!G.stalled) G.fuel -= dt * (IDLE_BURN + (1 - IDLE_BURN) * Math.min(1, Math.abs(G.throttle)));
    if (G.fuel <= 0) {
      G.fuel = 0;
      pop(m.x, m.y, 'Out of gas!', '#ff8a6b', 24);
      SFX.sputterOut();
      finish('gas');
      return;
    }
    checkMedalClock();
  }
  if (G.stalled) { turn = 0; drive = 0; }

  // the mower has a bit of weight: it takes a moment to get going and to stop
  G.throttle += (drive - G.throttle) * (1 - Math.exp(-dt / 0.09));
  if (Math.abs(G.throttle) < 0.01 && drive === 0) G.throttle = 0;
  const th = G.throttle;
  const prevX = m.x, prevY = m.y;

  m.rot += turn * MOWER.turnSpeed * dt;
  // straight-line assist (phones): not steering and nearly lined up? ease onto the straight line
  if (ctrl.mode !== 'none' && STEERING.assist && Math.abs(turn) < 0.04 && drive > 0) {
    const straightA = Math.round(m.rot / (Math.PI / 2)) * (Math.PI / 2);
    const off = wrapAngle(straightA - m.rot);
    if (Math.abs(off) < STEERING.assistAngle * toRad) m.rot += clamp(off, -1.2 * dt, 1.2 * dt);
  }
  G.bumpCD -= dt;
  if (th !== 0) {
    const sp = th > 0 ? MOWER.speed * th : MOWER.reverseSpeed * th;   // can be in-between (tilting, speeding up)
    const want = Math.abs(sp * dt);
    let nx = m.x + Math.cos(m.rot) * sp * dt, ny = m.y + Math.sin(m.rot) * sp * dt;
    if (collides(nx, ny)) {
      if (!collides(nx, m.y)) ny = m.y;
      else if (!collides(m.x, ny)) nx = m.x;
      else { nx = m.x; ny = m.y; }
      // ran into something head-on? Bonk!
      if (Math.hypot(nx - m.x, ny - m.y) < want * 0.35 && Math.abs(th) > 0.5) bump(m, th);
    }
    G.distance += Math.hypot(nx - m.x, ny - m.y);
    m.x = nx; m.y = ny;
  }
  const moved = Math.hypot(m.x - prevX, m.y - prevY);

  let newlyCut = 0;
  if (G.started && !G.stalled) {
    newlyCut = mowAt(m.x, m.y, m.rot);
    if (newlyCut > 0) {
      // more grass = more clippings; long grass really sprays
      const n = Math.min(8, Math.round(newlyCut * (RUN.tall ? 2.5 : 1.6)));
      emitClips(m.x, m.y, m.rot, n, RUN.tall ? 1.3 : 1);
    }
    trackStyle(drive, moved, newlyCut);
    checkMilestones();
  }
  const running = G.started && !G.stalled;
  SFX.engine(running, Math.min(1, Math.abs(th)), newlyCut, G.fuel / fuelMax < 0.2);

  // move the 3D model, swing the worker's legs as he walks, bob him up and down,
  // and make the mower shake from the engine (more when it's chewing through grass)
  placeModel(mowerMesh, m.x, m.y, m.rot);
  G.walk += moved * (th < 0 ? -1 : 1);
  const swing = moved > 0.1 ? Math.sin(G.walk * 0.12) * 0.45 : 0;
  mowerMesh.userData.legs[0].rotation.z = swing;
  mowerMesh.userData.legs[1].rotation.z = -swing;
  mowerMesh.userData.worker.position.y = moved > 0.1 ? Math.abs(Math.cos(G.walk * 0.12)) * 1.1 : 0;
  const t = performance.now() / 1000, rumble = running ? 0.18 + (newlyCut > 0 ? 0.22 : 0) : 0;
  const mg = mowerMesh.userData.mower;
  mg.position.y = Math.sin(t * 71) * rumble;
  mg.rotation.x = Math.sin(t * 53) * rumble * 0.012;
  mg.rotation.z = Math.sin(t * 61) * rumble * 0.01 + (G.bumpWobble || 0);
  G.bumpWobble = (G.bumpWobble || 0) * Math.exp(-dt * 8);

  const last = G.trail[G.trail.length - 1];
  if (Math.hypot(m.x - last.x, m.y - last.y) > 6) G.trail.push({ x: m.x, y: m.y });

  if (G.started) {
    G.recTimer -= dt;
    if (G.recTimer <= 0) { G.recTimer = 0.05; recordSample(); }
  }
  updateFinder(dt);
  updateGhost();
  updateHud();
  if (G.cutCount >= grassTotal) finish();
}

// Ran into the fence, the house or a tree
function bump(m, th) {
  if (G.bumpCD > 0) return;
  G.bumpCD = 0.6;
  SFX.bonk();
  buzz(35);
  G.shake = 1;
  G.bumpWobble = 0.12 * Math.sign(th);
  // bounce back a little
  const bx = m.x - Math.cos(m.rot) * 4 * Math.sign(th), by = m.y - Math.sin(m.rot) * 4 * Math.sign(th);
  if (!collides(bx, by)) { m.x = bx; m.y = by; }
  G.throttle = -0.15 * Math.sign(th);
  if (Math.random() < 0.5) pop(m.x, m.y, Math.random() < 0.5 ? 'Bonk!' : 'Oof!', '#ffffff', 16);
}

// A worn-out mower can die in the middle of a job. Pull the cord to restart it!
function stall() {
  G.stallAt = null;
  G.stalled = { need: 3 + Math.floor(Math.random() * 3), done: 0 };
  SFX.sputterOut();
  buzz([80, 60, 160]);
  pop(G.mower.x, G.mower.y, 'The engine died!', '#ff8a6b', 24);
  setTimeout(() => { if (G.stalled) $('pullBtn').classList.remove('hidden'); }, 500);
}
function pullCord() {
  const s = G.stalled;
  if (!s || G.finished) return;
  s.done++;
  SFX.pull();
  buzz(25);
  const b = $('pullBtn');
  b.classList.add('yank'); setTimeout(() => b.classList.remove('yank'), 90);
  G.bumpWobble = 0.08;
  if (s.done >= s.need) {
    G.stalled = null;
    b.classList.add('hidden');
    SFX.startUp();
    pop(G.mower.x, G.mower.y, 'Vroom! Back to work', '#9be37a', 20);
  } else pop(G.mower.x, G.mower.y, ['Pull!', 'Again!', 'Come on…', 'Almost!'][Math.min(3, s.done - 1)], '#ffffff', 16);
}

// The medal clock: ticks in the last 5 seconds before a medal time, and a sad sound when it's gone
function checkMedalClock() {
  const order = ['gold', 'silver', 'bronze'];
  const next = order[G.medalStage];
  if (!next) return;
  const left = medalT[next] - G.elapsed;
  if (left <= 5 && left > 0 && Math.ceil(left) !== G.lastTick) { G.lastTick = Math.ceil(left); SFX.tick(); }
  if (left <= 0) {
    G.medalStage++;
    SFX.medalGone();
    pop(G.mower.x, G.mower.y, `${MEDAL_NAME[next]} time is gone`, '#ffab7a', 17);
    const icon = $('medalNext');
    icon.classList.remove('shake'); void icon.offsetWidth; icon.classList.add('shake');
  }
  $('timer').classList.toggle('hurry', left <= 5 && left > 0);
}

// Little celebrations at 50%, 75% and 90% — and at 95%, help finding the last bits
function checkMilestones() {
  const f = G.cutCount / grassTotal;
  const marks = [0.5, 0.75, 0.9, 0.95];
  while (G.milestone < marks.length && f >= marks[G.milestone]) {
    const k = G.milestone++;
    if (k < 3) { SFX.chime(k); pop(G.mower.x, G.mower.y, `${Math.round(marks[k] * 100)}% done!`, '#c6f0a8', 18); }
    else { G.hunting = true; SFX.chime(3); pop(G.mower.x, G.mower.y, 'Almost! Find the last bits →', '#fff3a0', 18); }
  }
}

// Point the ground arrow at the nearest uncut grass (checked a few times a second)
function updateFinder(dt) {
  if (!G.hunting) { finder.visible = false; return; }
  const m = G.mower;
  G.finderT -= dt;
  if (G.finderT <= 0) {
    G.finderT = 0.25;
    let best = null, bd = Infinity;
    for (let i = 0; i < G.cells.length; i++) {
      if (G.cells[i] !== 1) continue;
      const x = (i % COLS) * CELL + CELL / 2, y = Math.floor(i / COLS) * CELL + CELL / 2, d = (x - m.x) ** 2 + (y - m.y) ** 2;
      if (d < bd) { bd = d; best = { x, y }; }
    }
    G.target = best;
  }
  const tg = G.target;
  finder.visible = !!tg && Math.hypot(tg.x - m.x, tg.y - m.y) > MOWER.deckRadius + 10;
  if (!finder.visible) return;
  finder.position.set(m.x, 3 + Math.sin(performance.now() / 150) * 1.5, m.y);
  finder.rotation.y = -Math.atan2(tg.y - m.y, tg.x - m.x);
}

function recordSample() {
  const m = G.mower;
  G.rec.push([+G.elapsed.toFixed(2), Math.round(m.x), Math.round(m.y), +m.rot.toFixed(2), +(G.cutCount / grassTotal).toFixed(4)]);
}

function updateGhost() {
  G.ghostCut = null;
  if (!G.ghostData) return;
  const d = G.ghostData, t = G.elapsed, lastS = d[d.length - 1];
  if (t >= lastS[0]) { placeModel(ghostMesh, lastS[1], lastS[2], lastS[3]); G.ghostCut = lastS[4] ?? null; return; }
  while (G.ghostIndex < d.length - 2 && d[G.ghostIndex + 1][0] <= t) G.ghostIndex++;
  const a = d[G.ghostIndex], b = d[G.ghostIndex + 1];
  const f = b[0] > a[0] ? clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 0;
  const gx = a[1] + (b[1] - a[1]) * f, gy = a[2] + (b[2] - a[2]) * f;
  placeModel(ghostMesh, gx, gy, a[3] + wrapAngle(b[3] - a[3]) * f);
  // how much the ghost had cut at this moment (older ghosts didn't record this)
  if (a[4] !== undefined && b[4] !== undefined) G.ghostCut = a[4] + (b[4] - a[4]) * f;
  if (G.started) {
    // (the ghost's path is only drawn on the minimap, not on the 3D lawn)
    mgctx.fillStyle = '#4aa8ff'; mgctx.beginPath(); mgctx.arc(gx, gy, MOWER.deckRadius, 0, 7); mgctx.fill();
  }
}

// Cut grass under the deck. Returns how many new cells were cut.
function mowAt(x, y, rot) {
  const cx = Math.cos(rot), sy = Math.sin(rot);
  const light = Math.abs(cx) >= Math.abs(sy) ? cx > 0 : sy > 0;
  stampMask(x, y, light, false);
  mlctx.fillStyle = light ? '#94d36c' : '#6fb04b';
  mlctx.beginPath(); mlctx.arc(x, y, MOWER.deckRadius, 0, 7); mlctx.fill();

  let n = 0;
  const r = MOWER.deckRadius;
  const c0 = Math.max(0, Math.floor((x - r) / CELL)), c1 = Math.min(COLS - 1, Math.floor((x + r) / CELL));
  const r0 = Math.max(0, Math.floor((y - r) / CELL)), r1 = Math.min(ROWS - 1, Math.floor((y + r) / CELL));
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      const i = row * COLS + col;
      if (G.cells[i] !== 1) continue;
      const ccx = col * CELL + CELL / 2, ccy = row * CELL + CELL / 2;
      if ((ccx - x) ** 2 + (ccy - y) ** 2 <= r * r) { G.cells[i] = 2; G.cutCount++; n++; }
    }
  }
  return n;
}

// Clean stripes, combos and overlap (same rules as the 2D version)
function trackStyle(drive, moved, fresh) {
  const m = G.mower;
  const onLawn = G.cells[Math.floor(m.y / CELL) * COLS + Math.floor(m.x / CELL)] !== 0;
  const driving = drive > 0 && moved > 0.5;
  if (fresh > 0) {
    G.sinceFresh = 0; G.overlapRun = 0; G.overlapWarned = false;
  } else if (driving && onLawn) {
    G.sinceFresh += moved;
    if (G.sinceFresh > 12) {
      G.wasted += moved; G.overlapRun += moved;
      if (G.overlapRun >= OVERLAP_LIMIT && !G.overlapWarned) {
        G.overlapWarned = true;
        pop(m.x, m.y, G.combo > 1 ? 'Combo lost!' : 'Overlap!', '#ffab7a');
        SFX.thud();
        if (G.combo > 1) { flash('red'); buzz(60); }
        G.combo = 1;
      }
    }
  }
  const r = G.run;
  const straight = r && Math.abs(wrapAngle(m.rot - r.heading)) < 0.18;
  if (r && (!driving || !straight)) endStripe();
  if (driving) {
    if (!G.run) G.run = { heading: m.rot, len: 0, cells: 0 };
    G.run.len += moved;
  }
  if (G.run) G.run.cells += fresh;
}

function endStripe() {
  const r = G.run;
  G.run = null;
  if (!r || r.len < STRIPE_MIN) return;
  const fullWidth = r.len * 2 * MOWER.deckRadius / (CELL * CELL);
  if (r.cells / fullWidth < STRIPE_FRESH) return;
  const pts = Math.round(r.len / 10) * G.combo;
  G.style += pts;
  G.cleanStripes++;
  pop(G.mower.x, G.mower.y, `Clean stripe! +${pts}` + (G.combo > 1 ? `  ×${G.combo}` : ''), '#fff3a0', 19 + G.combo * 2);
  SFX.ding(G.combo);
  ringBurst(G.mower.x, G.mower.y, G.combo >= 3 ? 0xffb43a : 0xffd84a);
  buzz(20);
  if (G.combo >= 3) flash('gold');
  G.combo = Math.min(MAX_COMBO, G.combo + 1);
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  const c = $('combo'); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
}

// a quick colored glow around the edge of the screen
function flash(kind) {
  const f = $('flash');
  f.className = kind + ' on';
  requestAnimationFrame(() => requestAnimationFrame(() => { f.className = kind; }));
}

// =====================================================================
//  CAMERA
// =====================================================================
function updateCamera(dt, snap) {
  const m = G.mower;
  let pos, look;
  if (G.finished || G.inHub) {
    // at the end (and on the clipboard), rise up for a view of the whole lawn
    pos = new THREE.Vector3(320, 640, 760);
    look = new THREE.Vector3(320, 0, 215);
  } else {
    const cfg = CAMERA[camMode];
    const targetYaw = camMode === 'turning' ? m.rot : -Math.PI / 2;
    camYaw = snap ? targetYaw : camYaw + wrapAngle(targetYaw - camYaw) * (1 - Math.exp(-dt * cfg.lag));
    const fx = Math.cos(camYaw), fz = Math.sin(camYaw), rx = -fz, rz = fx;
    pos = new THREE.Vector3(m.x - fx * cfg.dist + rx * cfg.side, cfg.height, m.y - fz * cfg.dist + rz * cfg.side);
    look = new THREE.Vector3(m.x + fx * cfg.ahead, 0, m.y + fz * cfg.ahead);
  }
  const k = snap ? 1 : 1 - Math.exp(-dt * (G.finished || G.inHub ? 1.8 : 7));
  camPos.lerp(pos, k);
  camLook.lerp(look, k);
  camera.position.copy(camPos);
  // a shake when you bump into something
  G.shake = (G.shake || 0) * Math.exp(-dt * 7);
  if (G.shake > 0.01) camera.position.add(tmpV.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(G.shake * 7));
  camera.lookAt(camLook);
  // the view widens a touch when you go full speed, which makes it feel faster
  const fov = CAMERA.fov + (G.finished || G.inHub ? 0 : 4 * Math.max(0, G.throttle || 0));
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

// Make the house or a tree see-through when it's between the camera and you
const fadeRay = new THREE.Ray(), tmpV = new THREE.Vector3();
function updateFading(dt) {
  const m = G.mower;
  const target = new THREE.Vector3(m.x, 35, m.y);
  fadeRay.origin.copy(camera.position);
  fadeRay.direction.copy(target).sub(camera.position).normalize();
  const dist = camera.position.distanceTo(target);
  for (const f of fadeables) {
    const hit = !G.finished && fadeRay.intersectBox(f.box, tmpV) && tmpV.distanceTo(camera.position) < dist - 10;
    const want = hit ? 0.12 : 1;
    f.cur = f.cur === undefined ? 1 : f.cur + (want - f.cur) * (1 - Math.exp(-dt * 8));
    const see = f.cur < 0.98;
    for (const mt of f.mats) {
      if (mt.transparent !== see) { mt.transparent = see; mt.needsUpdate = true; }
      mt.opacity = see ? f.cur : 1;
      mt.depthWrite = !see;
    }
  }
}

// =====================================================================
//  HUD, FLOATING TEXT, INTRO AND RESULTS
// =====================================================================
const $ = (id) => document.getElementById(id);
function updateHud() {
  const f = G.cutCount / grassTotal, pct = Math.floor(f * 100);
  $('cutFill').style.width = (f * 100) + '%';
  $('cutTxt').textContent = `${pct}% cut`;
  const ff = clamp(G.fuel / fuelMax, 0, 1);
  const fuel = $('fuelFill');
  fuel.style.width = (ff * 100) + '%';
  fuel.style.background = ff > 0.5 ? '#8fd16a' : ff > 0.2 ? '#f2c94c' : '#ff5c4a';
  fuel.classList.toggle('low', ff <= 0.2);
  $('timer').textContent = `⏱ ${G.elapsed.toFixed(1)}s`;
  const t = G.elapsed;
  const next = t <= medalT.gold ? 'gold' : t <= medalT.silver ? 'silver' : t <= medalT.bronze ? 'bronze' : 'none';
  $('medalIcon').className = 'medal ' + next;
  $('medalTxt').className = next;
  $('medalTxt').textContent = next === 'none' ? '—' : `${medalT[next]}s`;
  $('style').textContent = `★ ${G.style}`;
  $('combo').textContent = G.combo > 1 ? `×${G.combo}` : '';
  // stripe meter: fills as your current straight line grows. Gold = it will count as a clean stripe.
  const r = G.run, sf = $('stripeFill');
  if (r && !G.finished) {
    const fresh = r.len > 50 ? r.cells / (r.len * 2 * MOWER.deckRadius / (CELL * CELL)) : 1;
    sf.style.width = Math.min(100, r.len / STRIPE_MIN * 100) + '%';
    sf.className = fresh < STRIPE_FRESH ? 'bad' : r.len >= STRIPE_MIN ? 'ready' : '';
  } else { sf.style.width = '0%'; sf.className = ''; }
  // racing your ghost: how much more (or less) you've cut than your best run had at this time
  const gd = $('ghostDelta');
  if (G.ghostCut !== null && G.started && !G.finished) {
    const d = (f - G.ghostCut) * 100;
    gd.textContent = Math.abs(d) < 0.5 ? '👻 even' : d > 0 ? `👻 ▲${d.toFixed(0)}%` : `👻 ▼${(-d).toFixed(0)}%`;
    gd.className = Math.abs(d) < 0.5 ? '' : d > 0 ? 'ahead' : 'behind';
  } else gd.textContent = '';
}

// Floating text that rises from a spot in the yard
function pop(x, y, text, color = '#ffffff', size = 19) {
  const v = new THREE.Vector3(x, 95, y).project(camera);
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = text;
  el.style.color = color;
  el.style.fontSize = size + 'px';
  el.style.left = clamp((v.x + 1) / 2 * window.innerWidth, 120, window.innerWidth - 120) + 'px';
  el.style.top = clamp((1 - v.y) / 2 * window.innerHeight, 90, window.innerHeight - 40) + 'px';
  $('pops').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showIntro() {
  const el = $('intro');
  el.innerHTML = `
    <h1>${YARD.name}</h1>
    <p class="small" style="margin:4px 0 0">${RUN.paid
      ? `Day ${career.day} · paid job · up to $${jobPay(YARD).toFixed(2)}${RUN.tall ? ' · <span style="color:#ffab7a">long grass — slower going!</span>' : ''}`
      : 'Practice run · no pay · free gas'} · ${currentMower().name}</p>
    <p class="small sub" style="color:#c9dcbf;margin:6px 0 0">Finish the lawn fast for a medal:</p>
    <div class="medals">
      ${['gold', 'silver', 'bronze'].map(k => `<span class="m ${k}"><span class="medal ${k}"></span>${medalT[k]}s</span>`).join('')}
    </div>
    ${isPhone
      ? `<p>Straight stripes earn tips · chain them for a combo · don't overlap · watch your gas ⛽</p>`
      : `<p>Long, straight stripes on uncut grass earn tips.<br>Do them in a row for a combo!<br>
         Don't drive over cut grass too long, and watch your gas ⛽</p>`}
    ${isPhone && ctrl.mode === 'none' ? `
      <p class="tiltnote">Hold the phone sideways, then pick your controls:</p>
      <div class="modes">
        <button data-mode="auto" class="rec">📱 Auto-drive + tilt to steer</button>
        <button data-mode="tilt">📱 Tilt to drive</button>
        <button data-mode="touch">👆 Touch buttons</button>
      </div>`
    : isPhone ? `<p class="small">${{ auto: 'Nudge forward to go', tilt: 'Tilt away from you to go', touch: 'Hold GO to start' }[ctrl.mode]} · tap here to close</p>`
    : `<p class="small">Drive to start · C switches the camera · M = sound on/off</p>`}`;
  el.classList.remove('hidden');
  if (isPhone) el.onclick = (e) => { if (e.target.tagName !== 'BUTTON') hideIntro(); };
  el.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); setMode(b.dataset.mode); }));
}
function hideIntro() { $('intro').classList.add('hidden'); }

function finish(reason) {
  if (G.finished || G.inHub) return;
  endStripe();
  G.finished = true;
  G.stalled = null;
  hideIntro();
  $('pullBtn').classList.add('hidden');
  $('timer').classList.remove('hurry');
  finder.visible = false;
  SFX.engine(false);

  const cut = G.cutCount / grassTotal, t = G.elapsed, done = cut >= 0.95;
  let medal = 'none';
  if (done) medal = t <= medalT.gold ? 'gold' : t <= medalT.silver ? 'silver' : t <= medalT.bronze ? 'bronze' : 'none';
  const comment =
    reason === 'gas' && !done ? '"Out of gas? Oh dear… you missed a bit."' :
    !done              ? '"You missed some spots."' :
    medal === 'gold'   ? '"Perfect lines! Like a golf course."' :
    medal === 'silver' ? '"Looks lovely, thank you!"' :
    medal === 'bronze' ? '"Took you a while, but it looks fine."' :
                         '"Finally! I nearly called someone else."';
  // the money: the customer's price × how long the grass was, half price if you left a mess, + medal bonus + tips
  let pay = YARD.pay * RUN.payFactor * cut;
  if (!done) pay *= 0.5;
  const bonus = done ? BIZ.medalBonus[medal] : 0;
  const tips = G.style / TIP_RATE;
  const total = pay + bonus + tips;
  setTimeout(() => SFX.medal(medal), 250);

  // white route line over the lawn
  const pts = G.trail.map(p => new THREE.Vector3(p.x, 1.5, p.y));
  routeLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff }));
  scene.add(routeLine);

  const prev = G.best;
  const ghostLine = prev && prev.time && done && (prev.cut || 0) >= 0.95
    ? `Ghost time: ${prev.time.toFixed(1)}s (you were ${Math.abs(t - prev.time).toFixed(1)}s ${t <= prev.time ? 'faster' : 'slower'})` : '';
  let best = prev;
  const bestDone = best && (best.cut || 0) >= 0.95;
  const isBest = !best || !best.ghost || (done !== bestDone ? done : done ? t < best.time : cut > best.cut);
  if (isBest) {
    recordSample();
    best = { cut, time: t, medal, ghost: G.rec };
    try { localStorage.setItem(bestKey(), JSON.stringify(best)); } catch (e) {}
  }

  // ---- paid job: update the business ----
  let bizLines = [], news = '';
  if (RUN.paid) {
    const mw = currentMower();
    career.money += total;
    career.earned += total;
    career.lastMowed[YARD.id] = career.day;
    career.slot++;
    career.jobsDone++;
    career.tank = Math.max(0, G.fuel * mw.burn);
    career.wearOf[mw.id] = Math.min(90, getWear() + mw.wear);
    const stars = done ? (medal !== 'none' ? 2 : 1) : 0;
    career.rep += stars;
    if (stars) bizLines.push(`<span style="color:#ffe9a3">+${stars} ★ reputation</span> (you have ${career.rep} ★)`);
    else bizLines.push(`<span style="color:#ffab7a">No ★ — finish at least 95% to earn reputation</span>`);
    for (const y of YARDS) {
      if (career.unlocked.includes(y.id) || career.rep < y.stars) continue;
      career.unlocked.push(y.id);
      career.lastMowed[y.id] = career.day - BIZ.readyDays - 1;   // their grass is ready right away
      news += `<div class="note" style="text-align:left">📞 <b>New customer: ${y.name}!</b> ${y.story}</div>`;
    }
    saveCareer();
  }

  const pct = (v) => (v * 100).toFixed(1) + '%';
  const money = (v) => '$' + v.toFixed(2);
  const lines = [
    `Time: ${t.toFixed(1)}s &nbsp;·&nbsp; Cut: ${pct(cut)} &nbsp;·&nbsp; Skipped: ${pct(1 - cut)}`,
    `Clean stripes: ${G.cleanStripes} &nbsp;·&nbsp; Best combo: ×${G.bestCombo}`,
    `Overlap: ${Math.round(G.wasted / Math.max(1, G.distance) * 100)}% of your driving was over cut grass`,
    RUN.paid
      ? `Paid ${money(pay)}${RUN.payFactor < 1 ? ` (grass was overgrown: ${Math.round(RUN.payFactor * 100)}%)` : ''}`
        + (bonus ? ` + medal bonus ${money(bonus)}` : '') + ` + tips ${money(tips)} = <b id="payTotal" style="color:#9be37a">$0.00</b>`
      : `Practice — a paid job would have earned ${money(total)}`,
    ...bizLines,
    ghostLine, comment,
    isBest ? '★ New personal best!' : (bestDone ? `Your best: ${best.time.toFixed(1)}s` : '')
  ].filter(Boolean);
  const title = reason === 'gas' && medal === 'none' ? 'Out of gas!' :
                medal === 'none' ? (done ? 'Too slow for a medal' : 'Not finished') : `${MEDAL_NAME[medal]} medal!`;
  const el = $('results');
  el.innerHTML = `
    <div class="head"><span class="medal big ${medal}"></span><h1 class="${medal}">${title}</h1></div>
    <p>${lines.join('<br>')}</p>${news}
    <div class="btns">${RUN.paid
      ? `<button id="hubBtn2">📋 Back to the clipboard</button>`
      : `<button id="againBtn">Mow again</button><button id="hubBtn2" class="quiet">📋 Clipboard</button>`}
      <button id="routeBtn" class="quiet">See route</button></div>`;
  el.classList.remove('hidden');
  if (!RUN.paid) clickBtn('againBtn', newRun);
  clickBtn('hubBtn2', showHub);
  clickBtn('routeBtn', () => el.classList.add('hidden'));
  $('finishBtn').textContent = 'Results';
  updateHud();
  // count the money up, with a "ka-ching"
  if (RUN.paid) {
    const pt = $('payTotal'), t0 = performance.now(), dur = 900;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      pt.textContent = money(total * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step); else SFX.cash();
    };
    setTimeout(() => requestAnimationFrame(step), 500);
  }
}

// =====================================================================
//  THE BUSINESS: money, days, gas, wear and tear, customers
//  Everything is saved in the browser (localStorage), so you can come back tomorrow.
// =====================================================================
function newCareer() {
  return {
    v: 1, day: 1, slot: 0, weather: 'sun', money: 0, earned: 0, rep: 0, jobsDone: 0,
    gasCan: 2, tank: MOWERS[0].tank,          // liters of gas in the can and in the mower
    owned: ['old'], mower: 'old', wearOf: { old: 20 },
    unlocked: ['peterson'], lastMowed: { peterson: -3 },
    seen: {}, notes: []
  };
}
function loadCareer() {
  try { const c = JSON.parse(localStorage.getItem(CAREER_KEY)); if (c && c.v === 1) return c; } catch (e) {}
  return null;
}
let career = loadCareer() || newCareer();
function saveCareer() { try { localStorage.setItem(CAREER_KEY, JSON.stringify(career)); } catch (e) {} }
function currentMower() { return MOWERS.find(m => m.id === career.mower) || MOWERS[0]; }
function getWear() { return career.wearOf[career.mower] || 0; }
const grassDays = (y) => career.day - career.lastMowed[y.id];
const payFactor = (days) => days <= BIZ.overdueDays ? 1 : Math.max(BIZ.minPayFactor, 1 - (days - BIZ.overdueDays) * BIZ.overduePenalty);
const jobPay = (y) => y.pay * payFactor(grassDays(y));
// before a paid job you fill the mower's tank from your gas can
function topUpTank() {
  const mw = currentMower();
  career.tank = Math.min(career.tank, mw.tank);
  const take = Math.min(mw.tank - career.tank, career.gasCan);
  if (take > 0) { career.tank += take; career.gasCan -= take; }
}

function startJob(id, paid) {
  const y = YARDS.find(v => v.id === id);
  if (YARD !== y || !yardGroup.children.length) loadYard(id);
  career.lastYard = id;
  const days = grassDays(y);
  RUN = paid ? { paid: true, tall: days > BIZ.overdueDays, payFactor: payFactor(days) } : { paid: false, tall: false, payFactor: 1 };
  setWeather(paid ? 'sun' : career.weather);
  saveCareer();
  newRun();
}

function nextDay() {
  career.day++;
  career.slot = 0;
  career.weather = career.day > 2 && Math.random() < BIZ.rainChance ? 'rain' : 'sun';
  saveCareer();
  showHub();
}

// ---- the clipboard: pick a job, buy gas, fix or buy mowers, go to bed ----
let resetArmed = false;
function showHub() {
  G.inHub = true;
  document.body.classList.add('inhub');
  ['results', 'intro'].forEach(id => $(id).classList.add('hidden'));
  $('pullBtn').classList.add('hidden');
  finder.visible = false;
  ghostMesh.visible = false;
  SFX.engine(false);
  styleMower(currentMower());
  setWeather(career.weather);
  resetArmed = false;

  const c = career, mw = currentMower(), wet = c.weather === 'rain';
  const left = BIZ.jobsPerDay - c.slot;
  const money = (v) => '$' + v.toFixed(2);
  const notes = [];
  if (!c.seen.welcome) {
    c.seen.welcome = true;
    notes.push(`👋 <b>Welcome to your summer job!</b> ${YARDS[0].story}<br>
      Lawns need ${BIZ.readyDays} days to grow back. You can do ${BIZ.jobsPerDay} jobs a day. Good jobs earn ★ reputation,
      and word gets around — new neighbors will call. Keep gas in your can and your mower tuned up!`);
  }
  // nearly broke and out of gas? Mom helps out
  if (c.money < BIZ.gasPrice && c.gasCan + c.tank < 0.3) {
    c.gasCan += 1;
    notes.push('⛽ Mom put a liter of gas in your can. "Pay me back when you\'re rich!"');
  }
  if (wet) notes.push('🌧️ <b>It\'s raining.</b> Nobody wants their lawn mowed in the rain. The grass keeps growing, though! Go shopping, practice, or skip to tomorrow.');
  else if (left <= 0) notes.push('🌇 That\'s enough work for today. Tap <b>Next day</b> to rest — the grass will keep growing overnight.');
  if (c.gasCan + c.tank < mw.tank * 0.6) notes.push('⛽ You\'re low on gas — fill up your gas can before your next job.');

  // jobs
  const jobRows = [];
  for (const y of YARDS) {
    let best = null;
    try { best = JSON.parse(localStorage.getItem(y.id === 'peterson' ? 'lmg3d_yard1_best' : 'lmg3d_best_' + y.id)); } catch (e) {}
    const bestTxt = best && best.time && (best.cut || 0) >= 0.95
      ? ` · best ${best.time.toFixed(1)}s <span class="medal ${best.medal || 'none'}" style="width:11px;height:11px"></span>` : '';
    if (!c.unlocked.includes(y.id)) {
      jobRows.push(`<div class="row locked"><div class="info"><div class="name">🔒 ${y.name}</div>
        <div class="sub2">Will call when you have ${y.stars} ★ (you have ${c.rep})</div></div></div>`);
      break;   // only show the next one coming up
    }
    const d = grassDays(y), ready = d >= BIZ.readyDays, over = d > BIZ.overdueDays;
    const status = !ready ? `Mowed ${d === 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'} — ready in ${BIZ.readyDays - d} day${BIZ.readyDays - d > 1 ? 's' : ''}`
      : over ? `<span class="warn">Overgrown! (${d} days) — pay down to ${Math.round(payFactor(d) * 100)}%, long grass is slower</span>`
      : `<span class="good">Grass is ready</span> (${d} days)`;
    const can = ready && !wet && left > 0;
    jobRows.push(`<div class="row"><div class="info"><div class="name">${y.name}</div>
      <div class="sub2">${status}${bestTxt}</div></div>
      <button data-job="${y.id}" ${can ? '' : 'disabled'}>Mow · ${money(jobPay(y))}</button>
      <button class="quiet" data-practice="${y.id}">Practice</button></div>`);
  }

  // gear and shop
  const wear = getWear();
  const cond = wear < 25 ? '<span class="good">Runs well</span>' : wear < 50 ? 'A bit worn' : '<span class="warn">Needs a tune-up — it may stall!</span>';
  const meter = (f) => `<span class="meter"><i style="width:${Math.round(clamp(f, 0, 1) * 100)}%"></i></span>`;
  const fillL = BIZ.canSize - c.gasCan, fillCost = Math.min(fillL * BIZ.gasPrice, c.money);
  const shopRows = MOWERS.filter(m => m.id !== mw.id).map(m => {
    const own = c.owned.includes(m.id);
    return `<div class="row"><div class="info"><div class="name">${m.name}</div>
      <div class="sub2">${m.like} · ${m.deck}" cut · tank ${m.tank} L</div></div>
      ${own ? `<button data-use="${m.id}">Use it</button>`
            : `<button data-buy="${m.id}" ${c.money >= m.price ? '' : 'disabled'}>Buy · $${m.price}</button>`}</div>`;
  }).join('');

  const el = $('hub');
  el.innerHTML = `
    <h1>📋 My Mowing Business</h1>
    <div class="top"><span>Day <b>${c.day}</b></span><span>${wet ? '🌧️ Rain' : '☀️ Sunny'}</span>
      <span>${left > 0 ? (c.slot === 0 ? 'Morning' : 'Afternoon') + ` · ${left} job${left > 1 ? 's' : ''} left` : 'Evening'}</span>
      <span>💵 <b>${money(c.money)}</b></span><span>★ <b>${c.rep}</b></span></div>
    ${notes.map(n => `<div class="note">${n}</div>`).join('')}
    <h2>Customers</h2>${jobRows.join('')}
    <h2>Your gear</h2>
    <div class="row"><div class="info"><div class="name">${mw.name}</div>
      <div class="sub2">${cond} · chance of stalling ${Math.round(wear)}%</div></div>
      <button data-tune ${wear > 0 && c.money >= BIZ.tuneUp ? '' : 'disabled'}>Tune-up · $${BIZ.tuneUp}</button></div>
    <div class="row"><div class="info"><div class="name">Gas</div>
      <div class="sub2">Mower tank ${meter(c.tank / mw.tank)} ${c.tank.toFixed(2)} L &nbsp; Gas can ${meter(c.gasCan / BIZ.canSize)} ${c.gasCan.toFixed(1)} of ${BIZ.canSize} L · $${BIZ.gasPrice.toFixed(2)}/L</div></div>
      <button data-gas ${fillL > 0.05 && c.money >= 0.5 ? '' : 'disabled'}>Fill can · ${money(fillCost)}</button></div>
    <h2>Mower shop</h2>${shopRows}
    <div class="foot"><button class="quiet" data-reset>Start over</button>
      <span class="sub2" style="font-size:12px;color:#c9dcbf">Earned so far: ${money(c.earned)} · ${c.jobsDone} jobs</span>
      <button data-next>${left > 0 && !wet ? 'Skip to tomorrow ➜' : 'Next day ➜'}</button></div>`;
  el.classList.remove('hidden');
  el.scrollTop = 0;
  saveCareer();

  const on = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); b.blur(); fn(b); }));
  on('[data-job]', b => startJob(b.dataset.job, true));
  on('[data-practice]', b => startJob(b.dataset.practice, false));
  on('[data-next]', nextDay);
  on('[data-tune]', () => { c.money -= BIZ.tuneUp; c.wearOf[c.mower] = 0; SFX.cash(); showHub(); });
  on('[data-gas]', () => {
    const liters = Math.min(fillL, c.money / BIZ.gasPrice);
    c.gasCan += liters; c.money = Math.max(0, c.money - liters * BIZ.gasPrice); SFX.cash(); showHub();
  });
  on('[data-buy]', b => {
    const m = MOWERS.find(v => v.id === b.dataset.buy);
    c.money -= m.price; c.owned.push(m.id); c.mower = m.id; c.wearOf[m.id] = 0;
    c.tank = Math.min(c.tank, m.tank);
    SFX.medal('gold'); showHub();
  });
  on('[data-use]', b => { c.mower = b.dataset.use; c.tank = Math.min(c.tank, currentMower().tank); showHub(); });
  on('[data-reset]', b => {
    if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to erase everything'; return; }
    career = newCareer(); saveCareer(); showHub();
  });
}

// ---- go! ----
updateCamButton();
loadYard(career.lastYard || 'peterson');
placeModel(mowerMesh, YARD.start.x, YARD.start.y, YARD.start.angle);
G.mower = { x: YARD.start.x, y: YARD.start.y, rot: YARD.start.angle };
mlctx.drawImage(uncutCanvas, 0, 0, YARD_W, YARD_H);
showHub();
updateCamera(0, true);
requestAnimationFrame(frame);
window.__game = { G, keys, CAMERA, tilt, readTilt, ctrl, touch, setMode, finish, newRun, mowAt, update, updateCamera,
  get camMode() { return camMode; }, toggleCamera, get career() { return career; }, startJob, showHub, nextDay, loadYard, pullCord, MOWERS, YARDS };   // for testing
</script>
</body>
</html>
