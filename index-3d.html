// =====================================================================
//  TILT TO DRIVE (phones)
//  The phone tells us which way is "up" as it tilts. We turn that into
//  directions on the screen, compare with how you held it when you
//  started (the "level" position), and turn the difference into
//  driving and steering.
// =====================================================================
const tilt = { on: false, level: null, latest: null, source: 'none', oriOK: false, oriNull: 0, g: null, events: 0 };
const toRad = Math.PI / 180;
// turn the phone's "up" direction (in the phone's own directions) into screen directions
function upToScreen(ux, uy, uz) {
  const len = Math.hypot(ux, uy, uz) || 1;
  ux /= len; uy /= len; uz /= len;
  const ang = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * toRad;
  const sx = ux * Math.cos(ang) - uy * Math.sin(ang);
  const sy = ux * Math.sin(ang) + uy * Math.cos(ang);
  return { pitch: Math.atan2(sy, uz) / toRad, roll: Math.asin(clamp(sx, -1, 1)) / toRad };
}
// Source 1: the phone's orientation sensor (smooth)
function onOrientation(e) {
  tilt.events++;
  if (e.beta == null || e.gamma == null) { tilt.oriNull++; return; }
  tilt.oriOK = true;
  const b = e.beta * toRad, g = e.gamma * toRad;
  gotReading(upToScreen(-Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g)), 'orientation');
}
// Source 2 (backup): the raw motion sensor, which feels gravity
function onMotion(e) {
  tilt.events++;
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || tilt.oriOK) return;
  const k = 0.2;   // smooth out the jitter
  tilt.g = tilt.g ? { x: tilt.g.x + (a.x - tilt.g.x) * k, y: tilt.g.y + (a.y - tilt.g.y) * k, z: tilt.g.z + (a.z - tilt.g.z) * k }
                  : { x: a.x, y: a.y, z: a.z };
  gotReading(upToScreen(tilt.g.x, tilt.g.y, tilt.g.z), 'motion');
}
function gotReading(u, source) {
  tilt.latest = u;
  tilt.source = source;
  if (!tilt.level && !tilt.settling) levelSoon();
}
// wait a moment for the phone to stop moving, then call that position "level"
function levelSoon(msg) {
  tilt.level = null;
  tilt.settling = true;
  clearTimeout(tilt.settleTimer);
  tilt.settleTimer = setTimeout(() => {
    tilt.settling = false;
    setLevel();
    if (msg) pop(G.mower.x, G.mower.y, msg, '#e8f5e0');
  }, TILT.settle * 1000);
}
// lock the screen sideways (needs full screen on Android); try again on every tap of Level
function lockSideways() {
  try {
    const go = () => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {});
    if (document.fullscreenElement) go();
    else {
      const fs = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      if (fs && fs.then) fs.then(go).catch(() => {});
    }
  } catch (e) {}
}
// if the screen turns anyway, start again from a fresh "level"
const onTurned = () => { if (tilt.on) levelSoon('Screen turned — level reset'); };
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onTurned);
else window.addEventListener('orientationchange', onTurned);
function setLevel() {
  ctrl.cruising = false;
  if (!tilt.latest) return;
  tilt.level = { ...tilt.latest };
}
function readTilt() {
  const u = tilt.latest, L = tilt.level;
  if (!u || !L || tilt.settling) return { drive: 0, turn: 0 };
  const dz = (v) => Math.sign(v) * Math.max(0, Math.abs(v) - TILT.dead);
  let fwd = dz(L.pitch - u.pitch) / (TILT.forward - TILT.dead);
  let steer = dz(-(u.roll - L.roll)) / (TILT.steer - TILT.dead);
  if (TILT.invertDrive) fwd = -fwd;
  if (TILT.invertSteer) steer = -steer;
  return { drive: clamp(fwd, -1, 1), turn: clamp(steer, -1, 1) };
}
async function startTilt() {
  if (!window.isSecureContext) { tiltProblem('Tilt only works when the game is opened from an https:// web address.'); return; }
  // Some browsers ask for permission first. Both requests must go out at the same
  // moment, right after the tap — a second, later request gets rejected.
  const asks = [window.DeviceOrientationEvent, window.DeviceMotionEvent]
    .filter(Ev => Ev && typeof Ev.requestPermission === 'function')
    .map(Ev => { try { return Ev.requestPermission(); } catch (e) { return Promise.reject(e); } });
  // Don't give up if an answer is "no" or an error: just listen anyway — the readout shows what arrives.
  Promise.allSettled(asks).then(results => {
    tilt.permission = results.length === 0 ? 'not needed'
      : results.some(r => r.status === 'fulfilled' && r.value === 'granted') ? 'granted' : 'refused';
  });
  // start listening straight away…
  tilt.on = true; tilt.level = null; tilt.latest = null;
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  $('levelBtn').classList.remove('hidden');
  $('tiltDbg').classList.remove('hidden');
  hideIntro();
  // …then go full screen and sideways, without waiting for an answer
  lockSideways();
  // wait for the first reading, then show the "tilt to start" card
  let waited = 0;
  const check = setInterval(() => {
    waited += 250;
    if (tilt.latest) { clearInterval(check); hideIntro(); }
    else if (waited === 2000) {
      const n = document.querySelector('#intro .tiltnote');
      if (n) n.textContent = tilt.events === 0
        ? 'No tilt readings yet. Your browser may be blocking motion sensors — see the note below the game.'
        : 'The phone sends tilt readings, but they are empty — the browser is probably blocking motion sensors.';
    }
  }, 250);
}
function updateTiltDbg() {
  if (!tilt.on) return;
  const u = tilt.latest, L = tilt.level;
  $('tiltDbg').textContent = u && !L
    ? `tilt (${tilt.source}): hold steady…`
    : !u
    ? `tilt: waiting… (${tilt.events} events, ${tilt.oriNull} empty, permission: ${tilt.permission || 'asking'})`
    : `tilt (${tilt.source}): forward ${(L.pitch - u.pitch).toFixed(0)}° · steer ${(-(u.roll - L.roll)).toFixed(0)}°`;
}
function tiltProblem(msg) {
  tilt.on = false;
  const n = document.querySelector('#intro .tiltnote');
  if (n) n.textContent = msg + ' You can still drive by holding your finger on the lawn.';
}
clickBtn('levelBtn', () => { lockSideways(); levelSoon('Level set'); });
const isPhone = window.matchMedia('(pointer: coarse)').matches;

// =====================================================================
//  PHONE CONTROL STYLES
//   auto  = the mower drives itself; tilt to steer, nudge back to stop
//   tilt  = tilt forward for speed, turn like a wheel to steer
//   touch = on-screen steering pad and GO / REV pedals
// =====================================================================
const CTRL_NAMES = { auto: 'Auto-drive + tilt', tilt: 'Tilt to drive', touch: 'Touch' };
const ctrl = { mode: 'none', cruising: false, sm: { turn: 0, drive: 0 } };
const touch = { id: null, x0: 0, steer: 0, gas: false, rev: false };
const curve = (v) => Math.sign(v) * Math.pow(Math.abs(v), STEERING.curve);

function phoneInput(dt) {
  let raw = null;
  if (ctrl.mode === 'touch') {
    raw = { turn: curve(touch.steer), drive: touch.gas ? 1 : touch.rev ? -1 : 0 };
  } else if ((ctrl.mode === 'tilt' || ctrl.mode === 'auto') && tilt.on) {
    const t = readTilt();
    if (!t) return { turn: 0, drive: 0 };
    if (ctrl.mode === 'tilt') raw = { turn: curve(t.turn), drive: t.drive };
    else {
      // auto-drive: a nudge forward starts cruising, a nudge back stops, tilting further back reverses
      if (t.drive > 0.35) ctrl.cruising = true;
      if (t.drive < -0.35) ctrl.cruising = false;
      raw = { turn: curve(t.turn), drive: t.drive < -0.75 ? -1 : ctrl.cruising ? STEERING.autoSpeed : 0 };
    }
  }
  if (!raw) return null;
  // smooth it out so a shaky hand doesn't make the mower jerk
  const k = 1 - Math.exp(-dt / STEERING.smooth);
  ctrl.sm.turn += (raw.turn - ctrl.sm.turn) * k;
  ctrl.sm.drive += (raw.drive - ctrl.sm.drive) * k;
  const tidy = (v) => Math.abs(v) < 0.02 ? 0 : v;
  return { turn: tidy(ctrl.sm.turn), drive: tidy(ctrl.sm.drive) };
}

function setMode(mode) {
  ctrl.mode = mode;
  ctrl.cruising = false;
  ctrl.sm = { turn: 0, drive: 0 };
  try { localStorage.setItem('lmg3d_ctrl', mode); } catch (e) {}
  const isTouch = mode === 'touch';
  document.body.classList.toggle('touch', isTouch);
  $('touchUI').classList.toggle('hidden', !isTouch);
  $('levelBtn').classList.toggle('hidden', isTouch);
  $('tiltDbg').classList.toggle('hidden', isTouch);
  // (the tilt styles are still in the code, but the button to switch to them is hidden for now)
  $('ctrlBtn').classList.toggle('hidden', isTouch);
  $('ctrlBtn').querySelector('.lbl').textContent = CTRL_NAMES[mode];
  hideIntro();
  if (isTouch) lockSideways();
  else if (!tilt.on) startTilt();
  const hint = { auto: 'Nudge forward to go · back to stop', tilt: 'Tilt away from you to go!', touch: 'Hold GO · drag the pad to steer' }[mode];
  setTimeout(() => pop(G.mower.x, G.mower.y, hint, '#fff3a0', 20), 400);
}
clickBtn('ctrlBtn', () => setMode(ctrl.mode === 'auto' ? 'tilt' : ctrl.mode === 'tilt' ? 'touch' : 'auto'));

// touch pad: drag sideways from wherever your thumb lands
{
  const pad = document.getElementById('steerPad'), knob = document.getElementById('knob');
  const RANGE = 70;   // pixels of drag for the sharpest turn
  const moveKnob = (dx) => { knob.style.transform = `translateX(${dx}px)`; };
  pad.addEventListener('pointerdown', (e) => {
    touch.id = e.pointerId; touch.x0 = e.clientX; touch.steer = 0;
    pad.setPointerCapture(e.pointerId); moveKnob(0);
  });
  pad.addEventListener('pointermove', (e) => {
    if (e.pointerId !== touch.id) return;
    const dx = clamp(e.clientX - touch.x0, -RANGE, RANGE);
    touch.steer = dx / RANGE;
    moveKnob(dx);
  });
  const release = (e) => { if (e.pointerId !== touch.id) return; touch.id = null; touch.steer = 0; moveKnob(0); };
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);
  for (const [id, key] of [['gasBtn', 'gas'], ['revBtn', 'rev']]) {
    const b = document.getElementById(id);
    const on = (v) => (e) => { touch[key] = v; b.classList.toggle('on', v); if (v) b.setPointerCapture(e.pointerId); };
    b.addEventListener('pointerdown', on(true));
    b.addEventListener('pointerup', on(false));
    b.addEventListener('pointercancel', on(false));
  }
}

// =====================================================================
//  GRAPHICS QUALITY — press Q to change. If the game runs slowly, it
//  steps down by itself (sharpness first, then fewer grass blades).
// =====================================================================
const QUALITY = [
  // (phones draw at 1.5× sharpness at most: their screens are tiny, and double sharpness needs a lot of graphics memory)
  { name: 'High',   pr: Math.min(window.devicePixelRatio || 1, window.matchMedia('(pointer: coarse)').matches ? 1.5 : 2), grass: 1, post: true, bloom: true },
  { name: 'Medium', pr: 1,    grass: 0.6, post: true, bloom: false },
  { name: 'Low',    pr: 0.75, grass: 0.3, post: false, bloom: false }
];
let qLevel = 0, qAuto = true;
try { const q = localStorage.getItem('lmg3d_quality'); if (q !== null) { qLevel = +q; qAuto = false; } } catch (e) {}
function applyQuality() {
  const q = QUALITY[qLevel];
  renderer.setPixelRatio(q.pr);
  resize();
  if (grassMesh) grassMesh.count = Math.floor(tuftCount * q.grass);
  bloom.enabled = q.bloom;
}
applyQuality();
const fpsMeter = { t: 0, frames: 0 };
function checkSpeed(dt) {
  if (!qAuto || qLevel >= QUALITY.length - 1) return;
  if (dt > 0.5) { fpsMeter.t = 0; fpsMeter.frames = 0; return; }   // the game was paused or in the background, not slow
  fpsMeter.t += dt; fpsMeter.frames++;
  if (fpsMeter.t < 3) return;
  const fps = fpsMeter.frames / fpsMeter.t;
  fpsMeter.t = 0; fpsMeter.frames = 0;
  if (fps < 40) {
    qLevel++;
    applyQuality();
    pop(G.mower.x, G.mower.y, `Graphics: ${QUALITY[qLevel].name} (Q to change)`, '#e8f5e0');
  }
}
window.addEventListener('keydown', (e) => {
  if (e.code !== 'KeyQ' || e.repeat) return;
  qLevel = (qLevel + 1) % QUALITY.length;
  qAuto = false;
  try { localStorage.setItem('lmg3d_quality', qLevel); } catch (err) {}
  applyQuality();
  pop(G.mower.x, G.mower.y, `Graphics: ${QUALITY[qLevel].name}`, '#e8f5e0');
});

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function frame(now) {
  if (PAUSE.on) {
    // paused: nothing moves; redraw a few times a second only (saves battery), e.g. after the screen turns
    lastT = now; frame.prev = now;
    if (now - PAUSE.drawn > 250) { PAUSE.drawn = now; if (QUALITY[qLevel].post) composer.render(); else renderer.render(scene, camera); }
    requestAnimationFrame(frame);
    return;
  }
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  timeU.value = now / 1000;
  checkSpeed((now - (frame.prev || now)) / 1000); frame.prev = now;
  update(dt);
  updateBirds(dt);
  updatePet(dt);
  updateClips(dt);
  updateRings(dt);
  updateRain(dt);
  updateCamera(dt, false);
  updateFading(dt);
  updateTiltDbg();
  drawMini();
  if (QUALITY[qLevel].post) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// =====================================================================
//  PAUSE — the ⏸ button or P. The game also pauses by itself when you
//  switch apps, get a call, lock the phone, or hold the phone upright.
// =====================================================================
const PAUSE = { on: false, drawn: 0 };
function pauseGame() {
  if (PAUSE.on || !G.started || G.finished || G.inHub) return;
  PAUSE.on = true; PAUSE.drawn = 0;
  // let go of everything, so the mower doesn't drive off by itself when you come back
  keys.clear(); pointer.active = false;
  touch.id = null; touch.steer = 0; touch.gas = touch.rev = false;
  for (const id of ['gasBtn', 'revBtn']) $(id).classList.remove('on');
  $('knob').style.transform = '';
  if (SFX.ctx) SFX.ctx.suspend();
  document.body.classList.add('paused');
  const locked = RUN.paid && !RUN.watch;   // paid jobs: no do-overs, no leaving halfway
  const card = $('pauseCard');
  card.innerHTML = `<h1>⏸ Paused</h1>
    <p>The clock is stopped at <b>${G.elapsed.toFixed(1)}s</b>.</p>
    <div class="btns">
      <button id="resumeBtn" class="big">▶ Keep mowing</button>
      <button id="pSoundBtn" class="quiet">${SFX.on ? '🔊 Sound on' : '🔇 Sound off'}</button>
      ${locked ? '' : '<button id="pRestartBtn" class="quiet">⟲ Start yard over</button><button id="pHubBtn" class="quiet">📋 Clipboard</button>'}
    </div>
    ${locked ? '<div class="small">Paid job — finish it to get paid.</div>' : ''}`;
  card.classList.remove('hidden');
  clickBtn('resumeBtn', resumeGame);
  clickBtn('pSoundBtn', () => { SFX.toggle(); if (SFX.ctx) SFX.ctx.suspend(); $('pSoundBtn').textContent = SFX.on ? '🔊 Sound on' : '🔇 Sound off'; });
  if (!locked) {
    clickBtn('pRestartBtn', () => { resumeGame(); newRun(); });
    clickBtn('pHubBtn', () => { resumeGame(); showHub(); });
  }
}
function resumeGame() {
  if (!PAUSE.on) return;
  if (window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches) return;   // still upright: wait
  PAUSE.on = false;
  $('pauseCard').classList.add('hidden');
  document.body.classList.remove('paused');
  if (SFX.ctx && !document.hidden) SFX.ctx.resume();
}
clickBtn('pauseBtn', () => { if (PAUSE.on) resumeGame(); else pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('pagehide', pauseGame);
{
  const upright = window.matchMedia('(orientation: portrait) and (pointer: coarse)');
  const check = () => { if (upright.matches) pauseGame(); };
  if (upright.addEventListener) upright.addEventListener('change', check); else upright.addListener(check);
}

function update(dt) {
  if (G.finished || G.inHub) return;
  if (RUN.watch) return watchUpdate(dt);
  const m = G.mower;

  let turn = 0, drive = 0;
  if (down('ArrowLeft', 'KeyA')) turn -= 1;
  if (down('ArrowRight', 'KeyD')) turn += 1;
  if (down('ArrowUp', 'KeyW')) drive = 1;
  else if (down('ArrowDown', 'KeyS')) drive = -1;

  const ph = phoneInput(dt);
  if (ph) { turn = ph.turn; drive = ph.drive; }
  else if (pointer.active && ctrl.mode === 'none') {
    const ndc = new THREE.Vector2(pointer.x / window.innerWidth * 2 - 1, -(pointer.y / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, hit)) {
      const dx = hit.x - m.x, dy = hit.z - m.y;
      if (Math.hypot(dx, dy) > 12) {
        const diff = wrapAngle(Math.atan2(dy, dx) - m.rot);
        turn = clamp(diff / (MOWER.turnSpeed * dt), -1, 1);
        if (Math.abs(diff) < 1.0) drive = 1;
      }
    }
  }

  if ((turn !== 0 || drive !== 0) && !G.started) { G.started = true; hideIntro(); SFX.startUp(); }
  if (G.started) {
    G.elapsed += dt;
    if (G.stallAt && G.elapsed >= G.stallAt && !G.trimming) stall();
    if (!G.stalled && !G.trimming) G.fuel -= dt * (IDLE_BURN + (1 - IDLE_BURN) * Math.min(1, Math.abs(G.throttle)));
    if (G.fuel <= 0) {
      G.fuel = 0;
      pop(m.x, m.y, 'Out of gas!', '#ff8a6b', 24);
      SFX.sputterOut();
      finish('gas');
      return;
    }
    if (!G.mowDoneAt) checkMedalClock();   // the medal clock stops once the mowing is done (trimming after that is free)
  }
  if (G.stalled) { turn = 0; drive = 0; }

  // the mower has a bit of weight: it takes a moment to get going and to stop
  G.throttle += (drive - G.throttle) * (1 - Math.exp(-dt / 0.09));
  if (Math.abs(G.throttle) < 0.01 && drive === 0) G.throttle = 0;
  const th = G.throttle;
  const prevX = m.x, prevY = m.y;

  // a lawn tractor steers its front wheels, so it can only turn while it's rolling
  if (currentMower().type === 'tractor' && !G.trimming) turn *= Math.min(1, Math.abs(G.throttle) * 3);
  m.rot += turn * MOWER.turnSpeed * dt;
  // magnetic straight lines (phones): near straight and only steering lightly? get pulled into line.
  // The harder you steer, the weaker the pull — steer past assistHold and you're free to turn.
  let locked = false;
  if (ctrl.mode !== 'none' && STEERING.assist && drive !== 0 && !G.stalled) {
    const straightA = Math.round(m.rot / (Math.PI / 2)) * (Math.PI / 2);
    const off = wrapAngle(straightA - m.rot), steer = Math.abs(turn);
    if (Math.abs(off) < STEERING.assistAngle * toRad && steer < STEERING.assistHold) {
      const strength = STEERING.assistPull * (1 - steer / STEERING.assistHold);
      m.rot += off * (1 - Math.exp(-dt * strength));
      if (Math.abs(off) < 0.6 * toRad && strength > STEERING.assistPull * 0.5) { m.rot = straightA + (m.rot - straightA) * 0.5; locked = true; }
    }
  }
  if (locked && !G.locked) SFX.tone(900, 0.04, 'sine', 0.035);   // tiny "click" as it locks on
  G.locked = locked;
  updateGuide(locked && th > 0.2);
  G.bumpCD -= dt;
  if (th !== 0) {
    const sp = th > 0 ? MOWER.speed * th : MOWER.reverseSpeed * th;   // can be in-between (tilting, speeding up)
    const want = Math.abs(sp * dt);
    let nx = m.x + Math.cos(m.rot) * sp * dt, ny = m.y + Math.sin(m.rot) * sp * dt;
    if (collides(nx, ny) && G.trimming) {
      // trimmer: glide along fences, walls and trees. Try steps a little to the side of where
      // you're heading (more and more), and take the first one that fits. No bonks.
      const dir = Math.sign(sp);
      let found = false;
      for (const deg of [15, 30, 45, 60, 70, 80, 90]) {
        for (const side of [G.slideSide || 1, -(G.slideSide || 1)]) {
          // (straight sideways, at 90°, still moves at almost half speed, so you edge around trees you walk right into)
          const a = m.rot + side * deg * toRad, step = want * Math.max(0.45, Math.cos(deg * toRad));
          const tx = m.x + Math.cos(a) * step * dir, ty = m.y + Math.sin(a) * step * dir;
          if (!collides(tx, ty)) { nx = tx; ny = ty; G.slideSide = side; found = true; break; }
        }
        if (found) break;
      }
      if (!found) { nx = m.x; ny = m.y; }
    } else if (collides(nx, ny)) {
      if (!collides(nx, m.y)) ny = m.y;
      else if (!collides(m.x, ny)) nx = m.x;
      else { nx = m.x; ny = m.y; }
      // ran into something head-on? Bonk!
      if (Math.hypot(nx - m.x, ny - m.y) < want * 0.35 && Math.abs(th) > 0.5) bump(m, th);
    } else if (G.trimming) G.slideSide = 0;   // free again: next time, slide whichever way fits first
    G.distance += Math.hypot(nx - m.x, ny - m.y);
    m.x = nx; m.y = ny;
  }
  const moved = Math.hypot(m.x - prevX, m.y - prevY);

  let newlyCut = 0;
  if (G.started && !G.stalled) {
    newlyCut = mowAt(m.x, m.y, m.rot);
    if (newlyCut > 0) {
      // more grass = more clippings; long grass really sprays
      const n = Math.min(8, Math.round(newlyCut * (RUN.tall ? 2.5 : 1.6)));
      emitClips(m.x, m.y, m.rot, n, RUN.tall ? 1.3 : 1);
    }
    if (!G.trimming) trackStyle(drive, moved, newlyCut);   // clean stripes are a mower thing
    checkMilestones();
  }
  const running = G.started && !G.stalled;
  SFX.engine(running, Math.min(1, Math.abs(th)), newlyCut, G.fuel / fuelMax < 0.2);

  // move the 3D model, swing the worker's legs as he walks, bob him up and down,
  // and make the mower shake from the engine (more when it's chewing through grass)
  const mm = G.trimming ? trimMesh : mowerMesh;    // while trimming, the mower stays parked
  placeModel(mm, m.x, m.y, m.rot);
  G.walk += moved * (th < 0 ? -1 : 1);
  const swing = moved > 0.1 ? Math.sin(G.walk * 0.12) * 0.45 : 0;
  const ud = mm.userData, walking = ud.type === 'walk' || ud.type === 'trimmer';
  if (ud.spinner) ud.spinner.rotation.y += dt * 40;
  if (walking) {
    ud.legs[0].rotation.z = swing;
    ud.legs[1].rotation.z = -swing;
    // knees bend as each foot swings forward (the leg lifts), and stay straight while it pushes
    ud.knees[0].rotation.z = moved > 0.1 ? -Math.max(0, Math.cos(G.walk * 0.12)) * 0.75 : 0;
    ud.knees[1].rotation.z = moved > 0.1 ? -Math.max(0, -Math.cos(G.walk * 0.12)) * 0.75 : 0;
    ud.worker.position.y = moved > 0.1 ? Math.abs(Math.cos(G.walk * 0.12)) * 1.1 : 0;
  } else ud.worker.position.y = moved > 0.1 ? Math.sin(performance.now() / 70) * 0.35 : 0;   // riding: a little bumpy
  const t = performance.now() / 1000, rumble = running ? 0.18 + (newlyCut > 0 ? 0.22 : 0) : 0;
  const mg = ud.mower;
  mg.position.y = Math.sin(t * 71) * rumble;
  mg.rotation.x = Math.sin(t * 53) * rumble * 0.012;
  mg.rotation.z = Math.sin(t * 61) * rumble * 0.01 + (G.bumpWobble || 0);
  G.bumpWobble = (G.bumpWobble || 0) * Math.exp(-dt * 8);

  const last = G.trail[G.trail.length - 1];
  if (Math.hypot(m.x - last.x, m.y - last.y) > 6) G.trail.push({ x: m.x, y: m.y });

  if (G.started) {
    G.recTimer -= dt;
    if (G.recTimer <= 0) { G.recTimer = 0.05; recordSample(); }
  }
  if (watcher) watcher.rotation.y = -Math.atan2(m.y - watcher.position.z, m.x - watcher.position.x);   // the helper follows you with their eyes
  updateFinder(dt);
  updateSwap();
  updateGhost();
  updateHud();
  // all done? (if there are edges left, tell the player about the trimmer instead of ending)
  const edgesLeft = G.trimTotal - G.trimCount;
  if (G.cutCount >= grassTotal && !G.mowDoneAt) {
    G.mowDoneAt = G.elapsed;
    if (edgesLeft > 0) {
      SFX.chime(3); flash('gold');
      pop(m.x, m.y, 'Lawn mowed! 🌿 Trim the edges for a big tip — or tap Finish', '#fff3a0', 20);
    }
  }
  if (G.cutCount >= grassTotal && edgesLeft <= 0) finish();
}

// ---- swapping between the mower and the trimmer (at the end of the driveway) ----
function nearSwap() {
  const m = G.mower, z = G.trimming ? G.parked : G.zone;
  return z && Math.hypot(m.x - z.x, m.y - z.y) < BIZ.swapZone;
}
function updateSwap() {
  const show = !G.finished && !G.stalled;
  const z = G.trimming ? G.parked : G.zone;
  swapRing.visible = show && !!z;
  if (z) { swapRing.position.set(z.x, 2.5, z.y); swapRing.material.opacity = nearSwap() ? 0.6 + 0.25 * Math.sin(performance.now() / 150) : 0.25; }
  const b = $('toolBtn');
  b.classList.toggle('hidden', !(show && nearSwap()));
  b.textContent = G.trimming ? '🚜 Mower' : '🌿 Trimmer';
}
function toggleTool() {
  if (G.finished || G.stalled || G.inHub) return;
  const m = G.mower;
  if (!nearSwap()) {
    pop(m.x, m.y, G.trimming ? 'Walk back to your mower to swap' : 'Swap to the trimmer at the end of the driveway', '#ffab7a');
    return;
  }
  if (!G.trimming) {
    G.parked = { ...m };
    G.savedSpec = { speed: MOWER.speed, reverseSpeed: MOWER.reverseSpeed, turnSpeed: MOWER.turnSpeed, deckRadius: MOWER.deckRadius, bodyRadius: MOWER.bodyRadius };
    Object.assign(MOWER, TRIMMER);
    G.trimming = true;
    // step off to the side of the mower
    const sx = m.x - Math.sin(m.rot) * (G.savedSpec.bodyRadius + 14), sy = m.y + Math.cos(m.rot) * (G.savedSpec.bodyRadius + 14);
    if (!collides(sx, sy)) { m.x = sx; m.y = sy; }
    trimMesh.visible = true;
    mowerMesh.userData.worker.visible = false;   // he got off the mower
    SFX.setProfile('trimmer');
    G.hunting = true;   // the arrow now points at the edges
    pop(m.x, m.y, `🌿 Trimmer! ${G.trimTotal - G.trimCount} edge spots to trim`, '#c6f0a8', 20);
  } else {
    Object.assign(MOWER, G.savedSpec);
    Object.assign(m, G.parked);
    G.trimming = false;
    trimMesh.visible = false;
    mowerMesh.userData.worker.visible = true;
    SFX.setProfile(currentMower().id);
    G.hunting = G.cutCount / grassTotal >= 0.95;
    pop(m.x, m.y, '🚜 Back on the mower', '#c6f0a8', 18);
  }
  G.throttle = 0;
  SFX.pull(); buzz(30);
}

// Ran into the fence, the house or a tree
function bump(m, th) {
  if (G.bumpCD > 0) return;
  G.bumpCD = 0.6;
  // hit a tree? the birds in it fly off
  for (const t of YARD.trees) if (Math.hypot(t.x - m.x, t.y - m.y) < t.r + MOWER.bodyRadius + 12) scareBirds(t.x, t.y, t.r + 30);
  if (pet && Math.hypot(pet.x - m.x, pet.y - m.y) < pet.R + MOWER.bodyRadius + 10) petNotice();
  SFX.bonk();
  buzz(35);
  G.shake = 1;
  G.bumpWobble = 0.12 * Math.sign(th);
  // bounce back a little
  const bx = m.x - Math.cos(m.rot) * 4 * Math.sign(th), by = m.y - Math.sin(m.rot) * 4 * Math.sign(th);
  if (!collides(bx, by)) { m.x = bx; m.y = by; }
  G.throttle = -0.15 * Math.sign(th);
  if (Math.random() < 0.5) pop(m.x, m.y, Math.random() < 0.5 ? 'Bonk!' : 'Oof!', '#ffffff', 16);
}

// A worn-out mower can die in the middle of a job. Pull the cord to restart it!
function stall() {
  G.stallAt = null;
  G.stalled = { need: 3 + Math.floor(Math.random() * 3), done: 0 };
  SFX.sputterOut();
  buzz([80, 60, 160]);
  pop(G.mower.x, G.mower.y, 'The engine died!', '#ff8a6b', 24);
  setTimeout(() => { if (G.stalled) $('pullBtn').classList.remove('hidden'); }, 500);
}
function pullCord() {
  const s = G.stalled;
  if (!s || G.finished) return;
  s.done++;
  SFX.pull();
  buzz(25);
  const b = $('pullBtn');
  b.classList.add('yank'); setTimeout(() => b.classList.remove('yank'), 90);
  G.bumpWobble = 0.08;
  if (s.done >= s.need) {
    G.stalled = null;
    b.classList.add('hidden');
    SFX.startUp();
    pop(G.mower.x, G.mower.y, 'Vroom! Back to work', '#9be37a', 20);
  } else pop(G.mower.x, G.mower.y, ['Pull!', 'Again!', 'Come on…', 'Almost!'][Math.min(3, s.done - 1)], '#ffffff', 16);
}

// The medal clock: ticks in the last 5 seconds before a medal time, and a sad sound when it's gone
function checkMedalClock() {
  const order = ['gold', 'silver', 'bronze'];
  const next = order[G.medalStage];
  if (!next) return;
  const left = medalT[next] - G.elapsed;
  if (left <= 5 && left > 0 && Math.ceil(left) !== G.lastTick) { G.lastTick = Math.ceil(left); SFX.tick(); }
  if (left <= 0) {
    G.medalStage++;
    SFX.medalGone();
    pop(G.mower.x, G.mower.y, `${MEDAL_NAME[next]} time is gone`, '#ffab7a', 17);
    const icon = $('medalNext');
    icon.classList.remove('shake'); void icon.offsetWidth; icon.classList.add('shake');
  }
  $('timer').classList.toggle('hurry', left <= 5 && left > 0);
}

// Little celebrations at 50%, 75% and 90% — and at 95%, help finding the last bits
function checkMilestones() {
  const f = G.cutCount / grassTotal;
  const marks = [0.5, 0.75, 0.9, 0.95];
  while (G.milestone < marks.length && f >= marks[G.milestone]) {
    const k = G.milestone++;
    if (k < 3) { SFX.chime(k); pop(G.mower.x, G.mower.y, `${Math.round(marks[k] * 100)}% done!`, '#c6f0a8', 18); }
    else { G.hunting = true; SFX.chime(3); pop(G.mower.x, G.mower.y, 'Almost! Find the last bits →', '#fff3a0', 18); }
  }
}

// Point the ground arrow at the nearest uncut grass (checked a few times a second)
function updateFinder(dt) {
  if (!G.hunting) { finder.visible = false; return; }
  const m = G.mower;
  G.finderT -= dt;
  if (G.finderT <= 0) {
    G.finderT = 0.25;
    // with the mower: the nearest missed grass. With the trimmer: the nearest edge (or missed grass if no edges are left).
    const find = (want) => {
      let best = null, bd = Infinity;
      for (let i = 0; i < G.cells.length; i++) {
        if (G.cells[i] !== want) continue;
        const x = (i % COLS) * CELL + CELL / 2, y = Math.floor(i / COLS) * CELL + CELL / 2, d = (x - m.x) ** 2 + (y - m.y) ** 2;
        if (d < bd) { bd = d; best = { x, y }; }
      }
      return best;
    };
    G.target = G.trimming ? (find(3) || find(1)) : find(1);
  }
  const tg = G.target;
  finder.visible = !!tg && Math.hypot(tg.x - m.x, tg.y - m.y) > MOWER.deckRadius + 10;
  if (!finder.visible) return;
  finder.position.set(m.x, 3 + Math.sin(performance.now() / 150) * 1.5, m.y);
  finder.rotation.y = -Math.atan2(tg.y - m.y, tg.x - m.x);
}

function recordSample() {
  const m = G.mower;
  G.rec.push([+G.elapsed.toFixed(2), Math.round(m.x), Math.round(m.y), +m.rot.toFixed(2), +(G.cutCount / grassTotal).toFixed(4), G.trimming ? 1 : 0]);
}

function updateGhost() {
  G.ghostCut = null;
  if (!G.ghostData) return;
  const d = G.ghostData, t = G.elapsed, lastS = d[d.length - 1];
  if (t >= lastS[0]) { placeModel(ghostMesh, lastS[1], lastS[2], lastS[3]); G.ghostCut = lastS[4] ?? null; return; }
  while (G.ghostIndex < d.length - 2 && d[G.ghostIndex + 1][0] <= t) G.ghostIndex++;
  const a = d[G.ghostIndex], b = d[G.ghostIndex + 1];
  const f = b[0] > a[0] ? clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 0;
  const gx = a[1] + (b[1] - a[1]) * f, gy = a[2] + (b[2] - a[2]) * f;
  placeModel(ghostMesh, gx, gy, a[3] + wrapAngle(b[3] - a[3]) * f);
  // how much the ghost had cut at this moment (older ghosts didn't record this)
  if (a[4] !== undefined && b[4] !== undefined) G.ghostCut = a[4] + (b[4] - a[4]) * f;
  if (G.started) {
    // (the ghost's path is only drawn on the minimap, not on the 3D lawn)
    mgctx.fillStyle = '#4aa8ff'; mgctx.beginPath(); mgctx.arc(gx, gy, MOWER.deckRadius, 0, 7); mgctx.fill();
  }
}

// Cut grass under the deck. Returns how many new cells were cut.
function mowAt(x, y, rot) {
  const cx = Math.cos(rot), sy = Math.sin(rot);
  const light = Math.abs(cx) >= Math.abs(sy) ? cx > 0 : sy > 0;
  // the mower lays down a stripe wherever it goes; the trimmer only marks grass it actually cuts
  // (so walking across the lawn with it doesn't leave a line)
  if (!G.trimming) {
    stampMask(x, y, light, false);
    mlctx.fillStyle = light ? '#94d36c' : '#6fb04b';
    mlctx.beginPath(); mlctx.arc(x, y, MOWER.deckRadius, 0, 7); mlctx.fill();
  }

  let n = 0;
  const r = MOWER.deckRadius;
  const c0 = Math.max(0, Math.floor((x - r) / CELL)), c1 = Math.min(COLS - 1, Math.floor((x + r) / CELL));
  const r0 = Math.max(0, Math.floor((y - r) / CELL)), r1 = Math.min(ROWS - 1, Math.floor((y + r) / CELL));
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      const i = row * COLS + col, v = G.cells[i];
      if (v !== 1 && !(v === 3 && G.trimming)) continue;     // edges (3) can only be cut with the trimmer
      const ccx = col * CELL + CELL / 2, ccy = row * CELL + CELL / 2;
      if ((ccx - x) ** 2 + (ccy - y) ** 2 <= r * r) {
        G.cells[i] = 2; if (v === 3) G.trimCount++; else G.cutCount++; n++;
        if (G.trimming) trimCell(col, row);
      }
    }
  }
  if (!G.trimming) windrow(x, y, rot, n);
  return n;
}

// the trimmer cuts one grass cell: mark just that cell as cut (no stripe direction: trimmed grass looks in-between)
function trimCell(col, row) {
  // a soft round spot around the cell's middle (in mask pixels: 1 pixel = 2 units), so trimmed paths look smooth
  const cx = (col + 0.5) * CELL / 2, cy = (row + 0.5) * CELL / 2, R = CELL * 0.42;
  for (let ty = Math.max(0, Math.floor(cy - R)); ty <= Math.min(MH - 1, Math.ceil(cy + R)); ty++)
    for (let tx = Math.max(0, Math.floor(cx - R)); tx <= Math.min(MW - 1, Math.ceil(cx + R)); tx++) {
      const d = Math.hypot(tx + 0.5 - cx, ty + 0.5 - cy) / R;
      if (d >= 1) continue;
      const i = ((MH - 1 - ty) * MW + tx) * 4, v = Math.round(255 * Math.min(1, (1 - d) * 2.2));
      if (maskData[i] < v) { maskData[i] = v; maskData[i + 1] = 128; }
    }
  maskTex.needsUpdate = true;
  mlctx.fillStyle = '#82c25c';
  mlctx.beginPath(); mlctx.arc((col + 0.5) * CELL, (row + 0.5) * CELL, CELL * 0.85, 0, 7); mlctx.fill();
}

// ---- Lines of clippings ("windrows") ----
//  The mower sucks up any clippings under the deck, chops them finer, and blows
//  them out of the side chute together with the grass it just cut. So a line of
//  clippings forms on the right-hand side; mow over it again and it disappears,
//  leaving a thinner, finer line beside you.
const CLIPPINGS = {
  fresh: 26,     // how much one freshly cut cell adds to the line
  reCut: 0.4,    // how much of the clippings you mow over come back out (finer, so less)
  width: 3.5,    // half-width of the line, in mask pixels (1 pixel = 2 units)
  side: 7        // how far out to the side of the deck the line lands, in units
};
function windrow(x, y, rot, fresh) {
  const cs = Math.cos(rot), sn = Math.sin(rot);
  // 1. pick up whatever is lying under the deck
  const r = MOWER.deckRadius / 2, cx = x / 2, cy = y / 2;
  let picked = 0;
  for (let ty = Math.max(0, Math.floor(cy - r)); ty <= Math.min(MH - 1, Math.ceil(cy + r)); ty++) {
    for (let tx = Math.max(0, Math.floor(cx - r)); tx <= Math.min(MW - 1, Math.ceil(cx + r)); tx++) {
      const cov = clamp(r - Math.hypot(tx + 0.5 - cx, ty + 0.5 - cy) + 0.5, 0, 1);
      if (cov <= 0) continue;
      const i = ((MH - 1 - ty) * MW + tx) * 4 + 3, take = maskData[i] * cov;
      picked += take; maskData[i] -= take;
    }
  }
  // 2. blow fresh + re-cut clippings out of the chute on the right
  const W = CLIPPINGS.width, area = Math.PI * W * W;
  const amount = fresh * CLIPPINGS.fresh + picked * CLIPPINGS.reCut / area;
  if (amount < 0.5) return;
  const along = (Math.random() - 0.5) * 3, out = MOWER.deckRadius + CLIPPINGS.side + (Math.random() - 0.5) * 3;
  const px = (x + cs * along - sn * out) / 2, py = (y + sn * along + cs * out) / 2;
  for (let ty = Math.max(0, Math.floor(py - W)); ty <= Math.min(MH - 1, Math.ceil(py + W)); ty++) {
    for (let tx = Math.max(0, Math.floor(px - W)); tx <= Math.min(MW - 1, Math.ceil(px + W)); tx++) {
      const d = Math.hypot(tx + 0.5 - px, ty + 0.5 - py) / W;
      if (d >= 1) continue;
      const i = ((MH - 1 - ty) * MW + tx) * 4 + 3;
      maskData[i] = Math.min(230, maskData[i] + amount * (1 - d * d));
    }
  }
  maskTex.needsUpdate = true;
}

// Clean stripes, combos and overlap (same rules as the 2D version)
function trackStyle(drive, moved, fresh) {
  const m = G.mower;
  const onLawn = G.cells[Math.floor(m.y / CELL) * COLS + Math.floor(m.x / CELL)] !== 0;
  const driving = drive > 0 && moved > 0.5;
  if (fresh > 0) {
    G.sinceFresh = 0; G.overlapRun = 0; G.overlapWarned = false;
  } else if (driving && onLawn) {
    G.sinceFresh += moved;
    if (G.sinceFresh > 12) {
      G.wasted += moved; G.overlapRun += moved;
      if (G.overlapRun >= OVERLAP_LIMIT && !G.overlapWarned) {
        G.overlapWarned = true;
        pop(m.x, m.y, G.combo > 1 ? 'Combo lost!' : 'Overlap!', '#ffab7a');
        SFX.thud();
        if (G.combo > 1) { flash('red'); buzz(60); }
        G.combo = 1;
      }
    }
  }
  const r = G.run;
  const straight = r && Math.abs(wrapAngle(m.rot - r.heading)) < 0.18;
  if (r && (!driving || !straight)) endStripe();
  if (driving) {
    if (!G.run) G.run = { heading: m.rot, len: 0, cells: 0 };
    G.run.len += moved;
  }
  if (G.run) G.run.cells += fresh;
}

function endStripe() {
  const r = G.run;
  G.run = null;
  if (!r || r.len < STRIPE_MIN) return;
  const fullWidth = r.len * 2 * MOWER.deckRadius / (CELL * CELL);
  if (r.cells / fullWidth < STRIPE_FRESH) return;
  const pts = Math.round(r.len / 10) * G.combo;
  G.style += pts;
  G.cleanStripes++;
  pop(G.mower.x, G.mower.y, `Clean stripe! +${pts}` + (G.combo > 1 ? `  ×${G.combo}` : ''), '#fff3a0', 19 + G.combo * 2);
  SFX.ding(G.combo);
  ringBurst(G.mower.x, G.mower.y, G.combo >= 3 ? 0xffb43a : 0xffd84a);
  buzz(20);
  if (G.combo >= 3) flash('gold');
  G.combo = Math.min(MAX_COMBO, G.combo + 1);
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  const c = $('combo'); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
}

// a quick colored glow around the edge of the screen
function flash(kind) {
  const f = $('flash');
  f.className = kind + ' on';
  requestAnimationFrame(() => requestAnimationFrame(() => { f.className = kind; }));
}

// =====================================================================
//  CAMERA
// =====================================================================
function updateCamera(dt, snap) {
  const m = G.mower;
  let pos, look;
  if (G.finished || G.inHub) {
    // at the end (and on the clipboard), rise up for a view of the whole lawn
    const k = Math.max(YARD_W / 640, YARD_H / 448);
    pos = new THREE.Vector3(YARD_W / 2, 640 * k, YARD_H / 2 + 536 * k);
    look = new THREE.Vector3(YARD_W / 2, 0, YARD_H / 2 - 9 * k);
  } else {
    const cfg = CAMERA[camMode];
    const targetYaw = camMode === 'turning' ? m.rot : -Math.PI / 2;
    camYaw = snap ? targetYaw : camYaw + wrapAngle(targetYaw - camYaw) * (1 - Math.exp(-dt * cfg.lag));
    const fx = Math.cos(camYaw), fz = Math.sin(camYaw), rx = -fz, rz = fx;
    const z = G.trimming ? 0.8 : currentMower().cam;   // bigger machines: the camera sits a bit further back
    pos = new THREE.Vector3(m.x - fx * cfg.dist * z + rx * cfg.side, cfg.height * z, m.y - fz * cfg.dist * z + rz * cfg.side);
    look = new THREE.Vector3(m.x + fx * cfg.ahead * z, 0, m.y + fz * cfg.ahead * z);
  }
  if (window.__camOverride) { pos = window.__camOverride.pos; look = window.__camOverride.look; }   // (for testing: a fixed camera)
  const k = snap ? 1 : 1 - Math.exp(-dt * (G.finished || G.inHub ? 1.8 : 7));
  camPos.lerp(pos, k);
  camLook.lerp(look, k);
  camera.position.copy(camPos);
  // a shake when you bump into something
  G.shake = (G.shake || 0) * Math.exp(-dt * 7);
  if (G.shake > 0.01) camera.position.add(tmpV.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(G.shake * 7));
  camera.lookAt(camLook);
  // the view widens a touch when you go full speed, which makes it feel faster
  const fov = CAMERA.fov + (G.finished || G.inHub ? 0 : 4 * Math.max(0, G.throttle || 0));
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

// Make the house or a tree see-through when it's between the camera and you
const fadeRay = new THREE.Ray(), tmpV = new THREE.Vector3();
function updateFading(dt) {
  const m = G.mower;
  const target = new THREE.Vector3(m.x, 35, m.y);
  fadeRay.origin.copy(camera.position);
  fadeRay.direction.copy(target).sub(camera.position).normalize();
  const dist = camera.position.distanceTo(target);
  for (const f of fadeables) {
    const hit = !G.finished && fadeRay.intersectBox(f.box, tmpV) && tmpV.distanceTo(camera.position) < dist - 10;
    const want = hit ? 0.12 : 1;
    f.cur = f.cur === undefined ? 1 : f.cur + (want - f.cur) * (1 - Math.exp(-dt * 8));
    const see = f.cur < 0.98;
    for (const mt of f.mats) {
      if (mt.transparent !== see) { mt.transparent = see; mt.needsUpdate = true; }
      mt.opacity = see ? f.cur : 1;
      mt.depthWrite = !see;
    }
  }
}

  $('medalIcon').className = 'medal ' + next;

  const r = G.run, sf = $('stripeFill');

  } else { sf.style.width = '0%'; sf.className = ''; }

}

function finish(reason) {

  $('pullBtn').classList.add('hidden');

  const trimFrac = G.trimTotal ? G.trimCount / G.trimTotal : 0;
  let medal = 'none';
  if (done) medal = t <= medalT.gold ? 'gold' : t <= medalT.silver ? 'silver' : t <= medalT.bronze ? 'bronze' : 'none';
  const comment =
    reason === 'gas' && !done ? '"Out of gas? Oh dear… you missed a bit."' :
    !done              ? '"You missed some spots."' :
    medal === 'gold'   ? '"Perfect lines! Like a golf course."' :
    medal === 'silver' ? '"Looks lovely, thank you!"' :
    medal === 'bronze' ? '"Took you a while, but it looks fine."' :
                         '"Finally! I nearly called someone else."';
  // the money: the customer's price × how long the grass was, half price if you left a mess, + medal bonus + tips
  let pay = YARD.pay * RUN.payFactor * cut;
  const payRate = cut >= BIZ.fullPayCut ? 1 : cut >= BIZ.okPayCut ? 0.85 : 0.5;
  pay *= payRate;
  const firstTip = RUN.paid && !(career.firstDone || {})[YARD.id] ? BIZ.firstJobTip : 0;
  const trimTip = G.trimTotal ? YARD.pay * BIZ.trimTip * trimFrac : 0;
  const bonus = (done ? BIZ.medalBonus[medal] : 0) + firstTip + trimTip;
  const tips = G.style / TIP_RATE;
  const total = pay + bonus + tips;
  setTimeout(() => SFX.medal(medal), 250);

  // white route line over the lawn
  const pts = G.trail.map(p => new THREE.Vector3(p.x, 1.5, p.y));
  routeLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff }));
  scene.add(routeLine);

  const prev = G.best;
  const ghostLine = prev && prev.time && done && (prev.cut || 0) >= 0.95
    ? `Ghost time: ${prev.time.toFixed(1)}s (you were ${Math.abs(t - prev.time).toFixed(1)}s ${t <= prev.time ? 'faster' : 'slower'})` : '';
  let best = prev;
  const bestDone = best && (best.cut || 0) >= 0.95;
  const isBest = !best || !best.ghost || (done !== bestDone ? done : done ? t < best.time : cut > best.cut);
  if (isBest) {
    recordSample();
    best = { cut, time: t, medal, ghost: G.rec };
    try { localStorage.setItem(bestKey(), JSON.stringify(best)); } catch (e) {}
  }

  // ---- paid job: update the business ----
  let bizLines = [], news = '';
  if (RUN.paid) {
    const mw = currentMower();
    career.money += total;
    career.earned += total;
    career.lastMowed[YARD.id] = career.day;
    career.slot++;
    career.jobsDone++;
    if (RUN.lesson) career.gasCan = Math.max(0, career.gasCan - (fuelMax - G.fuel) * mw.burn);
    else career.tank = Math.max(0, G.fuel * mw.burn);
    career.wearOf[mw.id] = Math.min(90, getWear() + mw.wear);
    const stars = (cut >= BIZ.starCut ? 1 : 0) + (medal !== 'none' ? 1 : 0);
    career.rep += stars;
    (career.firstDone = career.firstDone || {})[YARD.id] = true;
    if (stars) bizLines.push(`<span style="color:#ffe9a3">+${stars} ★ reputation</span> (you have ${career.rep} ★)`);
    else bizLines.push(`<span style="color:#ffab7a">No ★ — cut at least ${Math.round(BIZ.starCut * 100)}% to earn reputation</span>`);
    if (RUN.lesson) bizLines.push(recordLesson(RUN.lesson, cut, t));
    news = checkUnlocks().map(y => `<div class="note" style="text-align:left">📞 <b>New customer: ${y.name}!</b> ${y.story}</div>`).join('');
    saveCareer();
  }

  const pct = (v) => (v * 100).toFixed(1) + '%';
  const money = (v) => '$' + v.toFixed(2);
  const lines = [
    `Time: ${t.toFixed(1)}s &nbsp;·&nbsp; Cut: ${pct(cut)} &nbsp;·&nbsp; Skipped: ${pct(1 - cut)}`,
    `Clean stripes: ${G.cleanStripes} &nbsp;·&nbsp; Best combo: ×${G.bestCombo}`,
    G.trimTotal ? `🌿 Edges trimmed: ${Math.round(trimFrac * 100)}%${trimFrac < 1 ? ` (all of them earns a ${money(YARD.pay * BIZ.trimTip)} tip)` : ' — perfect edges!'}` : '',
    `Overlap: ${Math.round(G.wasted / Math.max(1, G.distance) * 100)}% of your driving was over cut grass`,
    RUN.paid
      ? `Paid ${money(pay)}${RUN.payFactor < 1 ? ` (grass was overgrown: ${Math.round(RUN.payFactor * 100)}%)` : ''}`
        + (payRate < 1 ? ` (${Math.round(payRate * 100)}% — you missed spots)` : '')
        + (bonus - firstTip - trimTip ? ` + medal bonus ${money(bonus - firstTip - trimTip)}` : '')
        + (firstTip ? ` + first-job tip ${money(firstTip)}` : '')
        + (trimTip ? ` + 🌿 trim tip ${money(trimTip)}` : '')
        + ` + tips ${money(tips)} = <b id="payTotal" style="color:#9be37a">$0.00</b>`
      : `Practice — a paid job would have earned ${money(total)}`,
    ...bizLines,
    ghostLine, comment,
    isBest ? '★ New personal best!' : (bestDone ? `Your best: ${best.time.toFixed(1)}s` : '')
  ].filter(Boolean);
  const title = reason === 'gas' && medal === 'none' ? 'Out of gas!' :
                medal === 'none' ? (done ? 'Too slow for a medal' : 'Not finished') : `${MEDAL_NAME[medal]} medal!`;
  const el = $('results');
  el.innerHTML = `
    <div class="head"><span class="medal big ${medal}"></span><h1 class="${medal}">${title}</h1></div>
    <p>${lines.join('<br>')}</p>${news}
    <div class="btns">${RUN.paid
      ? `<button id="hubBtn2">📋 Back to the clipboard</button>`
      : `<button id="againBtn">Mow again</button><button id="hubBtn2" class="quiet">📋 Clipboard</button>`}
      <button id="routeBtn" class="quiet">See route</button></div>`;
  el.classList.remove('hidden');
  if (!RUN.paid) clickBtn('againBtn', newRun);
  clickBtn('hubBtn2', showHub);
  clickBtn('routeBtn', () => el.classList.add('hidden'));
  $('finishBtn').textContent = 'Results';
  updateHud();
  // count the money up, with a "ka-ching"
  if (RUN.paid) {
    const pt = $('payTotal'), t0 = performance.now(), dur = 900;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      pt.textContent = money(total * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step); else SFX.cash();
    };
    setTimeout(() => requestAnimationFrame(step), 500);
  }
}

// =====================================================================
//  THE BUSINESS: money, days, gas, wear and tear, customers
//  Everything is saved in the browser (localStorage), so you can come back tomorrow.
// =====================================================================
function newCareer() {
  return {
    v: 2, day: 1, slot: 0, weather: 'sun', money: BIZ.startMoney, earned: 0, rep: 0, jobsDone: 0,
    gasCan: BIZ.startGas, tank: MOWERS[0].tank,          // liters of gas in the can and in the mower
    owned: ['walk30'], mower: 'walk30', wearOf: { walk30: 15 },
    unlocked: ['peterson'], lastMowed: { peterson: -3 },
    seen: {}, notes: [], helpers: {}
  };
}
// new neighbors call once you have enough ★ — returns the ones who just called
function checkUnlocks() {
  const fresh = [];
  for (const y of YARDS) {
    if (career.unlocked.includes(y.id) || career.rep < y.stars) continue;
    career.unlocked.push(y.id);
    career.lastMowed[y.id] = career.day - BIZ.readyDays - 1;   // their grass is ready right away
    fresh.push(y);
  }
  return fresh;
}
function loadCareer() {
  try {
    const c = JSON.parse(localStorage.getItem(CAREER_KEY));
    if (c && c.v === 1) {
      // old save (before the new mower lineup): refund the old mowers you bought, and start you on Dad's 30"
      const refund = { used21: 120, new22: 300, wide30: 700 };
      for (const id of c.owned || []) c.money += refund[id] || 0;
      c.owned = ['walk30']; c.mower = 'walk30';
      c.wearOf = { walk30: Math.min(40, (c.wearOf || {})[c.mower] || 15) };
      c.tank = Math.min(c.tank || 0, MOWERS[0].tank);
      c.v = 2;
      (c.notes = c.notes || []).push('🚜 <b>New mowers in the shop!</b> Dad found his old 30" mower for you, and the mowers you had bought were sold back for what you paid.');
    }
    if (c && c.v === 2) return c;
  } catch (e) {}
  return null;
}
let career = loadCareer() || newCareer();
career.helpers = career.helpers || {};
for (const [hid, h] of Object.entries(career.helpers)) {
  const max = helperLicence(hid).deck;
  for (const [yid, L] of Object.entries(h.lessons || {})) {
    if (mowerById(L.mower || 'walk30').deck > max) {
      delete h.lessons[yid];
      (career.notes = career.notes || []).push(`🧑‍🏫 New rule: helpers start on Dad's 30" mower and move up with experience. ${HELPERS.find(v => v.id === hid).name}'s lessons on ${YARDS.find(y => y.id === yid).name}'s yard were on a bigger mower, so you'll need to teach that yard again.`);
    }
  }
}
function saveCareer() { try { localStorage.setItem(CAREER_KEY, JSON.stringify(career)); } catch (e) {} }
// the mower being driven right now: yours, or the helper's (during a lesson, or when watching their run)
function currentMower() { return mowerById(RUN.mowerOverride || career.mower); }

// ---- helpers ----
const hired = () => HELPERS.filter(h => career.helpers && career.helpers[h.id]);
// which mower each helper uses: the best mower you own that you're not using (each helper gets a different one);
// if there's none to spare, Tommy brings his family's old push mower
// how experienced a helper is: all the jobs they've done on their own
function helperJobs(hid) { return Object.values(career.helpers[hid].jobs || {}).reduce((a, b) => a + b, 0); }
// the widest mower (in inches) a helper is allowed to use, and how many more jobs until the next one
function helperLicence(hid) {
  const n = helperJobs(hid);
  let deck = HELP.licence[0][1], next = null;
  for (const [jobs, d] of HELP.licence) { if (n >= jobs) deck = d; else if (!next) next = { jobs: jobs - n, deck: d }; }
  return { deck, next };
}
// which mower each helper uses: the best spare mower you own that they're allowed to drive
// (each helper gets a different one). Helpers without their own mower choose first;
// Tommy can always fall back on his family's old push mower.
function helperMower(hid) {
  const spare = career.owned.filter(id => id !== career.mower).map(mowerById).sort((a, b) => b.deck - a.deck);
  const order = hired().slice().sort((a, b) => (a.id === 'tommy') - (b.id === 'tommy'));
  const taken = new Set();
  for (const h of order) {
    const max = helperLicence(h.id).deck;
    const m = spare.find(v => v.deck <= max && !taken.has(v.id));
    if (m) taken.add(m.id);
    if (h.id === hid) return m ? m.id : (hid === 'tommy' ? 'push21' : null);
  }
  return null;
}
function lessonsFor(hid, yid) { const L = career.helpers[hid].lessons[yid]; return L ? L.n : 0; }
const trained = (hid, yid) => lessonsFor(hid, yid) >= HELP.lessonsNeeded;
const canSize = () => Math.max(BIZ.canSize, Math.round(currentMower().tank * 2.5));
function getWear() { return career.wearOf[career.mower] || 0; }
const grassDays = (y) => career.day - career.lastMowed[y.id];
const payFactor = (days) => days <= BIZ.overdueDays ? 1 : Math.max(BIZ.minPayFactor, 1 - (days - BIZ.overdueDays) * BIZ.overduePenalty);
const jobPay = (y) => y.pay * payFactor(grassDays(y));
// before a paid job you fill the mower's tank from your gas can
function topUpTank() {
  const mw = currentMower();
  career.tank = Math.min(career.tank, mw.tank);
  const take = Math.min(mw.tank - career.tank, career.gasCan);
  if (take > 0) { career.tank += take; career.gasCan -= take; }
}

// lesson = the helper's id when you're teaching them this yard (you mow with THEIR mower while they watch)
function startJob(id, paid, lesson = null) {
  const y = YARDS.find(v => v.id === id);
  if (YARD !== y || !yardGroup.children.length) loadYard(id);
  career.lastYard = id;
  const days = grassDays(y);
  RUN = paid ? { paid: true, tall: days > BIZ.overdueDays, payFactor: payFactor(days) } : { paid: false, tall: false, payFactor: 1 };
  if (lesson) { RUN.lesson = lesson; RUN.mowerOverride = helperMower(lesson); }
  setWeather(paid ? 'sun' : career.weather);
  saveCareer();
  newRun();
}

// a lesson: the helper remembers your route for this yard (only the mowing parts, not the trimming)
function recordLesson(hid, cut, t) {
  const h = career.helpers[hid], name = HELPERS.find(v => v.id === hid).name, need = HELP.lessonsNeeded;
  if (cut < HELP.lessonCut) return `🧑‍🏫 ${name} got confused by all the missed spots — a lesson only counts if you cut at least ${Math.round(HELP.lessonCut * 100)}%.`;
  const L = h.lessons[YARD.id] || { n: 0, cut: 0, time: 1e9 };
  L.n++;
  const route = [];
  for (let i = 0; i < G.rec.length; i += 3) if (!G.rec[i][5]) route.push([G.rec[i][1], G.rec[i][2]]);
  // keep the best lesson: the one that cut the most (or was quickest)
  if (cut > L.cut + 0.005 || (cut >= L.cut - 0.005 && t < L.time)) Object.assign(L, { route, cut, time: t, mower: currentMower().id });
  h.lessons[YARD.id] = L;
  return L.n >= need ? `🧑‍🏫 ${name} watched closely. <b>${name} can mow ${YARD.name}'s yard alone now!</b> Send them from the clipboard.`
                     : `🧑‍🏫 Lesson ${L.n} of ${need}: ${name} is learning ${YARD.name}'s yard.`;
}

// =====================================================================
//  A HELPER MOWS A YARD ON THEIR OWN
//  They follow your best lesson route for that yard, with human mistakes: a wobbly line,
//  now and then a whole strip a bit off (leaving a gap), a bump, a stall. The more jobs they
//  do on a yard (and the more lessons you give), the fewer mistakes.
// =====================================================================
let lastHelperRun = null;
function helperError(hid, yid) {
  const h = career.helpers[hid], extra = Math.max(0, lessonsFor(hid, yid) - HELP.lessonsNeeded), jobs = h.jobs[yid] || 0;
  return clamp(0.32 - 0.05 * extra - 0.045 * jobs, 0.06, 0.32);
}
function runHelperJob(hid, yid) {
  const hd = HELPERS.find(v => v.id === hid), h = career.helpers[hid], L = h.lessons[yid], y = YARDS.find(v => v.id === yid);
  if (YARD.id !== yid || !yardGroup.children.length) loadYard(yid);        // (shows that yard behind the clipboard)
  const mw = mowerById(helperMower(hid)), R = mw.deck * 0.8, err = helperError(hid, yid);
  const save = { deckRadius: MOWER.deckRadius, bodyRadius: MOWER.bodyRadius };
  Object.assign(MOWER, { deckRadius: R, bodyRadius: mw.body });
  G.cells.set(cellsTemplate); dropUnreachable();
  const total = grassTotal;
  // 1. their path: your lesson route, with mistakes
  const src = L.route, path = [];
  let shift = 0, skips = 0, bumps = 0, stripeA = null, wob = Math.random() * 10;
  for (let i = 0; i < src.length - 1; i++) {
    const [x0, y0] = src[i], [x1, y1] = src[i + 1], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < 0.5) continue;
    const a = Math.atan2(dy, dx);
    if (stripeA === null) stripeA = a;
    if (Math.abs(wrapAngle(a - stripeA)) > 1.2) {            // turned around: a new stripe
      stripeA = a;
      shift = Math.random() < err * 0.45 ? (Math.random() < 0.5 ? -1 : 1) * R * (0.5 + Math.random() * 0.4) : 0;
      if (shift) skips++;
      if (Math.random() < err * 0.25) bumps++;
    }
    const nx = -Math.sin(a), ny = Math.cos(a);
    for (let k = 0; k < len; k += 3) {
      wob += 0.05;
      const off = shift + err * 14 * Math.sin(wob * 1.7) + err * 6 * Math.sin(wob * 4.3);
      let px = x0 + dx * k / len + nx * off, py = y0 + dy * k / len + ny * off;
      if (collides(px, py)) { px = x0 + dx * k / len; py = y0 + dy * k / len; }
      path.push([px, py]);
    }
  }
  // 2. how long it takes, gas and breakdowns
  const lessonM = mowerById(L.mower || mw.id);
  let time = L.time * (lessonM.speed / mw.speed) * (1 + err * 0.6);
  const wear = career.wearOf[mw.id] || 0, stalled = Math.random() < wear / 100;
  if (stalled) time += 25;
  const need = time * mw.burn * 0.75, have = career.gasCan;
  let ranOut = false;
  if (have < need) { ranOut = true; path.length = Math.floor(path.length * have / need); }
  career.gasCan = Math.max(0, have - need);
  // 3. cut the grass along the path
  let n = 0;
  const rc = Math.ceil(R / CELL) + 1;
  for (const [px, py] of path) {
    const c0 = Math.floor(px / CELL), r0 = Math.floor(py / CELL);
    for (let r = Math.max(0, r0 - rc); r <= Math.min(ROWS - 1, r0 + rc); r++)
      for (let c = Math.max(0, c0 - rc); c <= Math.min(COLS - 1, c0 + rc); c++) {
        const i = r * COLS + c;
        if (G.cells[i] !== 1) continue;
        const cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
        if ((cx - px) ** 2 + (cy - py) ** 2 <= R * R) { G.cells[i] = 2; n++; }
      }
  }
  Object.assign(MOWER, save);
  const cut = total ? n / total : 0;
  // 4. money, reputation, experience
  const days = grassDays(y), tier = cut >= BIZ.fullPayCut ? 1 : cut >= BIZ.okPayCut ? 0.85 : 0.5;
  const pay = y.pay * payFactor(days) * cut * tier, tip = cut >= 0.95 ? 2 : 0;
  const share = h.plan === 'share' ? (pay + tip) * HELP.share : 0;
  career.money += pay + tip - share;
  h.earned += pay + tip; h.cost += share;
  const before = helperLicence(hid).deck;
  h.jobs[yid] = (h.jobs[yid] || 0) + 1; h.today = (h.today || 0) + 1;
  const promoted = helperLicence(hid).deck > before ? helperLicence(hid).deck : 0;
  career.lastMowed[yid] = career.day;
  career.wearOf[mw.id] = Math.min(90, wear + mw.wear);
  const repChange = cut >= 0.95 ? 1 : cut < 0.85 ? -1 : 0;
  career.rep = Math.max(0, career.rep + repChange);
  saveCareer();
  // 5. the report
  const notes = [];
  if (err > 0.12) notes.push(`a few wobbly lines (still learning this yard)`);
  if (skips) notes.push(`${skips} strip${skips > 1 ? 's' : ''} a bit off, leaving gaps`);
  if (bumps) notes.push(`bumped into things ${bumps} time${bumps > 1 ? 's' : ''}`);
  if (stalled) notes.push(`the mower stalled — it took a while to restart it (tune-up?)`);
  if (ranOut) notes.push(`<span class="warn">ran out of gas before finishing — fill up your gas can!</span>`);
  if (lessonM.deck > mw.deck + 1) notes.push(`you taught with a wider mower than ${hd.name} has, so the stripes didn't quite meet`);
  if (promoted) notes.push(`<span class="good">🎉 ${hd.name} has enough experience to use mowers up to ${promoted}" now!</span>`);
  lastHelperRun = { hid, yid, path: path.map(([x, y]) => [Math.round(x), Math.round(y)]), mower: mw.id,
    report: { hd, y, cut, pay, tip, share, plan: h.plan, notes, repChange, err, jobs: h.jobs[yid], mower: mw } };
  showHelperReport(lastHelperRun.report);
}

function startWatch() {
  const w = lastHelperRun;
  if (!w) return;
  if (YARD.id !== w.yid) loadYard(w.yid);
  RUN = { paid: false, tall: false, payFactor: 1, watch: w, mowerOverride: w.mower };
  newRun();
  const m = G.mower; [m.x, m.y] = w.path[0] || [m.x, m.y];
  G.started = true; G.watchI = 0;
  hideIntro();
  pop(m.x, m.y, `Watching ${w.report.hd.name} (×${HELP.watchSpeed} speed) — tap Finish to skip`, '#ffe9a3', 18);
}
function watchUpdate(dt) {
  const w = RUN.watch, m = G.mower;
  let budget = MOWER.speed * HELP.watchSpeed * dt, moved = 0, cutNow = 0;
  while (budget > 0 && G.watchI < w.path.length - 1) {
    const [tx, ty] = w.path[G.watchI + 1], dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy);
    if (d > 0.5) m.rot += wrapAngle(Math.atan2(dy, dx) - m.rot) * 0.35;
    if (d <= budget) { m.x = tx; m.y = ty; budget -= d; moved += d; G.watchI++; }
    else { m.x += dx / d * budget; m.y += dy / d * budget; moved += budget; budget = 0; }
    cutNow += mowAt(m.x, m.y, m.rot);
  }
  if (cutNow) emitClips(m.x, m.y, m.rot, Math.min(6, cutNow), 1);
  G.elapsed += dt * HELP.watchSpeed;
  placeModel(mowerMesh, m.x, m.y, m.rot);
  const ud = mowerMesh.userData;
  G.walk += moved;
  if (ud.type === 'walk') { const sw = Math.sin(G.walk * 0.12) * 0.45; ud.legs[0].rotation.z = sw; ud.legs[1].rotation.z = -sw; }
  SFX.engine(true, 1, cutNow);
  updateHud();
  if (G.watchI >= w.path.length - 1) endWatch();
}
function endWatch() {
  if (!RUN.watch) return;
  G.finished = true;
  SFX.engine(false);
  const r = RUN.watch.report;
  setTimeout(() => showHelperReport(r), 500);
}

// ---- pictures of the mowers for the clipboard ----
//  Each mower is built in a little scene of its own, photographed once, and the photo is kept.
let mowerPics = null;
function makeMowerPics() {
  if (mowerPics) return mowerPics;
  mowerPics = {};
  try {
    const W = 240, H = 150, r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setSize(W, H, false);
    r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
    const sc = new THREE.Scene();
    sc.environment = scene.environment;
    sc.add(new THREE.HemisphereLight(0xffffff, 0x557744, 1.2));
    const key = new THREE.DirectionalLight(0xfff1d6, 2.2); key.position.set(150, 250, 200); sc.add(key);
    const cam = new THREE.PerspectiveCamera(30, W / H, 1, 3000);
    for (const mw of MOWERS) {
      const model = buildMower(false, mw.type, sc);
      styleMower(mw, model);
      model.rotation.y = 0.55;                                    // a three-quarter view from the front
      const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
      cam.position.copy(c).add(new THREE.Vector3(0.95, 0.62, 1.0).normalize().multiplyScalar(size * 0.95));
      cam.lookAt(c);
      r.render(sc, cam);
      mowerPics[mw.id] = r.domElement.toDataURL('image/png');
      disposeModel(model);
    }
    r.dispose(); r.forceContextLoss();
  } catch (e) { console.warn('mower pictures failed', e); }
  return mowerPics;
}
const mowerPic = (id) => { const u = makeMowerPics()[id]; return u ? `<img class="pic" src="${u}" alt="">` : ''; };

  // secret: tap the title 5 times to show or hide the practice tools
  $('hubTitle').addEventListener('click', () => {
    const now = performance.now();
    titleTaps = now - lastTitleTap < 1200 ? titleTaps + 1 : 1;
    lastTitleTap = now;
    if (titleTaps >= 5) { titleTaps = 0; toggleCheats(); }
  });
  on('[data-cheat]', b => {
    const k = b.dataset.cheat;
    if (k === 'money100') c.money += 100;
    if (k === 'money1000') c.money += 1000;
    if (k === 'stars') c.rep += 3;
    if (k === 'unlock') c.rep = Math.max(c.rep, ...YARDS.map(y => y.stars));
    if (k === 'ready') for (const id of c.unlocked) c.lastMowed[id] = c.day - BIZ.readyDays;
    if (k === 'gas') { c.gasCan = canSize(); c.tank = currentMower().tank; }
    if (k === 'worn') c.wearOf[c.mower] = 90;
    if (k === 'jobs') c.slot = 0;
    if (k === 'sun' || k === 'rain') c.weather = k;
    if (k === 'dog' || k === 'cat') c.nextPet = k;
    SFX.cash();
    showHub();
  });
  on('[data-reset]', b => {
    if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to erase everything'; return; }
    career = newCareer(); saveCareer(); showHub();
  });
}

// ---- go! ----
updateCamButton();
loadYard(career.lastYard || 'peterson');
placeModel(mowerMesh, YARD.start.x, YARD.start.y, YARD.start.angle);
G.mower = { x: YARD.start.x, y: YARD.start.y, rot: YARD.start.angle };
paintMiniUncut();
showHub();
updateCamera(0, true);
requestAnimationFrame(frame);
window.__game = { G, keys, CAMERA, tilt, readTilt, ctrl, touch, setMode, finish, newRun, mowAt, update, updateCamera,
  get camMode() { return camMode; }, toggleCamera, get career() { return career; }, startJob, showHub, nextDay, loadYard, pullCord, MOWERS, YARDS, guide, toggleTool, birds, get pet() { return pet; }, scareBirds, spawnPet, updatePet, updateBirds,
  scene, THREE,
  maskA: (tx, ty) => maskData[((MH - 1 - ty) * MW + tx) * 4 + 3], get tmpl() { return cellsTemplate; } };   // for testing
</script>
</body>
