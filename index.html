<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lawn Mower Game — Yard 1</title>
<style>
  html, body { margin: 0; height: 100%; background: #14200f; touch-action: none; }
  #game { width: 100%; height: 100%; }
</style>
<!-- A friendly rounded font from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<!-- Phaser is the game engine. This line loads it from the internet. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// =====================================================================
//  SETTINGS — try changing these numbers and reloading the page!
// =====================================================================
const CELL = 8;                       // size of one "grass cell" (used for scoring, not drawing)
const YARD_W = 640, YARD_H = 448;     // size of the yard
const HUD_H = 44;                     // height of the info bar at the top
const COLS = YARD_W / CELL, ROWS = YARD_H / CELL;

const MOWER = {
  speed: 120,         // forward speed (pixels per second)
  reverseSpeed: 60,   // backing up is slower
  turnSpeed: 3.0,     // how fast it turns (radians per second)
  deckRadius: 16,     // how wide the blade cuts (half the cutting width)
  bodyRadius: 10      // size used for bumping into things
};

const PAY_FULL = 20;  // dollars for a perfectly cut lawn

const FONT = 'Fredoka, "Trebuchet MS", sans-serif';

// SHARPNESS: the game is drawn this many times bigger than the yard's
// "logical" size, so it stays crisp on big or high-resolution screens.
// (1 = old blurry look, 3 = sharpest.)
const SHARP = Math.max(1, Math.min(3, Math.ceil(
  Math.min(window.innerWidth / YARD_W, window.innerHeight / (YARD_H + HUD_H)) * (window.devicePixelRatio || 1)
)));

// The yard layout. Everything is in pixels: x, y = top-left corner.
const YARD = {
  name: 'Yard 1 — Mrs. Peterson',
  house:    { x: 30,  y: 20,  w: 220, h: 150 },
  driveway: { x: 95,  y: 170, w: 70,  h: 278 },
  beds:     [ { x: 460, y: 24, w: 150, h: 46 } ],
  trees:    [ { x: 420, y: 150, r: 26 }, { x: 545, y: 330, r: 22 }, { x: 300, y: 365, r: 18 } ],
  start:    { x: 130, y: 415, angle: -Math.PI / 2 }   // bottom of the driveway, facing up
};

const BEST_KEY = 'lmg_yard1_best';

// ---------- small helper functions ----------
const inRect = (x, y, r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;

function circleHitsRect(x, y, rad, r) {
  const nx = Phaser.Math.Clamp(x, r.x, r.x + r.w);
  const ny = Phaser.Math.Clamp(y, r.y, r.y + r.h);
  return (x - nx) ** 2 + (y - ny) ** 2 < rad * rad;
}

// =====================================================================
//  THE YARD SCENE — a "scene" is one screen of the game
// =====================================================================
class YardScene extends Phaser.Scene {
  constructor() { super('yard'); }

  create() {
    // Zoom the camera so our 640×492 world fills the bigger, sharper canvas
    this.cameras.main.setZoom(SHARP).centerOn(YARD_W / 2, (YARD_H + HUD_H) / 2);

    // A "seeded" random generator: same seed = same flowers & trees every time
    this.rnd = new Phaser.Math.RandomDataGenerator(['mrs-peterson']);
    this.makeTextures();

    // Everything in the yard lives in this container, shifted below the HUD.
    this.yard = this.add.container(0, HUD_H);

    // ---- 1. Grass ----
    // cells: 0 = not grass, 1 = uncut grass, 2 = cut grass  (this is for SCORING)
    this.cells = new Uint8Array(COLS * ROWS);
    this.grassTotal = 0;
    this.cutCount = 0;
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const cx = col * CELL + CELL / 2, cy = row * CELL + CELL / 2;
        if (this.obstacleHit(cx, cy, 0) || inRect(cx, cy, YARD.driveway)) continue;
        this.cells[row * COLS + col] = 1;
        this.grassTotal++;
      }
    }

    // What you SEE is a stack of layers, bottom to top:
    //   1. a freshly-mowed lawn, dark stripe version
    //   2. a freshly-mowed lawn, light stripe version — only shows where the "light mask" is painted
    //   3. a soft shadow cast by the long grass onto the short grass
    //   4. the long, uncut grass — the mower ERASES holes in it to reveal the layers below
    const S = SHARP, big = (o) => o.setOrigin(0, 0).setScale(1 / S);
    this.yard.add(big(this.add.image(0, 0, 'cutDarkTex')));
    const lightImg = big(this.add.image(0, 0, 'cutLightTex'));
    this.lightMask = big(this.make.renderTexture({ x: 0, y: HUD_H, width: YARD_W * S, height: YARD_H * S }, false));
    lightImg.setMask(this.lightMask.createBitmapMask());
    this.yard.add(lightImg);

    this.uncutRT = big(this.add.renderTexture(0, 0, YARD_W * S, YARD_H * S));
    this.uncutRT.drawFrame('grassUncut', undefined, 0, 0);
    if (this.textures.exists('uncutLive')) this.textures.remove('uncutLive');   // left over from last run
    this.uncutRT.saveTexture('uncutLive');   // give it a name so the shadow can reuse the same picture
    const shadow = big(this.add.image(2, 2.8, 'uncutLive')).setTintFill(0x0a1c06).setAlpha(0.55);
    this.yard.add([shadow, this.uncutRT]);

    // The "brush" the mower erases/paints with: a round deck shape with tufty edges
    this.brush = this.make.image({ key: 'brush' }, false);
    this.events.once('shutdown', () => { this.lightMask.destroy(); this.brush.destroy(); });

    // ---- 2. Scenery (driveway, flower beds, house, trees, fence) ----
    // We draw it once, then "bake" it into a single picture so the game
    // doesn't have to redraw hundreds of little shapes 60 times a second.
    const sceneryG = this.drawScenery().setScale(SHARP);
    const scenery = this.add.renderTexture(0, 0, YARD_W * SHARP, YARD_H * SHARP).setOrigin(0, 0).setScale(1 / SHARP);
    scenery.draw(sceneryG, 0, 0);
    sceneryG.destroy();
    this.yard.add(scenery);

    // ---- 3. The mower ----
    this.mower = this.makeMower(false).setPosition(YARD.start.x, YARD.start.y).setRotation(YARD.start.angle);
    this.yard.add(this.mower);

    // Line that shows your route at the end
    this.routeG = this.add.graphics();
    this.yard.add(this.routeG);

    // Grass clippings that spray out of the side of the mower
    this.clippings = this.add.particles(0, 0, 'clip', {
      speed: { min: 25, max: 80 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 250, max: 550 },
      scale: { start: 1 / SHARP, end: 0.3 / SHARP },
      alpha: { start: 1, end: 0 },
      rotate: { min: 0, max: 360 },
      tint: [0x9ad873, 0x7cc257, 0xb8e892, 0x5e9e3e],
      emitting: false
    });

    // ---- 4. State ----
    this.started = false;
    this.finished = false;
    this.elapsed = 0;
    this.distance = 0;
    this.trail = [{ x: YARD.start.x, y: YARD.start.y }];
    this.rec = [];        // recording of this run for the ghost: [time, x, y, rotation]
    this.recTimer = 0;

    // ---- Ghost: a see-through mower that replays your best run ----
    this.best = null;
    try { this.best = JSON.parse(localStorage.getItem(BEST_KEY)); } catch (e) {}
    this.ghostData = this.best && this.best.ghost && this.best.ghost.length > 1 ? this.best.ghost : null;
    this.ghostIndex = 0;
    this.ghost = null;
    this.ghostRT = null;
    if (this.ghostData) {
      // Ghost's cut path: a see-through blue layer painted where the ghost has mowed
      this.ghostRT = this.add.renderTexture(0, 0, YARD_W * SHARP, YARD_H * SHARP)
        .setOrigin(0, 0).setScale(1 / SHARP).setAlpha(0.33);
      this.yard.addAt(this.ghostRT, this.yard.getIndex(this.uncutRT) + 1);   // just above the grass
      this.ghost =this.makeMower(true).setPosition(YARD.start.x, YARD.start.y)
        .setRotation(YARD.start.angle).setAlpha(0.6);
      this.yard.addAt(this.ghost, this.yard.getIndex(this.mower)); // under your mower
    }

    // ---- 5. HUD (info bar at the top) ----
    this.makeHud();

    // ---- 6. Controls ----
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D,R,H,G,ENTER');
    this.keys.G.on('down', () => {
      if (!this.ghost) return;
      const show = !this.ghost.visible;
      this.ghost.setVisible(show);
      this.ghostRT.setVisible(show);
    });
    this.keys.R.on('down', () => this.scene.restart());
    this.keys.ENTER.on('down', () => { if (!this.finished) this.finish(); });
    this.keys.H.on('down', () => { if (this.finished) this.panel.setVisible(!this.panel.visible); });

    this.updateHud();
  }

  // Runs about 60 times per second
  update(time, delta) {
    if (this.finished) return;
    const dt = delta / 1000;
    const m = this.mower;

    // --- read input ---
    let turn = 0, drive = 0;
    const c = this.cursors, k = this.keys;
    if (c.left.isDown || k.A.isDown) turn -= 1;
    if (c.right.isDown || k.D.isDown) turn += 1;
    if (c.up.isDown || k.W.isDown) drive = 1;
    else if (c.down.isDown || k.S.isDown) drive = -1;

    // Touch / mouse: hold your finger on the yard and the mower drives toward it
    const p = this.input.activePointer;
    if (p.isDown) {
      const wp = this.cameras.main.getWorldPoint(p.x, p.y);   // screen → game coordinates
      const tx = wp.x, ty = wp.y - HUD_H;
      if (ty >= 0) {
        const dx = tx - m.x, dy = ty - m.y;
        if (Math.hypot(dx, dy) > 12) {
          const diff = Phaser.Math.Angle.Wrap(Math.atan2(dy, dx) - m.rotation);
          turn = Phaser.Math.Clamp(diff / (MOWER.turnSpeed * dt), -1, 1);
          if (Math.abs(diff) < 1.0) drive = 1;
        }
      }
    }

    if ((turn !== 0 || drive !== 0) && !this.started) this.started = true;
    if (this.started) this.elapsed += dt;

    // --- turn ---
    m.rotation += turn * MOWER.turnSpeed * dt;

    // --- move (and slide along walls instead of getting stuck) ---
    if (drive !== 0) {
      const sp = drive > 0 ? MOWER.speed : -MOWER.reverseSpeed;
      const x = m.x, y = m.y;
      let nx = x + Math.cos(m.rotation) * sp * dt;
      let ny = y + Math.sin(m.rotation) * sp * dt;
      if (this.collides(nx, ny)) {
        if (!this.collides(nx, y)) ny = y;
        else if (!this.collides(x, ny)) nx = x;
        else { nx = x; ny = y; }
      }
      this.distance += Math.hypot(nx - x, ny - y);
      m.setPosition(nx, ny);
    }

    // --- cut grass under the deck ---
    if (this.started) {
      const newlyCut = this.mowAt(m.x, m.y, m.rotation);
      if (newlyCut > 0) this.sprayClippings(newlyCut);
    }

    // --- remember the route ---
    const last = this.trail[this.trail.length - 1];
    if (Math.hypot(m.x - last.x, m.y - last.y) > 6) this.trail.push({ x: m.x, y: m.y });

    // --- record for the ghost (20 times per second) and move the ghost ---
    if (this.started) {
      this.recTimer -= dt;
      if (this.recTimer <= 0) { this.recTimer = 0.05; this.recordSample(); }
    }
    this.updateGhost();

    this.updateHud();
    if (this.cutCount >= this.grassTotal) this.finish();
  }

  // ---------- ghost ----------
  recordSample() {
    const m = this.mower;
    this.rec.push([+this.elapsed.toFixed(2), Math.round(m.x), Math.round(m.y), +m.rotation.toFixed(2)]);
  }

  updateGhost() {
    if (!this.ghost) return;
    const d = this.ghostData, t = this.elapsed;
    const lastS = d[d.length - 1];
    if (t >= lastS[0]) {              // the ghost has finished its run
      this.ghost.setPosition(lastS[1], lastS[2]).setRotation(lastS[3]).setAlpha(0.3);
      return;
    }
    // find the two recorded moments on either side of "now" and blend between them
    while (this.ghostIndex < d.length - 2 && d[this.ghostIndex + 1][0] <= t) this.ghostIndex++;
    const a = d[this.ghostIndex], b = d[this.ghostIndex + 1];
    const f = b[0] > a[0] ? Phaser.Math.Clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 0;
    this.ghost.setPosition(a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f);
    this.ghost.setRotation(a[3] + Phaser.Math.Angle.Wrap(b[3] - a[3]) * f);
    if (this.started) {
      this.brush.setTint(0x4aa8ff);
      this.ghostRT.draw(this.brush, this.ghost.x * SHARP, this.ghost.y * SHARP);
      this.brush.clearTint();
    }
  }

  // ---------- grass cutting ----------
  // Paints a round "cut" mark at (x, y) and updates the score cells.
  // Returns how many new cells were cut.
  mowAt(x, y, rot) {
    // Real lawns get light and dark stripes depending on which way you mow
    const cx = Math.cos(rot), sy = Math.sin(rot);
    const light = Math.abs(cx) >= Math.abs(sy) ? cx > 0 : sy > 0;
    const bx = x * SHARP, by = y * SHARP;
    this.uncutRT.erase(this.brush, bx, by);                    // cut a hole in the long grass
    if (light) this.lightMask.draw(this.brush, bx, by);        // show the light stripe here…
    else this.lightMask.erase(this.brush, bx, by);             // …or let the dark stripe show

    let n = 0;
    const r = MOWER.deckRadius;
    const c0 = Math.max(0, Math.floor((x - r) / CELL)), c1 = Math.min(COLS - 1, Math.floor((x + r) / CELL));
    const r0 = Math.max(0, Math.floor((y - r) / CELL)), r1 = Math.min(ROWS - 1, Math.floor((y + r) / CELL));
    for (let row = r0; row <= r1; row++) {
      for (let col = c0; col <= c1; col++) {
        const i = row * COLS + col;
        if (this.cells[i] !== 1) continue;
        const ccx = col * CELL + CELL / 2, ccy = row * CELL + CELL / 2;
        if ((ccx - x) ** 2 + (ccy - y) ** 2 <= r * r) {
          this.cells[i] = 2;
          this.cutCount++;
          n++;
        }
      }
    }
    return n;
  }

  sprayClippings(amount) {
    // clippings shoot out of the chute on the mower's right side
    const m = this.mower, cs = Math.cos(m.rotation), sn = Math.sin(m.rotation);
    const lx = 4, ly = 13;
    const x = m.x + lx * cs - ly * sn, y = m.y + lx * sn + ly * cs + HUD_H;
    this.clippings.emitParticleAt(x, y, Math.min(3, amount));
  }

  // ---------- collisions ----------
  obstacleHit(x, y, rad) {
    const rectHit = (r) => rad === 0 ? inRect(x, y, r) : circleHitsRect(x, y, rad, r);
    if (rectHit(YARD.house)) return true;
    for (const b of YARD.beds) if (rectHit(b)) return true;
    for (const t of YARD.trees) if (Math.hypot(x - t.x, y - t.y) < t.r + rad) return true;
    return false;
  }

  collides(x, y) {
    const R = MOWER.bodyRadius;
    if (x - R < 0 || x + R > YARD_W || y - R < 0 || y + R > YARD_H) return true;
    return this.obstacleHit(x, y, R);
  }

  // ---------- end of the job ----------
  finish() {
    if (this.finished) return;
    this.finished = true;

    const cut = this.cutCount / this.grassTotal;
    const ideal = this.cutCount * CELL * CELL / (2 * MOWER.deckRadius); // shortest possible route
    const eff = this.distance > 0 ? Math.min(1, ideal / this.distance) : 0;

    let stars = 0, comment;
    if (cut < 0.95) comment = '"You missed some spots, dear."';
    else if (eff >= 0.8) { stars = 3; comment = '"Perfect lines! Like a golf course."'; }
    else if (eff >= 0.65) { stars = 2; comment = '"Looks lovely, thank you!"'; }
    else { stars = 1; comment = '"Took you a while, but it looks fine."'; }

    let pay = PAY_FULL * cut;
    if (cut < 0.95) pay *= 0.5; // patchy lawn = half pay

    // Draw your route over the lawn (dark outline first, then white line)
    this.routeG.lineStyle(5, 0x000000, 0.25);
    this.routeG.strokePoints(this.trail, false);
    this.routeG.lineStyle(2.5, 0xffffff, 0.9);
    this.routeG.strokePoints(this.trail, false);
    this.routeG.fillStyle(0xffe066, 1).fillCircle(this.trail[0].x, this.trail[0].y, 5);

    // Compare with the ghost's time
    const prev = this.best;
    const ghostLine = prev && prev.time
      ? `Ghost time: ${prev.time.toFixed(1)}s (you were ${Math.abs(this.elapsed - prev.time).toFixed(1)}s ${this.elapsed <= prev.time ? 'faster' : 'slower'})`
      : '';

    // Save best score (and this run's ghost) in the browser
    let best = prev;
    const isBest = !best || !best.ghost || stars > best.stars || (stars === best.stars && eff > best.eff);
    if (isBest) {
      this.recordSample();
      best = { stars, eff, cut, time: this.elapsed, ghost: this.rec };
      try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {}
    }

    const pct = (v) => (v * 100).toFixed(1) + '%';
    const lines = [
      `Cut: ${pct(cut)}     Skipped: ${pct(1 - cut)}`,
      `Route efficiency: ${pct(eff)}`,
      `Time: ${this.elapsed.toFixed(1)}s     Distance: ${Math.round(this.distance)} px`,
      `Paid: $${pay.toFixed(2)}`,
      ghostLine,
      comment,
      isBest ? '★ New personal best!' : `Best: ${'★'.repeat(best.stars)} ${pct(best.eff)} efficiency`
    ].filter(Boolean);
    this.showPanel(stars, lines);
    this.finishBtn.setLabel('Results');
  }

  showPanel(stars, lines) {
    const cx = YARD_W / 2, cy = HUD_H + YARD_H / 2;
    const W = 400, H = 300;
    this.panel = this.add.container(cx, cy);
    const bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.35).fillRoundedRect(-W / 2 + 4, -H / 2 + 6, W, H, 18);   // shadow
    bg.fillStyle(0x1b2a16, 0.96).fillRoundedRect(-W / 2, -H / 2, W, H, 18);
    bg.fillStyle(0x24381d, 1).fillRoundedRect(-W / 2, -H / 2, W, 64, { tl: 18, tr: 18, bl: 0, br: 0 });
    bg.lineStyle(2, 0x8fd16a, 1).strokeRoundedRect(-W / 2, -H / 2, W, H, 18);
    // Three stars: gold if earned, dim grey if not
    const t = this.add.graphics();
    for (let s = 0; s < 3; s++) {
      const sx = (s - 1) * 52, sy = -H / 2 + 32, pts = [];
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? 9 : 21;
        pts.push({ x: sx + Math.cos(a) * rad, y: sy + Math.sin(a) * rad });
      }
      const earned = s < stars;
      t.fillStyle(earned ? 0xb8860b : 0x101a0c, 1).fillPoints(pts.map(p => ({ x: p.x, y: p.y + 2 })), true);
      t.fillStyle(earned ? 0xffd84a : 0x3a4a33, 1).fillPoints(pts, true);
    }
    const body = this.txt(0, -8, lines.join('\n'), {
      fontSize: '16px', color: '#e8f5e0', align: 'center', lineSpacing: 5
    }).setOrigin(0.5);
    const again = this.makeButton(-85, H / 2 - 32, 'Mow again', () => this.scene.restart());
    const route = this.makeButton(85, H / 2 - 32, 'See route', () => this.panel.setVisible(false));
    this.panel.add([bg, t, body, again, route]);
    this.panel.setScale(0.85).setAlpha(0);
    this.tweens.add({ targets: this.panel, scale: 1, alpha: 1, duration: 220, ease: 'Back.Out' });
  }

  // ---------- HUD ----------
  makeHud() {
    const g = this.add.graphics();
    g.fillStyle(0x16210f, 1).fillRect(0, 0, YARD_W, HUD_H);
    g.fillStyle(0x000000, 0.25).fillRect(0, HUD_H, YARD_W, 3);   // little shadow under the bar

    this.txt(14, HUD_H / 2, YARD.name, { fontSize: '15px', color: '#e8f5e0', fontStyle: '600' }).setOrigin(0, 0.5);

    this.bar = { x: 200, y: HUD_H / 2 - 9, w: 126, h: 18 };
    this.barG = this.add.graphics();
    this.barText = this.txt(this.bar.x + this.bar.w / 2, HUD_H / 2, '', {
      fontSize: '13px', color: '#ffffff', fontStyle: '600', stroke: '#0c140a', strokeThickness: 3
    }).setOrigin(0.5);
    this.skipText = this.txt(this.bar.x + this.bar.w + 10, HUD_H / 2, '', { fontSize: '14px', color: '#c9dcbf' }).setOrigin(0, 0.5);
    this.timeText = this.txt(440, HUD_H / 2, '', { fontSize: '15px', color: '#ffe9a3' }).setOrigin(0, 0.5);

    this.finishBtn = this.makeButton(YARD_W - 52, HUD_H / 2, 'Finish ✓', () => {
      if (this.finished) this.panel.setVisible(!this.panel.visible);
      else this.finish();
    }, 15);
  }

  updateHud() {
    const f = this.grassTotal ? this.cutCount / this.grassTotal : 0;
    const pct = Math.floor(f * 100);
    const b = this.bar;
    this.barG.clear();
    this.barG.fillStyle(0x0b1308, 1).fillRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    if (f > 0) this.barG.fillStyle(0x8fd16a, 1).fillRoundedRect(b.x, b.y, Math.max(b.h, b.w * f), b.h, b.h / 2);
    this.barText.setText(`${pct}% cut`);
    this.skipText.setText(`${100 - pct}% skipped`);
    this.timeText.setText(`⏱ ${this.elapsed.toFixed(1)}s`);
  }

  // ---------- drawing helpers ----------
  // Text that stays sharp when zoomed
  txt(x, y, s, style) {
    return this.add.text(x, y, s, Object.assign({ fontFamily: FONT, resolution: SHARP }, style));
  }

  makeButton(x, y, label, onClick, size = 17) {
    const t = this.txt(0, -1, label, { fontSize: size + 'px', color: '#ffffff', fontStyle: '600' }).setOrigin(0.5);
    const bg = this.add.graphics();
    const c = this.add.container(x, y, [bg, t]);
    const draw = (hover) => {
      const w = t.width + 26, h = t.height + 8;
      bg.clear();
      bg.fillStyle(0x234f19, 1).fillRoundedRect(-w / 2, -h / 2 + 3, w, h, h / 2);   // 3D bottom edge
      bg.fillStyle(hover ? 0x5bb23f : 0x479b33, 1).fillRoundedRect(-w / 2, -h / 2, w, h, h / 2);
      c.setSize(w, h);
      if (c.input) c.input.hitArea.setTo(0, 0, w, h);
    };
    draw(false);
    c.setInteractive({ useHandCursor: true });
    c.on('pointerover', () => draw(true));
    c.on('pointerout', () => draw(false));
    c.on('pointerdown', onClick);
    c.setLabel = (s) => { t.setText(s); draw(false); };
    return c;
  }

  // Builds the pictures we paint with. Uses the browser's normal canvas drawing.
  makeTextures() {
    if (this.textures.exists('grassUncut')) return;   // already made (e.g. after pressing R)
    const S = SHARP, rnd = new Phaser.Math.RandomDataGenerator(['lawn']);

    // --- long, uncut grass ---
    const tex = this.textures.createCanvas('grassUncut', YARD_W * S, YARD_H * S);
    const ctx = tex.getContext();
    ctx.scale(S, S);
    ctx.fillStyle = '#3a7228';
    ctx.fillRect(0, 0, YARD_W, YARD_H);
    // big soft patches so the lawn isn't one flat color
    for (let i = 0; i < 45; i++) {
      const x = rnd.realInRange(0, YARD_W), y = rnd.realInRange(0, YARD_H), r = rnd.realInRange(30, 95);
      const c = rnd.pick(['74,134,48', '44,98,30', '88,142,52', '58,110,36']);
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, `rgba(${c},0.55)`);
      grad.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // thousands of little grass blades
    ctx.lineCap = 'round';
    const blades = ['#2b5c1d', '#336b22', '#3f7d2b', '#4c8c33', '#5a9a3b', '#284f1a'];
    for (const color of blades) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (let i = 0; i < 4500; i++) {
        const x = rnd.frac() * YARD_W, y = rnd.frac() * YARD_H;
        const len = 2.5 + rnd.frac() * 3.5;
        const a = -Math.PI / 2 + (rnd.frac() - 0.5) * 1.3;
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      }
      ctx.stroke();
    }
    // a few dandelions
    for (let i = 0; i < 35; i++) {
      const x = rnd.frac() * YARD_W, y = rnd.frac() * YARD_H;
      ctx.fillStyle = '#f5d63a';
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3a0';
      ctx.beginPath(); ctx.arc(x - 0.4, y - 0.4, 0.6, 0, Math.PI * 2); ctx.fill();
    }
    tex.refresh();

    // --- freshly mowed lawn: short, dense, even grass with a soft sheen ---
    const makeCutLawn = (key, base, sheen, grains, clips) => {
      const t = this.textures.createCanvas(key, YARD_W * S, YARD_H * S);
      const c = t.getContext();
      c.scale(S, S);
      c.fillStyle = base;
      c.fillRect(0, 0, YARD_W, YARD_H);
      // gentle sheen, like sunlight across a lawn
      const lg = c.createLinearGradient(0, 0, YARD_W, YARD_H);
      lg.addColorStop(0, sheen + '0.16)'); lg.addColorStop(0.5, sheen + '0)'); lg.addColorStop(1, sheen + '0.10)');
      c.fillStyle = lg; c.fillRect(0, 0, YARD_W, YARD_H);
      // very soft, low-contrast mottling (healthy lawns are never one flat color)
      for (let i = 0; i < 60; i++) {
        const x = rnd.realInRange(0, YARD_W), y = rnd.realInRange(0, YARD_H), r = rnd.realInRange(20, 70);
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        const col = rnd.pick(['255,255,220', '20,60,10']);
        g.addColorStop(0, `rgba(${col},0.07)`); g.addColorStop(1, `rgba(${col},0)`);
        c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
      }
      // tens of thousands of tiny, short grass tips
      c.lineCap = 'round';
      for (const [color, n, w] of grains) {
        c.strokeStyle = color; c.lineWidth = w;
        c.beginPath();
        for (let i = 0; i < n; i++) {
          const x = rnd.frac() * YARD_W, y = rnd.frac() * YARD_H;
          const len = 0.8 + rnd.frac() * 1.4, a = -Math.PI / 2 + (rnd.frac() - 0.5) * 2.2;
          c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        }
        c.stroke();
      }
      // a sprinkle of drying clippings
      for (const [color, n] of clips) {
        c.strokeStyle = color; c.lineWidth = 0.7;
        c.beginPath();
        for (let i = 0; i < n; i++) {
          const x = rnd.frac() * YARD_W, y = rnd.frac() * YARD_H, a = rnd.frac() * Math.PI, len = 1.5 + rnd.frac() * 2;
          c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        }
        c.stroke();
      }
      t.refresh();
    };
    makeCutLawn('cutLightTex', '#8fcf60', 'rgba(255,255,210,',
      [['#a0db70', 9000, 0.8], ['#7fbd52', 9000, 0.8], ['#b0e483', 6000, 0.7], ['#72ad48', 5000, 0.7], ['#c2ec97', 2500, 0.6]],
      [['#c6dc84', 500], ['#d2e6a0', 300]]);
    makeCutLawn('cutDarkTex', '#4f9433', 'rgba(220,255,200,',
      [['#5ea63c', 9000, 0.8], ['#44842b', 9000, 0.8], ['#6bb447', 6000, 0.7], ['#3b7524', 5000, 0.7], ['#78c052', 2500, 0.6]],
      [['#a9c86e', 500], ['#b8d585', 300]]);

    // --- the mower's "brush": a round deck with tufty, uneven edges ---
    const r = MOWER.deckRadius, size = Math.ceil((r + 3) * 2 * S), m = r + 3;
    const bt = this.textures.createCanvas('brush', size, size);
    const bc = bt.getContext();
    bc.scale(S, S);
    const rg = bc.createRadialGradient(m, m, r - 3, m, m, r);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0.85)');
    bc.fillStyle = rg;
    bc.beginPath(); bc.arc(m, m, r, 0, Math.PI * 2); bc.fill();
    bc.strokeStyle = 'rgba(255,255,255,0.7)'; bc.lineWidth = 0.7; bc.lineCap = 'round';
    bc.beginPath();
    for (let i = 0; i < 140; i++) {               // little grass tips around the edge
      const a = rnd.frac() * Math.PI * 2, d0 = r - 1, d1 = r + 0.5 + rnd.frac() * 2;
      bc.moveTo(m + Math.cos(a) * d0, m + Math.sin(a) * d0);
      bc.lineTo(m + Math.cos(a + 0.05) * d1, m + Math.sin(a + 0.05) * d1);
    }
    bc.stroke();
    bt.refresh();

    // --- a single grass clipping (white, so particles can tint it) ---
    const clip = this.textures.createCanvas('clip', Math.ceil(3 * S), Math.ceil(1.6 * S));
    const cc = clip.getContext();
    cc.fillStyle = '#ffffff';
    cc.fillRect(0, 0, 3 * S, 1.6 * S);
    clip.refresh();
  }

  // The mower, drawn with shapes so it stays sharp. Faces right (+x); handle at the back.
  makeMower(ghost) {
    const P = ghost
      ? { deck: 0x8fcaff, light: 0xc4e4ff, dark: 0x5c9fd8, engine: 0x6a8fb3, cap: 0x9bbad6, handle: 0x9bbad6, grip: 0x6a8fb3, wheel: 0x4d6f8f }
      : { deck: 0xd83a2c, light: 0xf06450, dark: 0x9e281e, engine: 0x2c2c2c, cap: 0x4d4d4d, handle: 0x8a8a8a, grip: 0x1d1d1d, wheel: 0x1a1a1a };
    const g = this.add.graphics();
    if (!ghost) g.fillStyle(0x000000, 0.25).fillRoundedRect(-5, -8, 26, 21, 7);   // shadow on the grass

    // handle
    g.lineStyle(2, P.handle, 1);
    g.lineBetween(-5, -6, -17, -6);
    g.lineBetween(-5, 6, -17, 6);
    g.lineStyle(3.5, P.grip, 1);
    g.lineBetween(-17, -7, -17, 7);

    // wheels (with a little tread)
    for (const [wx, wy] of [[-5, -12.5], [-5, 8.5], [10, -12.5], [10, 8.5]]) {
      g.fillStyle(P.wheel, 1).fillRoundedRect(wx, wy, 8, 4, 1.5);
      g.fillStyle(0x444444, ghost ? 0 : 1).fillRect(wx + 2, wy + 0.5, 1, 3).fillRect(wx + 5, wy + 0.5, 1, 3);
    }

    // deck
    g.fillStyle(P.dark, 1).fillRoundedRect(-7, -10, 26, 20, 8);
    g.fillStyle(P.deck, 1).fillRoundedRect(-7, -10, 26, 18, 8);
    g.fillStyle(P.light, 1).fillRoundedRect(-3, -8, 17, 4, 2);
    // side chute where the clippings come out
    g.fillStyle(P.dark, 1).fillRoundedRect(1, 8, 9, 5, 1.5);

    // engine on top
    g.fillStyle(P.engine, 1).fillCircle(6, 0, 6.5);
    g.fillStyle(P.cap, 1).fillCircle(6, 0, 3.6);
    g.fillStyle(0xffffff, 0.55).fillCircle(4.5, -1.6, 1.2);
    return g;
  }

  drawScenery() {
    const g = this.add.graphics();
    const rnd = this.rnd;

    // ----- Driveway (concrete) -----
    const d = YARD.driveway;
    g.fillStyle(0xbab7ad, 1).fillRect(d.x, d.y, d.w, d.h);
    for (let i = 0; i < 260; i++) {
      g.fillStyle(rnd.pick([0xa8a59b, 0xc8c5bb, 0x9d9a91, 0xd2cfc6]), 1)
       .fillRect(d.x + rnd.frac() * d.w, d.y + rnd.frac() * d.h, 1.2, 1.2);
    }
    g.lineStyle(1.2, 0x8f8c83, 1);
    for (let y = d.y + 70; y < d.y + d.h; y += 70) g.lineBetween(d.x, y, d.x + d.w, y);   // joints
    g.fillStyle(0x6e6b65, 0.22).fillEllipse(d.x + d.w / 2 + 4, d.y + 46, 26, 15);          // oil stain
    g.lineStyle(2, 0x8a877e, 1).strokeRect(d.x, d.y, d.w, d.h);

    // ----- Flower beds -----
    const petals = [0xff6b9a, 0xffd23f, 0xffffff, 0xb57cff, 0xff8a4c];
    for (const b of YARD.beds) {
      g.fillStyle(0x000000, 0.18).fillRoundedRect(b.x - 2, b.y - 1, b.w + 7, b.h + 7, 6);  // shadow
      g.fillStyle(0x9a958a, 1).fillRoundedRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 6);     // stone edging
      for (let x = b.x - 1; x < b.x + b.w; x += 10) {
        g.fillStyle(0xb9b4a8, 1).fillRoundedRect(x, b.y - 3, 8, 2.5, 1).fillRoundedRect(x, b.y + b.h + 0.5, 8, 2.5, 1);
      }
      g.fillStyle(0x5a3c22, 1).fillRoundedRect(b.x, b.y, b.w, b.h, 4);                     // mulch
      for (let i = 0; i < b.w * b.h / 10; i++) {
        g.fillStyle(rnd.pick([0x6d4a2b, 0x48301a, 0x7a5532]), 1)
         .fillRect(b.x + 1 + rnd.frac() * (b.w - 2), b.y + 1 + rnd.frac() * (b.h - 2), 1.3, 1.3);
      }
      for (let i = 0; i < 15; i++) {
        const px = b.x + 8 + rnd.frac() * (b.w - 16), py = b.y + 8 + rnd.frac() * (b.h - 16);
        g.fillStyle(0x2c6522, 1).fillCircle(px + 1, py + 1, 5.5);
        g.fillStyle(0x3d8a2e, 1).fillCircle(px - 0.5, py - 0.5, 4);
        const col = rnd.pick(petals);
        for (let k = 0; k < 5; k++) {
          const a = k / 5 * Math.PI * 2;
          g.fillStyle(col, 1).fillCircle(px + Math.cos(a) * 2.3, py + Math.sin(a) * 2.3, 1.8);
        }
        g.fillStyle(0xffe27a, 1).fillCircle(px, py, 1.2);
      }
    }

    // ----- House (seen from above: a "hip" roof with four slopes) -----
    const h = YARD.house;
    const x0 = h.x, x1 = h.x + h.w, y0 = h.y, y1 = h.y + h.h, cy = h.y + h.h / 2, i = h.h / 2;
    g.fillStyle(0x000000, 0.12).fillRect(x0 + 9, y0 + 10, h.w, h.h);   // soft shadow
    g.fillStyle(0x000000, 0.15).fillRect(x0 + 5, y0 + 6, h.w, h.h);
    const pts = (...a) => a.map(([x, y]) => ({ x, y }));
    g.fillStyle(0xc4603a, 1).fillPoints(pts([x0, y0], [x1, y0], [x1 - i, cy], [x0 + i, cy]), true);   // north slope
    g.fillStyle(0x9a4426, 1).fillPoints(pts([x0, y1], [x1, y1], [x1 - i, cy], [x0 + i, cy]), true);   // south slope
    g.fillStyle(0xd4724a, 1).fillPoints(pts([x0, y0], [x0, y1], [x0 + i, cy]), true);                // west slope (sunny)
    g.fillStyle(0x84381d, 1).fillPoints(pts([x1, y0], [x1, y1], [x1 - i, cy]), true);                // east slope (shady)
    // rows of shingles
    g.lineStyle(1, 0x000000, 0.13);
    for (let y = y0 + 7; y < cy - 1; y += 7) { const k = y - y0; g.lineBetween(x0 + k, y, x1 - k, y); }
    for (let y = y1 - 7; y > cy + 1; y -= 7) { const k = y1 - y; g.lineBetween(x0 + k, y, x1 - k, y); }
    for (let x = x0 + 7; x < x0 + i - 1; x += 7) { const k = x - x0; g.lineBetween(x, y0 + k, x, y1 - k); }
    for (let x = x1 - 7; x > x1 - i + 1; x -= 7) { const k = x1 - x; g.lineBetween(x, y0 + k, x, y1 - k); }
    // ridge and hip lines
    g.lineStyle(2.5, 0x6a2c16, 1);
    g.lineBetween(x0 + i, cy, x1 - i, cy);
    g.lineBetween(x0, y0, x0 + i, cy); g.lineBetween(x0, y1, x0 + i, cy);
    g.lineBetween(x1, y0, x1 - i, cy); g.lineBetween(x1, y1, x1 - i, cy);
    g.lineStyle(2, 0x5e2713, 1).strokeRect(x0, y0, h.w, h.h);
    // chimney
    const chx = x1 - 62, chy = y0 + 22;
    g.fillStyle(0x000000, 0.25).fillRect(chx + 4, chy + 4, 18, 18);
    g.fillStyle(0x8c5546, 1).fillRect(chx, chy, 18, 18);
    g.fillStyle(0x6e3f33, 1).fillRect(chx, chy + 12, 18, 6);
    g.fillStyle(0x2a2422, 1).fillRect(chx + 4, chy + 4, 10, 8);

    // ----- Trees (seen from above: clumps of leaves) -----
    for (const t of YARD.trees) {
      const r = t.r;
      g.fillStyle(0x000000, 0.12).fillCircle(t.x + 10, t.y + 11, r * 0.98);   // shadow
      g.fillStyle(0x000000, 0.16).fillCircle(t.x + 6, t.y + 7, r);
      const n = 9;
      for (let k = 0; k < n; k++) {
        const a = k / n * Math.PI * 2 + rnd.frac() * 0.4;
        g.fillStyle(0x24561a, 1).fillCircle(t.x + Math.cos(a) * r * 0.6, t.y + Math.sin(a) * r * 0.6, r * 0.42);
      }
      g.fillStyle(0x2e6a20, 1).fillCircle(t.x, t.y, r * 0.78);
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2 + rnd.frac() * 0.5;
        g.fillStyle(0x3b842a, 1).fillCircle(t.x - r * 0.15 + Math.cos(a) * r * 0.38, t.y - r * 0.15 + Math.sin(a) * r * 0.38, r * 0.3);
      }
      g.fillStyle(0x52a33a, 0.9).fillCircle(t.x - r * 0.3, t.y - r * 0.32, r * 0.24);
      g.fillStyle(0x6cbd4c, 0.6).fillCircle(t.x - r * 0.36, t.y - r * 0.4, r * 0.1);
    }

    // ----- Wooden fence (with a gap where the driveway meets the street) -----
    const F = 3, R = YARD_W - 3, B = YARD_H - 3;
    g.lineStyle(3, 0xd9c79c, 1);
    g.lineBetween(F, F, R, F);
    g.lineBetween(F, F, F, B);
    g.lineBetween(R, F, R, B);
    g.lineBetween(F, B, d.x, B);
    g.lineBetween(d.x + d.w, B, R, B);
    const post = (px, py) => {
      g.fillStyle(0x000000, 0.2).fillRect(px - 2, py - 2, 6, 6);
      g.fillStyle(0x8a7048, 1).fillRect(px - 3, py - 3, 6, 6);
      g.fillStyle(0xb79e70, 1).fillRect(px - 3, py - 3, 6, 2.5);
    };
    for (let x = F; x <= R; x += 32) { post(x, F); if (x < d.x || x > d.x + d.w) post(x, B); }
    for (let y = F + 32; y < B; y += 32) { post(F, y); post(R, y); }
    post(R, F); post(F, B); post(R, B); post(d.x, B); post(d.x + d.w, B);
    return g;
  }
}

// Start the game — but wait (at most 1.5 seconds) for the font to download first
function startGame() {
  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: YARD_W * SHARP,
    height: (YARD_H + HUD_H) * SHARP,
    backgroundColor: '#14200f',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [YardScene]
  });
}
const fontWait = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('400 16px Fredoka'), document.fonts.load('600 16px Fredoka')])
  : Promise.resolve();
Promise.race([fontWait, new Promise(r => setTimeout(r, 1500))]).then(startGame, startGame);
</script>
</body>
